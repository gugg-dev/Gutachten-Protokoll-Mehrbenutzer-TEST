    if(fixed.some(a=>basicAddress(a)==='Adresse fehlt'||!/\d/.test(basicAddress(a)))){setError('Einem bereits eingetragenen Termin fehlt eine vollständige Besichtigungsadresse.');return;}
    setBusy(true);setProgress('Adressen werden zugeordnet …');
    try{
      const objects=[{id:'office',name:'Studio F – Ausgangspunkt',address:TP_OFFICE,akt:null},
        ...fixed.map(a=>({id:a.id,name:a.schadennummer||a.vn||'Fester Termin',address:basicAddress(a),akt:a}))];
      const geo=[];
      for(const obj of objects){
        setProgress('Adressprüfung: '+obj.name);
        geo.push(await tpGeo(obj.address,key.trim(),geoCache.current));
      }
      for(const a of valid){
        try{
          setProgress('Weitere Aufträge prüfen: '+(a.schadennummer||a.vn||'Ohne Nummer'));
          const g=await tpGeo(basicAddress(a),key.trim(),geoCache.current);
          objects.push({id:a.id,name:a.schadennummer||a.vn||'Offener Auftrag',address:basicAddress(a),akt:a});geo.push(g);
        }catch(e){
          if(requestedMode==='insert')throw e;
          skipped.push({akt:a,reason:'Adresszuordnung nicht möglich: '+(e.message||String(e))});
        }
      }
      setProgress('Straßen-Fahrzeitenmatrix für '+objects.length+' Standorte wird berechnet …');
      const matrix=await tpMatrix(geo.map(x=>x.coordinates),key.trim());
      const anchored=fixed.map((a,i)=>({...a,matrixIndex:i+1}));
      const queued=objects.slice(1+fixed.length).map((x,i)=>({...x.akt,matrixIndex:1+fixed.length+i}));
      let plan;
      if(requestedMode==='auto')plan=tpBuildAutoPlan({fixed:anchored,candidates:queued,durations:matrix.durations,buffer:Number(buffer),visitDuration:Number(visitDuration),earliest:tpMin(departure),first:tpMin(first),last:tpMin(last)});
      else plan=tpBuildPlan({fixed:anchored,candidate:requestedMode==='insert'?queued[0]||null:null,durations:matrix.durations,buffer:Number(buffer),visitDuration:Number(visitDuration),earliest:tpMin(departure),first:tpMin(first),last:tpMin(last)});
      const legs=[];let lastIndex=0,lastEnd=null;
      for(const item of plan.scheduled){
        legs.push({item,travel:tpLeg(matrix.durations,lastIndex,item.matrixIndex,Number(buffer)),distance:Math.round((matrix.distances?.[lastIndex]?.[item.matrixIndex]||0)/100)/10});
        lastIndex=item.matrixIndex;lastEnd=item.end;
      }
      const returnDrive=tpLeg(matrix.durations,lastIndex,0,Number(buffer));
      setResult({date,mode:requestedMode,chosenId:requestedMode==='insert'?selected:'',plan,legs,
        poolIds:pending.filter(a=>tpAvailableForDay(a,date,overrides)).map(a=>a.id),
        geo:objects.map((o,i)=>({...o,...geo[i]})),skipped,deferred,
        returnDrive,backTime:lastEnd==null?null:lastEnd+returnDrive,
        driveTotal:legs.reduce((s,v)=>s+v.travel,0)+returnDrive,computedAt:new Date().toISOString()});
      setProgress('');return true;
    }catch(e){setError((e?.name==='AbortError'?'Der Routendienst hat nicht rechtzeitig geantwortet.':e.message||String(e))+' Es wurden keine Termine verändert.');setProgress('');}
    finally{setBusy(false)}
  };
  const apply=(id)=>{
    const target=result?.mode==='auto'?result.plan.scheduled.find(x=>x.id===id&&x.type==='proposal'):result?.plan?.option?.scheduled.find(x=>x.id===id&&x.type==='proposal');
    const akt=pending.find(a=>a.id===id);
    if(!target||!akt||!tpAvailableForDay(akt,date))return;
    if(!cloud.connected){setError('Bitte OneDrive verbinden, bevor ein Vorschlag ins Terminformular übernommen wird.');return;}
    if(!window.confirm('Vorschlag '+date+' um '+tpClock(target.start)+' Uhr für '+(akt.schadennummer||akt.vn||'diesen Auftrag')+' in das Terminformular übernehmen? Es wird noch keine Outlook-Einladung versendet.'))return;
    onPropose({id:akt.id,date,time:tpClock(target.start),nonce:Date.now()});
  };
  const saveUnavailable=async()=>{
    const a=pending.find(x=>x.id===feedbackId);
    if(!a){setError('Bitte zuerst einen noch offenen Auftrag auswählen.');return;}
    const note=feedbackNote.trim();
    if(!note){setError('Bitte eine Anmerkung zur Nichtverfügbarkeit eingeben, z. B. „Kunde auf Urlaub“.');return;}
    if(!cloud.connected){setError('Zur dauerhaften Speicherung bitte zuerst OneDrive verbinden.');return;}
    if(feedbackUntil&&feedbackUntil<date){setError('Das Enddatum darf nicht vor dem ausgewählten Besichtigungstag liegen.');return;}
    if(result&&result.date!==date){setError('Bitte zuerst die Tour für das gewählte Datum aktualisieren.');return;}
    setSavingFeedback(true);setError('');
    try{
      const fresh=await cloud.readDisposition(a);
      const exceptions={...(fresh?.data?.tourAusnahmen||a.tourAusnahmen||{})};
      const entry={status:'unavailable',note,until:feedbackUntil&&feedbackUntil>=date?feedbackUntil:date,recordedAt:new Date().toISOString()};
      exceptions[date]=entry;
      const next={...a,...dispoMergeFields(fresh?.data||{}),tourAusnahmen:exceptions};
      const saved=await cloud.saveDisposition(next);
      if(!saved?.id)throw new Error('OneDrive hat die Rückmeldung nicht bestätigt.');
      skipNextSignatureInvalidation.current=true;onSaved(next);
      setFeedbackId('');setFeedbackNote('');setFeedbackUntil('');setResult(null);
      setMode('auto');
      setNotice((a.schadennummer||a.vn||'Auftrag')+' wurde für '+dDE(date)+(entry.until!==date?' bis '+dDE(entry.until):'')+' aus der Tour ausgeschlossen.');
      // Die lokale Ausnahme wird sofort in derselben Neuberechnung angewendet;
      // ein verzögertes React-/OneDrive-Update ist dafür nicht erforderlich.
      const recalculated=await berechnen('auto',{[a.id]:entry});
      setNotice((a.schadennummer||a.vn||'Auftrag')+' ist für '+dDE(date)+(entry.until!==date?' bis '+dDE(entry.until):'')+' ausgeschlossen. '+(recalculated?'Die Tour wurde neu berechnet.':'Bitte die angezeigten Hinweise prüfen und danach die Tour erneut berechnen.'));
    }catch(e){setError('Rückmeldung konnte nicht gespeichert werden: '+(e.message||String(e)));}
    finally{setSavingFeedback(false)}
  };
  const restore=async(a,entry)=>{
    if(!cloud.connected){setError('Bitte zuerst OneDrive verbinden.');return;}
    setSavingFeedback(true);setError('');
    try{
      const fresh=await cloud.readDisposition(a);
      const exceptions={...(fresh?.data?.tourAusnahmen||a.tourAusnahmen||{})};
      delete exceptions[entry.from];
      const next={...a,...dispoMergeFields(fresh?.data||{}),tourAusnahmen:exceptions};
      const saved=await cloud.saveDisposition(next);
      if(!saved?.id)throw new Error('OneDrive hat die Freigabe nicht bestätigt.');
      skipNextSignatureInvalidation.current=true;onSaved(next);setMode('auto');setResult(null);
      const recalculated=await berechnen('auto',{[a.id]:null});
      setNotice((a.schadennummer||a.vn||'Auftrag')+' wird wieder berücksichtigt. '+(recalculated?'Die Tour wurde neu berechnet.':'Bitte die angezeigten Hinweise prüfen und danach die Tour erneut berechnen.'));
    }catch(e){setError('Die erneute Freigabe ist fehlgeschlagen: '+(e.message||String(e)));}
    finally{setSavingFeedback(false)}
  };
  const snapshot=result?tpSnapshotStatus(result,akten):null;
  const acceptedIds=snapshot?.acceptedIds||new Set();
  const liveLegs=result?.legs?.map(leg=>({
    ...leg,item:acceptedIds.has(leg.item.id)?{...leg.item,type:'fixed',acceptedFromTour:true,
      outlookStatus:akten.find(a=>a.id===leg.item.id)?.terminAuftrag?.status||''}:leg.item
  }))||[];
  const remainingProposals=liveLegs.filter(leg=>leg.item.type==='proposal').length;
  const acceptedProposals=acceptedIds.size;
  return <div className="ad-panel-content tp-panel">
    <div className="tp-rule"><strong>Automatische Tour:</strong> Fester Start- und Endpunkt jeder Tour: Heimatadresse {TP_OFFICE}. Der Planer versucht, möglichst viele offene Aufträge zeitlich passend unterzubringen und anschließend den Fahrbedarf zu verringern. Bestehende, bereits terminierte Besichtigungen sind unveränderliche Fixpunkte. Die Optimierung ist eine fahrzeitbasierte Heuristik, keine Garantie des mathematisch kürzesten Weges. Outlook-Kundenfenster: 120 Min.; interne Besichtigung standardmäßig 30 Min. Alle Wochentage sind möglich.</div>
    <div className="tp-field"><label>Planungsart</label><div className="tp-mode" role="group" aria-label="Planungsart">
      <button type="button" className={'ad-btn '+(mode==='auto'?'ad-yellow':'')} onClick={()=>setMode('auto')}>Neue Gesamttour automatisch</button>
      <button type="button" className={'ad-btn '+(mode==='insert'?'ad-yellow':'')} onClick={()=>setMode('insert')}>Einzelauftrag nachträglich ergänzen</button>
      <button type="button" className={'ad-btn '+(mode==='existing'?'ad-yellow':'')} onClick={()=>setMode('existing')}>Bestehende Tour prüfen</button>
    </div></div>
    <div className="tp-toolbar"><div className="tp-field"><label htmlFor="tp-date">Besichtigungstag (frei wählbar)</label><input id="tp-date" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div className="tp-days"><button type="button" className="ad-btn ad-sm" onClick={()=>setDate(tpNextWeekday(2))}>Nächster Dienstag</button><button type="button" className="ad-btn ad-sm" onClick={()=>setDate(tpNextWeekday(3))}>Nächster Mittwoch</button></div></div>
    <div className="tp-meta"><span>{dDE(date)} · {['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][adDateWeekday(date)]||'Tag wählen'}</span><span>{fixed.length} feste Termine</span><span>{available.length} verfügbare offene Aufträge</span><span>{blocked.length} für diesen Tag ausgeschlossen</span></div>
    <div className="tp-rule"><strong>Feste Termine für diesen Tag:</strong>
      {fixed.length?<div style={{display:'grid',gap:5,marginTop:7}}>{fixed.map(a=><div key={a.id}><strong>{a.besichtigungZeit}–{adZeitPlusMinuten(a.besichtigungZeit,120)} Uhr</strong> · {a.schadennummer||a.aktenzeichen||a.vn||'Auftrag'} · {assistenzAdresse(a)} {a.terminAuftrag?.status==='sent'?'(Outlook bestätigt)':a.terminAuftrag?.status==='queued'?'(Outlook ausstehend)':'(Disposition)'}</div>)}</div>:<div className="ad-tiny">Für dieses Datum sind noch keine Termine eingetragen. Der Planer kann eine neue Tour erstellen.</div>}
      <small className="ad-tiny">Die bestätigten Startzeiten werden von der Tourenplanung nie automatisch verändert. Vor Berechnung gegebenenfalls „OneDrive aktualisieren“ wählen.</small>
    </div>
    {mode==='insert'&&<div className="tp-field"><label htmlFor="tp-new-case">Einzelnen Auftrag zur Einfügung auswählen</label><select id="tp-new-case" value={selected} onChange={e=>setSelected(e.target.value)}><option value="">Bitte Auftrag auswählen</option>{selected&&!pending.some(a=>a.id===selected)&&acceptedIds.has(selected)&&<option value={selected}>Übernommener Auftrag · bereits bestätigt</option>}
      {available.map(a=><option key={a.id} value={a.id}>{a.schadennummer||a.aktenzeichen||'Ohne Nummer'} · {a.vn||a.bezeichnung||'VN fehlt'} · {assistenzAdresse(a)}</option>)}</select></div>}
    <div className="tp-toolbar"><div className="tp-field"><label>Abfahrt frühestens</label><input type="text" inputMode="numeric" maxLength={5} placeholder="HH:MM" value={departure} onChange={e=>setDeparture(e.target.value)}/></div>
      <div className="tp-field"><label>Erster Termin frühestens</label><input type="text" inputMode="numeric" maxLength={5} placeholder="HH:MM" value={first} onChange={e=>setFirst(e.target.value)}/></div>
      <div className="tp-field"><label>Interne Tour endet spätestens</label><input type="text" inputMode="numeric" maxLength={5} placeholder="HH:MM" value={last} onChange={e=>setLast(e.target.value)}/></div>
      <div className="tp-field"><label>Interne Besichtigung je Objekt</label><select value={visitDuration} onChange={e=>setVisitDuration(Number(e.target.value))}>{[30,45,60,120].map(v=><option value={v} key={v}>{v} Minuten</option>)}</select></div>
      <div className="tp-field"><label>Fahrtpuffer je Strecke</label><select value={buffer} onChange={e=>setBuffer(Number(e.target.value))}>{[0,5,10,15,20].map(v=><option value={v} key={v}>{v} Minuten</option>)}</select></div></div>
    <div className="tp-field"><label htmlFor="tp-key">Externer Routendienst: persönlicher HeiGIT/openrouteservice-API-Schlüssel</label><div className="tp-key"><input type="password" id="tp-key" value={key} onChange={e=>keyChange(e.target.value)} autoComplete="off" placeholder="Eigenen API-Schlüssel eingeben"/><a href="https://account.heigit.org/" target="_blank" rel="noreferrer">Schlüssel beantragen ↗</a></div><small className="ad-tiny">Der Schlüssel bleibt ausschließlich in der Browser-Sitzung. Adressen werden nur nach Zustimmung an HeiGIT übermittelt.</small></div>
    <label className="tp-privacy"><input type="checkbox" checked={consent} onChange={e=>setConsent(e.target.checked)}/><span>Ich stimme zu, dass die für diese Tour erforderlichen Besichtigungsadressen für Geokodierung und Straßenfahrtzeiten an HeiGIT übertragen werden. Die Berechnung löst keinen Outlook-Versand aus.</span></label>
    <div><button type="button" className="ad-btn ad-dark" disabled={busy||savingFeedback} onClick={()=>berechnen(mode)}>{busy?'Berechnung läuft …':mode==='auto'?'↻ Gesamttour automatisch optimieren':mode==='insert'?'＋ Beste Einfügestelle berechnen':'↻ Bestehende Tagestour prüfen'}</button></div>
    {busy&&<div className="ad-calendar-note" role="status">{progress}</div>}
    {notice&&<div className="tp-ok" role="status">{notice}</div>}
    {error&&<div className="tp-error" role="alert">{error}</div>}
    {result&&<>
      <div className="tp-result-head"><strong>Berechnete Tour · {dDE(result.date)}</strong><span className="ad-pill ad-confirmed">Straßen-Fahrzeiten + {buffer} Min. Puffer</span></div>
      {result.mode==='auto'&&<div className="tp-ok"><strong>Automatischer Vorschlag:</strong> {remainingProposals} noch offene Vorschläge, {acceptedProposals} aus dieser Tour übernommen und {liveLegs.filter(leg=>leg.item.type==='fixed'&&!leg.item.acceptedFromTour).length} ursprünglich feste Termine. {result.plan.unplanned?.length||0} geografisch/zeitlich derzeit nicht passende Aufträge; {result.skipped.length} Adressfälle ausgenommen; {result.deferred.length} weitere offene Aufträge wegen Berechnungsumfang zurückgestellt.</div>}
      {result.plan.conflicts.length>0&&<div className="tp-error"><strong>Konflikt bei festen Terminen:</strong>{result.plan.conflicts.map((m,i)=><div key={i}>{m}</div>)} Keine bestehende Einladung wurde verändert.</div>}
      {result.chosenId&&!result.plan.option&&!result.plan.conflicts.length&&<div className="tp-warning">Für diesen Einzelauftrag wurde keine passende Lücke gefunden. Bitte einen anderen Tag oder andere feste Termine prüfen.</div>}
      {result.plan.option&&<div className="tp-ok"><strong>Einfügestelle:</strong> {tpClock(result.plan.option.start)}–{tpClock(result.plan.option.end)} Uhr; zusätzliche Fahrt ungefähr {result.plan.option.extra} Minuten.</div>}
      <div className="tp-route">
        <div className="tp-slot"><div className="tp-clock">Start</div><div className="tp-slot-body"><strong>Heimatadresse · Startpunkt {TP_OFFICE}</strong><small>{liveLegs.length?'Späteste Abfahrt: '+(liveLegs[0].item.start-liveLegs[0].travel>=0?tpClock(liveLegs[0].item.start-liveLegs[0].travel):'vor 00:00'):'Keine Besichtigung an diesem Tag'}</small></div></div>
        {liveLegs.map(leg=><React.Fragment key={leg.item.id}><div className="tp-leg">↳ Fahrt {Number.isFinite(leg.travel)?leg.travel+' Min. inkl. Puffer':'nicht berechenbar'} · ca. {leg.distance} km</div>
          <div className="tp-slot"><div className="tp-clock">{tpClock(leg.item.start)}</div><div className={'tp-slot-body '+(leg.item.type==='proposal'?'tp-new':'tp-fixed')}><strong>{leg.item.type==='proposal'?'＋ Vorschlag: ':leg.item.acceptedFromTour?'✓ Aus Tour übernommen: ':'✓ Fester Termin: '}{leg.item.schadennummer||leg.item.vn||leg.item.bezeichnung||'Akt'}</strong>
            <small>{assistenzAdresse(leg.item)}</small><small>Intern: {tpClock(leg.item.start)}–{tpClock(leg.item.end)} Uhr · Outlook-Kundenfenster: {tpClock(leg.item.start)}–{adZeitPlusMinuten(tpClock(leg.item.start),120)} Uhr</small>
            {leg.item.acceptedFromTour&&<small>{leg.item.outlookStatus==='sent'?'Outlook-Einladung versendet.':leg.item.outlookStatus==='queued'?'Terminauftrag in OneDrive bereitgestellt · Outlook-Rückmeldung ausstehend.':'Termin im Akt eingetragen.'} Die übrige Tour bleibt erhalten.</small>}
            {leg.item.type==='proposal'&&<div className="tp-slot-actions"><button type="button" className="ad-btn ad-yellow ad-sm" onClick={()=>apply(leg.item.id)}>Vorschlag ins Terminformular übernehmen →</button><button type="button" className="ad-btn ad-sm" onClick={()=>{setFeedbackId(leg.item.id);setFeedbackNote('');setFeedbackUntil(date);document.getElementById('tp-feedback')?.scrollIntoView({behavior:'smooth',block:'center'});}}>Kunde nicht verfügbar …</button></div>}
          </div></div>
        </React.Fragment>)}
        {!!result.legs.length&&<><div className="tp-leg">↳ Rückfahrt ins Büro: {Number.isFinite(result.returnDrive)?result.returnDrive+' Min. inkl. Puffer':'nicht berechenbar'}</div><div className="tp-slot"><div className="tp-clock">{result.backTime!=null&&result.backTime<1440?tpClock(result.backTime):'–'}</div><div className="tp-slot-body"><strong>Voraussichtliche Rückkehr · Heimatadresse {TP_OFFICE}</strong><small>Fahrzeiten ohne Live-Verkehr. Keine automatische Outlook-Änderung.</small></div></div></>}
      </div>
      {!!result.plan.unplanned?.length&&<div className="tp-warning"><strong>Nicht mehr zeitlich passende offene Aufträge:</strong>{result.plan.unplanned.map(a=><div key={a.id}>• {a.schadennummer||a.vn||'Ohne Nummer'} · {assistenzAdresse(a)}</div>)}Diese bleiben offen und können an anderen Tagen erneut berücksichtigt werden.</div>}
      {!!result.skipped.length&&<div className="tp-warning"><strong>Ohne verwertbare Adresse nicht eingeplant:</strong>{result.skipped.map(x=><div key={x.akt.id}>• {x.akt.schadennummer||x.akt.vn}: {x.reason}</div>)}</div>}
      {!!result.deferred.length&&<div className="tp-warning"><strong>Weitere Aufträge:</strong> Aufgrund der Beschränkung auf 25 Matrixstandorte konnten {result.deferred.length} offene Aufträge in diesem Durchlauf noch nicht geprüft werden. Bitte nach Übernahme der vorgeschlagenen Termine neu berechnen.</div>}
      <div className="tp-quality"><strong>Geprüfte Adresszuordnung:</strong>{result.geo.map(g=><div key={g.id}>{g.name}: {g.label} {g.accuracy?'('+g.accuracy+')':''}</div>)}Bitte insbesondere gleichnamige Straßen kontrollieren.</div>
    </>}
    <div className="tp-feedback" id="tp-feedback">
      <strong>Kundenrückmeldung – Auftrag für die aktuelle Tour ausschließen</strong>
      <div className="ad-sub">Beispiel: Kunde telefonisch nicht erreichbar, auf Urlaub oder am ausgewählten Tag nicht verfügbar. Die Anmerkung wird beim Akt in OneDrive gespeichert. Nach erfolgreicher Speicherung wird die Gesamttour automatisch neu berechnet.</div>
      <div className="tp-field"><label htmlFor="tp-feedback-case">Betroffener Auftrag</label><select id="tp-feedback-case" value={feedbackId} onChange={e=>{setFeedbackId(e.target.value);setFeedbackNote('');setFeedbackUntil(date);}}><option value="">Offenen Auftrag auswählen</option>{available.map(a=><option value={a.id} key={a.id}>{a.schadennummer||a.aktenzeichen||'Ohne Nummer'} · {a.vn||a.bezeichnung||'VN fehlt'}</option>)}</select></div>
      <div className="tp-field"><label htmlFor="tp-feedback-note">Anmerkung (Pflichtfeld)</label><textarea id="tp-feedback-note" rows={2} value={feedbackNote} onChange={e=>setFeedbackNote(e.target.value)} placeholder="z. B. Kunde bis 15.10. auf Urlaub; Rückruf ab 16.10. vereinbart"/></div>
      <div className="tp-toolbar"><div className="tp-field"><label htmlFor="tp-feedback-until">Ausnehmen bis einschließlich (optional)</label><input type="date" id="tp-feedback-until" min={date} value={feedbackUntil||date} onChange={e=>setFeedbackUntil(e.target.value)}/></div>
        <button type="button" className="ad-btn ad-dark" disabled={!feedbackId||savingFeedback||busy} onClick={saveUnavailable}>{savingFeedback?'Rückmeldung wird gespeichert …':'Kunde nicht verfügbar · speichern & Tour neu berechnen'}</button></div>
    </div>
    {!!blocked.length&&<div className="tp-blocked"><strong>Für {dDE(date)} ausgenommene Aufträge ({blocked.length})</strong>
      {blocked.map(({akt:a,entry})=><div className="tp-blocked-item" key={a.id}><div><b>{a.schadennummer||a.aktenzeichen||a.vn||'Auftrag'}</b> · {a.vn||a.bezeichnung||''}<small>{entry.note} · ausgenommen {dDE(entry.from)}{entry.until&&entry.until!==entry.from?' bis '+dDE(entry.until):''}</small></div>
        <button type="button" className="ad-btn ad-sm" disabled={savingFeedback||busy} onClick={()=>restore(a,entry)}>Wieder berücksichtigen & neu berechnen</button></div>)}
    </div>}
    <div className="tp-quality">Diese Heuristik maximiert zunächst die Zahl der in den Tag passenden Aufträge und bevorzugt dann weniger Fahrzeit. Sie ist kein Ersatz für eine abschließende Terminvereinbarung. Externe Outlook-Ereignisse und Live-Verkehr werden nicht abgefragt. Kein Vorschlag versendet ohne anschließende ausdrückliche Bestätigung eine Einladung.</div>
  </div>;
}

function AssistenzDashboard({akten,go,neu,cloud,syncCloud,onSaved,toast}) {
  const [q,setQ]=useState('');
  const [f,setF]=useState('alle');
  const [selectedId,setSelectedId]=useState('');
  const [tourTarget,setTourTarget]=useState(null);
  const [tourFormCase,setTourFormCase]=useState(null);
  const [tourReturnNotice,setTourReturnNotice]=useState('');
  const [area,setArea]=useState('dashboard');
  const [receiptError,setReceiptError]=useState('');
  // Aktuelle Funktionen referenzieren, ohne den Intervall bei jedem Render neu zu starten.
  const reconcileRef=useRef(cloud.reconcileTerminInvitation);
  reconcileRef.current=cloud.reconcileTerminInvitation;
  const reconcileChangeRef=useRef(cloud.reconcileTerminChange);
  reconcileChangeRef.current=cloud.reconcileTerminChange;
  const onSavedRef=useRef(onSaved);
  onSavedRef.current=onSaved;
  const pending=akten.filter(a=>statusKey(a)!=='abgelegt'&&(
    (['queued','sent'].includes(a.terminAuftrag?.status)&&a.terminAuftrag?.requestId&&(a.terminAuftrag.status==='queued'||statusKey(a)==='offen'))||
    (['preparing','queued'].includes(a.terminAenderung?.status)&&a.terminAenderung?.requestId)
  ));
  const pendingKey=pending.map(a=>(a.cloudItemId||a.id)+':'+(a.terminAuftrag?.status==='queued'?a.terminAuftrag.requestId:'')+':'+(['preparing','queued'].includes(a.terminAenderung?.status)?a.terminAenderung.requestId:'')).join('|');
  useEffect(()=>{
    if(!cloud.connected||!pending.length)return;
    let inactive=false,checking=false;
    const check=async()=>{
      if(inactive||checking)return;
      checking=true;
      try{
        for(const a of pending){
          let complete=null;
          if(['queued','sent'].includes(a.terminAuftrag?.status))complete=await reconcileRef.current(a);
          if(complete)onSavedRef.current(complete);
          if(inactive)return;
          const checkAkt=complete||a;
          if(['preparing','queued'].includes(checkAkt.terminAenderung?.status)){
            const changed=await reconcileChangeRef.current(checkAkt);
            if(changed)onSavedRef.current(changed);
          }
          if(inactive)return;
        }
        if(!inactive)setReceiptError('');
      }catch(e){if(!inactive)setReceiptError('Outlook-Rückmeldung: '+(e.message||String(e)));}
      finally{checking=false;}
    };
    check();
    const timer=setInterval(check,15000);
    return()=>{inactive=true;clearInterval(timer);};
  },[cloud.connected,pendingKey]);
  const offen=akten.filter(a=>statusKey(a)!=='abgelegt');
  const gefiltert=offen.filter(a=>{
    const hay=[a.schadennummer,a.aktenzeichen,a.vn,a.geschaedigter,a.bezeichnung,a.versicherung,a.strasse,a.adresse,a.plz,a.ort,a.kontaktName,a.kontaktTelefon,a.anmerkungen].join(' ').toLowerCase();
    if(q&&!hay.includes(q.toLowerCase()))return false;
    if(f==='alle')return true;
    if(f==='besichtigung')return statusKey(a)==='tagesbesichtigung';
    if(f==='besichtigt')return statusKey(a)==='besichtigt';
    return statusKey(a)==='offen'&&(a.dispoStatus||'neu')===f;
  }).slice().sort((a,b)=>(b.geaendert||b.erstellt||'').localeCompare(a.geaendert||a.erstellt||''));
  const toggle=id=>{
    if(selectedId===id&&tourFormCase?.id===id)setTourFormCase(null);
    setSelectedId(prev=>prev===id?'':id);
  };
  const backToTour=()=>{
    setSelectedId('');setTourTarget(null);setTourFormCase(null);setArea('tour');
    window.requestAnimationFrame(()=>document.getElementById('ad-tour')?.scrollIntoView({behavior:'smooth',block:'start'}));
  };
  const count=k=>offen.filter(a=>statusKey(a)==='offen'&&(a.dispoStatus||'neu')===k).length;
  const jump=(id)=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
  const nav=(key)=>{
    setArea(key);
    if(key==='new'){setTourFormCase(null);neu();return;}
    if(key==='overview'){setF('alle');jump('ad-orders');return;}
    if(key==='tour'){setTourFormCase(null);jump('ad-tour');return;}
    if(key==='day'){setF('besichtigung');jump('ad-orders');return;}
    if(key==='done'){setF('besichtigt');jump('ad-orders');return;}
  };
  return <div className="ad-shell">
    <aside className="ad-side" aria-label="Disposition Navigation">
      <div className="ad-logo"><span className="ad-logo-mark">SF.</span><div><strong>STUDIO F ZT</strong><small>Aufträge & Disposition</small></div></div>
      <div><p className="ad-side-label">Arbeitsbereich</p><nav className="ad-nav">
        <button type="button" className={area==='dashboard'||area==='overview'?'ad-active':''} onClick={()=>{setArea('dashboard');setF('alle');window.scrollTo({top:0,behavior:'smooth'});}}>▦ &nbsp; Dashboard</button>
        <button type="button" onClick={()=>nav('new')}>＋ &nbsp; Neuer Auftrag</button>
        <button type="button" className={area==='tour'?'ad-active':''} onClick={()=>nav('tour')}>◫ &nbsp; Tourenplanung</button>
        <button type="button" className={area==='day'?'ad-active':''} onClick={()=>nav('day')}>▣ &nbsp; Tagesbesichtigung</button>
        <button type="button" className={area==='done'?'ad-active':''} onClick={()=>nav('done')}>✓ &nbsp; Besichtigt</button>
        <button type="button" onClick={()=>go({mode:'start'})}>← &nbsp; Gutachten-App</button>
      </nav></div>
      <div className="ad-side-foot"><b>INTEGRIERT · STUFE 3</b>Gesamttour-Optimierung · Kundenrückmeldungen · Outlook-Termine.</div>
    </aside>
    <main className="ad-main">
      <div className="ad-heading"><div><div className="ad-eyebrow">Studio F / Disposition</div><h1>Auftragsübersicht</h1><div className="ad-sub">Aufträge erfassen · Besichtigungstage frei wählen · Termine bestätigen</div></div>
        <div className="ad-head-actions"><span className={'ad-cloud '+(cloud.connected?'ad-online':'')}>{cloud.connected?'ONEDRIVE VERBUNDEN':'ONEDRIVE NICHT VERBUNDEN'}</span><button type="button" className="ad-btn" onClick={syncCloud} disabled={!cloud.connected}>↻ OneDrive aktualisieren</button><button type="button" className="ad-btn ad-yellow" onClick={neu}>＋ Auftrag anlegen</button></div>
      </div>
      {receiptError&&<div className="ad-alert" role="status">{receiptError} – Bitte OneDrive-Verbindung und Ergebnisordner prüfen.</div>}
      <div className="ad-metrics" aria-label="Kennzahlen">
        <div className="ad-metric"><div className="ad-sub">Neue Aufträge</div><div className="ad-value">{count('neu')}</div><div className="ad-tiny">Noch nicht kontaktiert</div></div>
        <div className="ad-metric"><div className="ad-sub">Termin offen</div><div className="ad-value">{count('kontaktaufnahme')+count('terminabstimmung')+count('terminvorschlag')}</div><div className="ad-tiny">Kontaktaufnahme / Abstimmung</div></div>
        <div className="ad-metric"><div className="ad-sub">Termine disponiert</div><div className="ad-value">{offen.filter(a=>tpBooked(a)).length}</div><div className="ad-tiny">Alle sieben Wochentage</div></div>
        <div className="ad-metric"><div className="ad-sub">Tourenfähig / offen</div><div className="ad-value">{offen.filter(tpMayInsert).length}</div><div className="ad-tiny">Noch ohne Besichtigungstermin</div></div>
      </div>
      <div className="ad-columns">
        <section className="ad-panel" id="ad-orders"><div className="ad-panel-head"><div><h2>Aufträge</h2><div className="ad-sub">Gemeinsame Fälle aus der Gutachten-App</div></div><button type="button" className="ad-btn ad-sm" onClick={syncCloud} disabled={!cloud.connected}>↻ Aktualisieren</button></div>
          <div className="ad-tools"><input aria-label="Aufträge suchen" className="ad-search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Suche: VN, Nummer, Ort, Telefon …"/>
            <select className="ad-select" aria-label="Statusfilter" value={f} onChange={e=>setF(e.target.value)}><option value="alle">Alle Bearbeitungsstatus</option>{DISPO_STATUS.map(x=><option key={x[0]} value={x[0]}>{x[1]}</option>)}<option value="besichtigung">In Tagesbesichtigung</option><option value="besichtigt">Besichtigt</option></select>
          </div>
          <div className="ad-table-wrap"><table className="ad-table"><thead><tr><th>Auftrag / Versicherung</th><th>VN / Anspruchsteller</th><th>Besichtigungsadresse</th><th>Bearbeitungsstatus</th><th>Berichtsfrist</th></tr></thead><tbody>
            {!gefiltert.length&&<tr><td colSpan={5} className="ad-empty">Keine passenden Aufträge. Gegebenenfalls „OneDrive aktualisieren“ wählen.</td></tr>}
            {gefiltert.map(a=><React.Fragment key={a.id}>
              <tr className={selectedId===a.id?'ad-open-row':''} onClick={()=>toggle(a.id)} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(a.id);}}} tabIndex={0} aria-expanded={selectedId===a.id} aria-controls={'ad-expanded-'+a.id}>
                <td><span className="ad-expander">{selectedId===a.id?'▾':'▸'}</span><span className="ad-case">{a.schadennummer||a.aktenzeichen||'Ohne Nummer'}</span><div className="ad-tiny">{a.versicherung||'—'}</div></td>
                <td><div className="ad-person">{a.vn||a.bezeichnung||'Ohne VN'}</div><div className="ad-tiny">AS: {a.geschaedigter||'ident mit VN'}</div></td>
                <td>{assistenzAdresse(a)}</td><td><span className={'ad-pill '+assistenzStatusStyle(a)}>{dispoLabel(a)}</span>{a.besichtigungDatum&&<div className="ad-tiny">{a.besichtigungDatum}{a.besichtigungZeit?' · '+a.besichtigungZeit+'–'+(a.besichtigungBis||adZeitPlusMinuten(a.besichtigungZeit,120))+' Uhr':''}</div>}{['preparing','queued'].includes(a.terminAenderung?.status)&&<div className="ad-change-pending">Vorgeschlagen: {a.terminAenderung.newDate} · {a.terminAenderung.newTime} Uhr</div>}</td>
                <td><span className={adDeadlineClass(adFristInfo(a).kind)}>{adFristInfo(a).text}{adFristInfo(a).due&&<span style={{display:'block',fontSize:10,fontWeight:500}}>bis {adFristInfo(a).due}</span>}</span>
                  <div className="ad-report-track" aria-label="Manuell dokumentierter Berichtsstatus">
                    <span className={'ad-report-pill '+(a.berichtAbgelegt===true?'is-saved':'is-open')}>{a.berichtAbgelegt===true?'✓ Bericht abgelegt':'○ Bericht nicht abgelegt'}</span>
                    {a.fristErstberichtVersendet===true&&<span className="ad-report-sub">✓ Erstbericht versendet</span>}
                    {a.fristNachrichtVersendet===true&&<span className="ad-report-sub">✓ Nachricht versendet</span>}
                  </div>
                  {a.fristNichtMoeglich===true&&<div className="ad-frist-list-note">Frist voraussichtlich nicht einhaltbar</div>}</td>
              </tr>
              {selectedId===a.id&&<tr className="ad-expanded-row" id={'ad-expanded-'+a.id} key={'detail-'+a.id}><td colSpan={5}><AssistenzDetails key={a.id} akt={a} cloud={cloud} onSaved={onSaved} go={go} toast={toast} alleAkten={akten} tourTarget={tourTarget?.id===a.id?tourTarget:null} onTourTargetUsed={()=>setTourTarget(null)}
                onTerminSaved={saved=>{
                  if(!tourFormCase||tourFormCase.id!==saved.id)return;
                  const same=saved.besichtigungDatum===tourFormCase.date&&saved.besichtigungZeit===tourFormCase.time;
                  setTourReturnNotice(same?
                    'Terminauftrag für '+(saved.schadennummer||saved.vn||'')+' um '+saved.besichtigungZeit+' Uhr gespeichert. Outlook-Rückmeldung ausstehend; die restlichen Tourenvorschläge bleiben erhalten.':
                    'Termin gespeichert, jedoch mit abweichender Uhrzeit. Aus Sicherheitsgründen bitte die Tour neu berechnen.');
                  backToTour();
                }} /></td></tr>}
            </React.Fragment>)}
          </tbody></table></div>
          <div className="ad-hint">Auftrag anklicken: Bearbeitung, Besichtigungstermin und Dateiupload öffnen sich direkt unter der ausgewählten Zeile.</div>
        </section>
        <section className="ad-panel" id="ad-tour"><div className="ad-panel-head"><div><h2>Automatische Tourenplanung & Kundenrückmeldungen</h2><div className="ad-sub">Neue Gesamttour optimieren · feste Termine respektieren · Rückmeldungen sofort neu berechnen</div></div></div>
          {tourReturnNotice&&<div className="tp-ok" style={{margin:'12px 18px 0'}} role="status">{tourReturnNotice}</div>}
          <TourenPlaner akten={akten} cloud={cloud} onSaved={onSaved} onPropose={target=>{
            setTourReturnNotice('');setTourFormCase(target);setTourTarget(target);setArea('overview');setF('alle');setQ('');setSelectedId(target.id);
            window.requestAnimationFrame(()=>document.getElementById('ad-orders')?.scrollIntoView({behavior:'smooth',block:'start'}));
          }}/>
        </section>
      </div>
      <div className="ad-flow"><span>1 · Auftrag anlegen</span><i>→</i><span>2 · Tag & Tour berechnen</span><i>→</i><span>3 · Termin vereinbaren</span><i>→</i><span>4 · Outlook-Einladung</span><i>→</i><span>5 · 000_Tagesbesichtigung</span></div>
      <div className="ad-legend">Die Tourenplanung berücksichtigt die eingetragenen Termine. Neue Tourenvorschläge werden erst im Terminformular und nur nach ausdrücklicher Bestätigung als Outlook-Auftrag gespeichert. Nach Versandbestätigung wechselt der Akt nach 000_Tagesbesichtigung.</div>
    </main>
  </div>;
}

/* ============================================================
   7  AKTANSICHT / DASHBOARD / EXPLORER
   ============================================================ */
function AktView({ akt, ordner, setAkt, go, loeschAkt, toast, cloud, agent, sourceDriveItemId='', sourceFileName='', photoProtId='', photoUnitId='', photoRoomId='', photoFromForm=false, photoReturnStep=0 }) {
  const s = (k,v) => setAkt(Object.assign({},akt,{[k]:v,geaendert:new Date().toISOString()}));
  const prots = akt.protokolle || [];
  const [busyMove,setBusyMove]=useState(false);
  const [stammBusy,setStammBusy]=useState(false),[stammMsg,setStammMsg]=useState('');
  const workflowEntry=(from,to)=>({from,to,at:new Date().toISOString()});
  const [cats,setCats]=useState([]);
  const [cat,setCat]=useState(akt.ablageKategorie||akt.schadensart||'');
  const fristFelder=['fristTage','berichtVersendetAm','berichtAbgelegt','fristNichtMoeglich','fristNachrichtVersendet','fristErstberichtVersendet','fristKommentar'];
  const [svFrist,setSvFrist]=useState(()=>Object.fromEntries(fristFelder.map(k=>[k,akt[k]??''])));
  const [svFristBusy,setSvFristBusy]=useState(false),[svFristMsg,setSvFristMsg]=useState('');
  const svEdit=(k,v)=>setSvFrist(x=>Object.assign({},x,{[k]:v}));
  useEffect(()=>{let inactive=false;if(!cloud.connected)return;
    cloud.readDisposition(akt).then(r=>{if(!inactive&&r?.data){setSvFrist(prev=>Object.assign({},prev,Object.fromEntries(fristFelder.filter(k=>Object.prototype.hasOwnProperty.call(r.data,k)).map(k=>[k,r.data[k]]))));}}).catch(()=>{});
    return()=>{inactive=true;};
  },[akt.id,akt.cloudItemId,cloud.connected]);
  const svFristSpeichern=async()=>{
    if(!cloud.connected)return;
    setSvFristBusy(true);setSvFristMsg('');
    try{
      const fresh=await cloud.readDisposition(akt);
      const next=Object.assign({},akt,dispoMergeFields(fresh?.data||{}),svFrist,{dispoGeaendert:new Date().toISOString()});
      const saved=await cloud.saveDisposition(next);
      if(!saved?.id)throw new Error('OneDrive hat den Fristvermerk nicht bestätigt.');
      setAkt(next);setSvFristMsg('In OneDrive gespeichert. Kein automatischer E-Mail-Versand.');
    }catch(e){setSvFristMsg('Speichern fehlgeschlagen: '+(e.message||String(e)));}
    finally{setSvFristBusy(false);}
  };

  useEffect(()=>{ if(cloud.connected) cloud.archiveCategories().then(setCats).catch(()=>setCats([])); },[cloud.connected]);
  // Beim unmittelbaren Wechsel vom Protokoll in die Fotodokumentation dürfen lokale,
  // noch nicht in OneDrive synchronisierte Top-/Raumdaten nicht durch ältere Cloud-Daten ersetzt werden.
  useEffect(()=>{if(!cloud.connected||ordner==='__fotos'||ordner==='01_Fotos Besichtigung'||cloud.storageMode==='shared')return; cloud.readWorkState(akt).then(r=>{if(!r?.data)return; const d=r.data; const ap=d.akt||{}; const rp=Array.isArray(d.protokolle)?d.protokolle:[]; if(rp.length || Object.keys(ap).length) setAkt(Object.assign({},akt,ap,dispoMergeFields(akt),{protokolle:rp.length?rp:(akt.protokolle||[])}));}).catch(()=>{});},[akt.id,ordner,cloud.connected]);

  const stammSpeichern=async()=>{
    if(!cloud.connected){setStammMsg('Bitte OneDrive verbinden, um Stammdaten dauerhaft zu ändern.');return;}
    setStammBusy(true);setStammMsg('');
    try{
      const latestDispo=await cloud.readDisposition(akt);
      const latestWork=await cloud.readWorkState(akt).catch(()=>null);
      const changed={aktenzeichen:akt.aktenzeichen,schadennummer:akt.schadennummer,
        vn:akt.vn,geschaedigter:akt.geschaedigter,bezeichnung:akt.geschaedigter||akt.vn||akt.bezeichnung,
        jahr:akt.jahr,schadensart:akt.schadensart,versicherung:akt.versicherung,
        adresse:akt.adresse,strasse:akt.strasse,hausnummer:akt.hausnummer,plz:akt.plz,ort:akt.ort};
      const next=Object.assign({},akt,dispoMergeFields(latestDispo?.data||{}),changed,{geaendert:new Date().toISOString()});
      // Vorhandene Ortsterminprotokolle dürfen durch eine reine Stammdatenkorrektur nicht verschwinden.
      const workProts=latestWork?.data?.protokolle||[];
      const keepProts=(akt.protokolle||[]).length?(akt.protokolle||[]):workProts;
      const d=await cloud.saveDisposition(next);
      if(!d?.id)throw new Error('Disposition.json wurde nicht bestätigt.');
      const w=await cloud.saveWorkState({...next,protokolle:keepProts});
      if(!w?.id)throw new Error('AppArbeitsstand.json wurde nicht bestätigt.');
      setAkt(next);
      setStammMsg('Stammdaten in OneDrive gespeichert. Der bisherige Ordnername und bereits versendete Outlook-Einladungen bleiben unverändert.');
    }catch(e){setStammMsg('Speichern fehlgeschlagen bzw. unvollständig: '+(e.message||String(e)));}
    finally{setStammBusy(false);}
  };
  const planen=async()=>{
    if(!akt.besichtigungDatum){toast('Bitte zuerst Besichtigungsdatum eintragen');return;}
    setBusyMove(true);
    try{
      const moved=await cloud.moveAkt(akt,'tagesbesichtigung');
      setAkt(Object.assign({},akt,moved,{status:'Besichtigung',cloudParentStatus:'tagesbesichtigung'}));
      toast('Akt nach Tagesbesichtigung verschoben');
    }catch(e){toast(e.message||String(e));}finally{setBusyMove(false);}
  };
  const besichtigungAbschliessen=async()=>{
    if(!confirm('Besichtigung abschließen und Akt nach „Besichtigt“ verschieben?'))return;
    setBusyMove(true);
    try{
      const moved=await cloud.moveAkt(akt,'besichtigt');
      const next=Object.assign({},akt,moved,{status:'Bearbeitung',cloudParentStatus:'besichtigt',workflowHistory:[...(akt.workflowHistory||[]),workflowEntry('tagesbesichtigung','besichtigt')]});
      setAkt(next);
      try{await cloud.saveDisposition(next);}catch(e){toast('Akt verschoben; Protokollierung bitte prüfen: '+(e.message||e));return;}
      toast('Akt nach Besichtigt verschoben');
    }catch(e){toast(e.message||String(e));}finally{setBusyMove(false);}
  };
  const abschliessen=async()=>{
    if(akt.berichtAbgelegt!==true){toast('Bitte zuerst in der Fristbearbeitung „Bericht im Akt abgelegt“ speichern.');return;}
    if(!cat){toast('Bitte Ablagekategorie auswählen');return;}
    if(!confirm('Akt abschließen und unter „Abgelegt / '+cat+'“ verschieben?'))return;
    setBusyMove(true);
    try{
      const moved=await cloud.archiveAkt(akt,cat);
      const next=Object.assign({},akt,moved,{status:'abgeschlossen',cloudParentStatus:'abgelegt',ablageKategorie:cat,workflowHistory:[...(akt.workflowHistory||[]),workflowEntry('besichtigt','abgelegt/'+cat)]});
      setAkt(next);
      try{await cloud.saveDisposition(next);}catch(e){toast('Akt abgelegt; Protokollierung bitte prüfen: '+(e.message||e));return;}
      toast('Akt abgeschlossen und abgelegt');
    }catch(e){toast(e.message||String(e));}finally{setBusyMove(false);}
  };

  if (ordner === '__ki') return <AgentView akt={akt} go={go} cloud={cloud} toast={toast} agent={agent} />;

  if (ordner === '__gutachten') return <GutachtenView akt={akt} setAkt={setAkt} go={go} cloud={cloud} toast={toast} presetSourceId={sourceDriveItemId} presetSourceName={sourceFileName} />;

  if (ordner === '__unterlagen') return <AktExplorer akt={akt} go={go} cloud={cloud} toast={toast} />;

  if (ordner === '__fotos' || ordner === '01_Fotos Besichtigung') return <Fotoablage akt={akt} cloud={cloud} go={go} presetProtId={photoProtId} presetUnitId={photoUnitId} presetRoomId={photoRoomId} fromForm={photoFromForm} returnStep={photoReturnStep} fromDocuments={ordner==='01_Fotos Besichtigung'} />;

  if (ordner && ordner !== '03_Ortsaugenschein') {
    const o = ORDNER.find(x=>x.key===ordner);
    return <CloudFolder akt={akt} ordner={ordner} o={o} go={go} cloud={cloud} toast={toast} />;
  }

  if (ordner === '03_Ortsaugenschein') return <div><button className="btn ghost sm" onClick={()=>go({mode:'akt',aktId:akt.id})}>← Zum Akt</button><p className="eyebrow" style={{marginTop:18}}>{akt.aktenzeichen} · {akt.bezeichnung}</p><h2 className="sec">Ortsaugenschein</h2><Card titel="Protokolle" extra={<button className="btn sig sm" onClick={()=>go({mode:'form',aktId:akt.id,protId:'neu'})}>+ Protokoll</button>}>{!prots.length?<div className="empty"><p>Noch kein Protokoll in diesem Akt.</p><button className="btn" onClick={()=>go({mode:'form',aktId:akt.id,protId:'neu'})}>Ortsaugenschein aufnehmen</button></div>:<div className="rows">{prots.slice().sort((a,b)=>b.erstellt.localeCompare(a.erstellt)).map(p=><div key={p.id} className="row" style={{gridTemplateColumns:'1fr auto auto',alignItems:'center'}}><div><div className="mono" style={{fontSize:13}}>{dDE(p.datum)} · {p.uhrzeit}</div><div style={{fontSize:14,color:'var(--muted)'}}>{(p.anwesende||[]).filter(a=>a.name).length} anwesend · {((p.wohnungen&&p.wohnungen.length)?p.wohnungen.flatMap(w=>w.raeume||[]):p.raeume||[]).filter(r=>r.bez).length} Räume</div></div><span className={'chip '+(p.status==='abgeschlossen'?'fertig':'entwurf')}>{p.status==='abgeschlossen'?'abgeschlossen':'Entwurf'}</span><div style={{display:'flex',gap:6}}><button className="btn ghost sm" onClick={()=>go({mode:'form',aktId:akt.id,protId:p.id})}>Öffnen</button><button className="btn ghost sm" style={{color:'var(--alarm)'}} onClick={()=>{if(confirm('Dieses Ortsaugenschein-Protokoll löschen?')){const np=prots.filter(x=>x.id!==p.id);setAkt(Object.assign({},akt,{protokolle:np})); if(cloud.connected) cloud.saveWorkState(Object.assign({},akt,{protokolle:np})).catch(e=>toast(e.message||String(e)));}}}>Löschen</button></div></div>)}</div>}</Card></div>;

  return (
    <div>
      <div className="case-head"><div><p className="eyebrow">Akt · {akt.aktenzeichen || 'ohne AZ'}</p><h2 className="sec">{akt.geschaedigter || akt.vn || akt.bezeichnung || 'Ohne Bezeichnung'}</h2><div className="case-meta"><span className="chip">{akt.schadensart || 'Schadensfall'}</span><span className={'chip '+((akt.status||'offen')==='abgeschlossen'?'fertig':'entwurf')}>{statusKey(akt)==='offen'?'Offen':statusOrdner(akt)}</span></div></div><button className="btn ghost sm" onClick={()=>go({mode:'start'})}>← Ordnerübersicht</button></div>
      <div className="statline"><div className="stat"><div className="k">Versicherung</div><div className="v">{akt.versicherung || '—'}</div></div><div className="stat"><div className="k">Schadennummer</div><div className="v">{akt.schadennummer || '—'}</div></div><div className="stat"><div className="k">Adresse</div><div className="v">{[akt.strasse||akt.adresse,akt.hausnummer,akt.plz,akt.ort].filter(Boolean).join(' ') || '—'}</div></div><div className="stat"><div className="k">Besichtigung</div><div className="v">{akt.besichtigungDatum ? dDE(akt.besichtigungDatum)+(akt.besichtigungZeit?' · '+akt.besichtigungZeit:'') : '—'}</div></div></div>

      <div className="quick-grid">
        <button className="quick primary" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'03_Ortsaugenschein'})}><span className="ico">📋</span><span><span className="ttl">Ortsaugenschein</span><span className="sub">Erfassungsmodul · {prots.length} Protokoll{prots.length===1?'':'e'}</span></span></button>
        <button className="quick" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__unterlagen'})}><span className="ico">📁</span><span><span className="ttl">Unterlagen</span><span className="sub">Reale OneDrive-Aktenstruktur</span></span></button>
        <button className="quick" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__fotos'})}><span className="ico">📷</span><span><span className="ttl">Fotos</span><span className="sub">Kamera · Zuordnung nach Top und Raum · OneDrive</span></span></button>
        <button className="quick" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__gutachten'})}><span className="ico">📄</span><span><span className="ttl">Gutachten</span><span className="sub">SV-Rohentwurf prüfen · danach mit GPT ausformulieren</span></span></button>
      </div>

      <Card titel="Besichtigungstermin">
        <div className="grid g3"><div className="stat"><div className="k">Datum</div><div className="v">{akt.besichtigungDatum||'Nicht eingetragen'}</div></div><div className="stat"><div className="k">Beginn</div><div className="v">{akt.besichtigungZeit||'—'}</div></div><div className="stat"><div className="k">Ende</div><div className="v">{akt.besichtigungBis||adZeitPlusMinuten(akt.besichtigungZeit||'',120)||'—'}</div></div></div>
        <p className="folder-home-note">Bestehende Outlook-Termine nur über den Änderungsmodus in „Aufträge &amp; Disposition“ anpassen, damit Kalender und App übereinstimmen.</p>
        <button className="btn ghost sm" onClick={()=>go({mode:'assistenz'})}>Zur Disposition / Terminänderung</button>
        <div className="conn" style={{marginTop:12}}>
          {statusKey(akt)==='offen' && <span className="folder-home-note">Die Terminvereinbarung erfolgt über „Aufträge &amp; Disposition“. Nach erfolgreicher Outlook-Bestätigung wird der Akt automatisch nach Tagesbesichtigung verschoben.</span>}
          {(statusKey(akt)==='tagesbesichtigung') && <button className="btn sig" disabled={busyMove||!cloud.connected} onClick={besichtigungAbschliessen}>Besichtigung abschließen</button>}
          {statusKey(akt)==='besichtigt' && <span className="chip fertig">Besichtigt · Bearbeitung offen</span>}
        </div>
      </Card>

      <Card titel="Stammdaten"><div className="grid g2"><Txt l="Aktenzeichen" v={akt.aktenzeichen} set={v=>s('aktenzeichen',v)} /><Txt l="Versicherungsnehmer (VN)" v={akt.vn||akt.bezeichnung||''} set={v=>{s('vn',v); if(!akt.geschaedigter)s('bezeichnung',v);}} /><Txt l="Geschädigter (abweichend)" v={akt.geschaedigter||''} set={v=>{s('geschaedigter',v);s('bezeichnung',v||akt.vn||akt.bezeichnung||'');}} /><Sel l="Schadenart" v={akt.schadensart||''} set={v=>s('schadensart',v)} opts={SCHADENARTEN} /><label className="f"><span>Bearbeitungsstatus</span><div className="codehint">{statusOrdner(akt)}</div></label><Sel l="Versicherung" v={akt.versicherung||'RSG'} set={v=>s('versicherung',v)} opts={VERSICHERUNGEN} /><Txt l="Schadennummer" v={akt.schadennummer} set={v=>setAkt(Object.assign({},akt,{schadennummer:v,aktenzeichen:v,geaendert:new Date().toISOString()}))} /><Txt l="Jahr" v={akt.jahr} set={v=>s('jahr',v)} num /></div><div className="grid g2" style={{marginTop:12}}><Fld l="Stadt / Ort"><input value={akt.ort||''} onChange={e=>s('ort',e.target.value)} onBlur={async()=>{if(akt.ort){const z=await lookupPlzForOrt(akt.ort); if(z)setAkt(Object.assign({},akt,{plz:z,geaendert:new Date().toISOString()}));}}}/></Fld><Txt l="PLZ" v={akt.plz} set={v=>s('plz',v)} /></div><div className="grid g2" style={{marginTop:12}}><Txt l="Straße" v={akt.strasse||akt.adresse||''} set={v=>setAkt(Object.assign({},akt,{strasse:v,adresse:[v,akt.hausnummer].filter(Boolean).join(' '),geaendert:new Date().toISOString()}))} /><Txt l="Hausnummer" v={akt.hausnummer||''} set={v=>setAkt(Object.assign({},akt,{hausnummer:v,adresse:[akt.strasse||akt.adresse,v].filter(Boolean).join(' '),geaendert:new Date().toISOString()}))} /></div>
      <div className="conn" style={{marginTop:14}}><button className="btn sig sm" disabled={stammBusy||!cloud.connected} onClick={stammSpeichern}>{stammBusy?'Speichere …':'Geänderte Stammdaten in OneDrive speichern'}</button></div>
      {stammMsg&&<div className="codehint" style={{marginTop:10}}>{stammMsg}</div>}
      <p className="folder-home-note">Namen und administrative Angaben können nach Aktanlage geändert werden. Zur Vermeidung fehlerhafter Verknüpfungen werden bestehende Aktordner und bereits versendete Outlook-Einladungen nicht automatisch umbenannt.</p>
      </Card>

      {statusKey(akt)==='besichtigt' && <Card titel="Akt abschließen"><p style={{marginTop:0}}>Beim Abschluss wird der gesamte Akt unter <span className="mono">00_abgelegt / Schadenkategorie</span> verschoben.</p><div className="grid g2"><Sel l="Ablagekategorie" v={cat} set={setCat} opts={SCHADENARTEN} /><div style={{display:'flex',alignItems:'end'}}><button className="btn sig" disabled={busyMove||!cloud.connected} onClick={abschliessen}>Akt abschließen & ablegen</button></div></div></Card>}

      <Card titel="Fristbearbeitung / Verzögerung · Sachverständiger">
        <p className="folder-home-note">Nur zur Dokumentation durch den Sachverständigen. Keine automatisch ausgelösten Nachrichten.</p>
        <div className="grid g2">
          <Fld l="Berichtsfrist (Kalendertage)"><input type="number" min="1" max="365" value={svFrist.fristTage??''} onChange={e=>svEdit('fristTage',e.target.value)}/></Fld>
          <Fld l="Bericht übermittelt am"><input type="date" value={svFrist.berichtVersendetAm||''} onChange={e=>svEdit('berichtVersendetAm',e.target.value)}/></Fld>
        </div>
        <div className="ad-frist-section">
          <label className="ad-frist-check"><input type="checkbox" checked={svFrist.fristNichtMoeglich===true} onChange={e=>svEdit('fristNichtMoeglich',e.target.checked)}/> Bearbeitung innerhalb der Berichtsfrist nicht möglich</label>
          <div className="ad-frist-checks">
            <label className="ad-frist-check"><input type="checkbox" checked={svFrist.fristNachrichtVersendet===true} onChange={e=>svEdit('fristNachrichtVersendet',e.target.checked)}/> Nachricht versendet</label>
            <label className="ad-frist-check"><input type="checkbox" checked={svFrist.fristErstberichtVersendet===true} onChange={e=>svEdit('fristErstberichtVersendet',e.target.checked)}/> Erstbericht versendet</label>
            <label className="ad-frist-check"><input type="checkbox" checked={svFrist.berichtAbgelegt===true} onChange={e=>svEdit('berichtAbgelegt',e.target.checked)}/> Bericht im Akt abgelegt</label>
          </div>
          <Fld l="Kommentar / Fristnotizen"><textarea rows={4} value={svFrist.fristKommentar||''} onChange={e=>svEdit('fristKommentar',e.target.value)} placeholder="Grund der Verzögerung, Absprachen und weiteres Vorgehen …"/></Fld>
        </div>
        <div className="conn" style={{marginTop:12}}><button className="btn sig sm" disabled={svFristBusy||!cloud.connected} onClick={svFristSpeichern}>{svFristBusy?'Speichern …':'Fristvermerk speichern'}</button><span role="status" className="folder-home-note">{svFristMsg}</span></div>
      </Card>

      <button className="btn ghost sm" style={{borderColor:'var(--alarm)',color:'var(--alarm)'}} onClick={()=>{if(confirm('Akt „'+(akt.bezeichnung||akt.aktenzeichen)+'“ aus Gutachten-App und Assistenz-Disposition entfernen? Der OneDrive-Ordner und seine Unterlagen bleiben bestehen.'))loeschAkt(akt.id)}}>Nur aus App entfernen</button>
    </div>
  );
}


function AgentView({ akt, go, cloud, toast, agent }) {
  const [busy,setBusy]=useState(false), [done,setDone]=useState(false), [err,setErr]=useState('');
  const start=async()=>{
    if(!cloud.connected){toast('OneDrive ist nicht verbunden');return;}
    setBusy(true);setErr('');setDone(false);
    try{
      await cloud.createAnalysisJob(akt);
      setDone(true);
      toast('Analyseauftrag in OneDrive erstellt');
    }catch(e){setErr(e.message||String(e));toast(e.message||String(e));}
    finally{setBusy(false);}
  };
  return <div>
    <button className="btn ghost sm" onClick={()=>go({mode:'akt',aktId:akt.id})}>← Zum Akt</button>
    <p className="eyebrow" style={{marginTop:18}}>{akt.aktenzeichen} · {akt.bezeichnung}</p>
    <h2 className="sec">KI-Auswertung</h2>
    <Card titel="Aktenanalyse">
      <p style={{marginTop:0}}>Die App erstellt auf Knopfdruck einen Analyseauftrag in OneDrive. Power Automate kann diesen Auftrag erkennen, den aktuellen Inhalt des Aktes einlesen und daraus später den Gutachtenentwurf erzeugen.</p>
      <div className="readout"><span>Quelle: kompletter aktueller Akt</span><span>Ziel Entwurf: 02_Unterlagen SV</span></div>
      <div className="conn" style={{marginTop:14}}><button className="btn sig" disabled={busy||!cloud.connected} onClick={start}>{busy?'Auftrag wird erstellt …':'Akt analysieren'}</button></div>
      {done && <div className="codehint" style={{marginTop:12}}>Analyseauftrag wurde unter Gutachten_Business / 000_AppSystem / KI_Auftraege gespeichert. Sobald der Power-Automate-Flow eingerichtet ist, startet dort automatisch die Verarbeitung.</div>}
      {err && <div className="codehint" style={{marginTop:12,color:'var(--alarm)'}}>{err}</div>}
    </Card>
    <Card titel="Geplanter Analyseablauf">
      <div className="rows">
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">01</div><div>Alle Dateien und Unterordner des Aktes zum Ausführungszeitpunkt erfassen.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">02</div><div>PDF-, Word- und Bildinhalte auslesen; Scans bei Bedarf per OCR verarbeiten.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">03</div><div>Jedes Dokument einzeln zusammenfassen und Quelle sowie Dateiname mitführen.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">04</div><div>Aktenweite Synthese erstellen, Widersprüche und fehlende Angaben kennzeichnen.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">05</div><div>Gutachtenentwurf erzeugen und in 02_Unterlagen SV ablegen. Keine automatische Finalisierung.</div></div>
      </div>
    </Card>
  </div>;
}

function GutachtenView({akt,setAkt,go,cloud,toast,presetSourceId='',presetSourceName=''}){
  const base=Object.assign(gutachtenLeer(),akt.gutachten||{});
  const [g,setG]=useState(base),[busy,setBusy]=useState(false),[kiStatus,setKiStatus]=useState('');
  const [quellen,setQuellen]=useState([]),[quellenBusy,setQuellenBusy]=useState(false),[quelleId,setQuelleId]=useState('');
  const [thema,setThema]=useState(''),[formStatus,setFormStatus]=useState(''),[formRefs,setFormRefs]=useState([]);
  const [pruefpunkte,setPruefpunkte]=useState([]);
  const wordJobKey='studiof_shared_test_word_direct_job_'+akt.id;
  const [wordJob,setWordJob]=useState(()=>{try{return JSON.parse(localStorage.getItem(wordJobKey)||'null');}catch(e){return null;}});
  const [wordStatus,setWordStatus]=useState('');
  const loadedDraftRef=useRef('');
  const set=(k,v)=>{const neu=Object.assign({},g,{[k]:v});setG(neu);setAkt(Object.assign({},akt,{gutachten:neu}));};
  const refreshRoh=async()=>{
    if(!cloud.connected||typeof cloud.listFormulationSources!=='function'){setQuellen([]);setQuelleId('');return;}
    setQuellenBusy(true);
    try{
      const result=await cloud.listFormulationSources(akt);
      // Direktauswahl aus der tatsächlich geöffneten OneDrive-Unterlagenansicht:
      // Wenn die separate Quellenliste eine soeben gesehene Datei nicht enthält,
      // wird ihre Graph-ID mit dem echten Ordner 02_Unterlagen SV abgeglichen.
      if(presetSourceId && !result.some(s=>s.id===presetSourceId)){
        const chosen=await cloud.verifyFormulationSource(akt,presetSourceId);
        if(chosen)result.unshift(chosen);
      }
      setQuellen(result);
      setQuelleId(previous=>presetSourceId&&result.some(s=>s.id===presetSourceId)?presetSourceId:
        result.some(s=>s.id===previous)?previous:(result.find(s=>/(?:^|[_\-\s])GA(?:[_\-\s.]|$)/i.test(s.name))||result[0]||{}).id||'');
      if(!result.length)setFormStatus('Im OneDrive-Ordner 02_Unterlagen SV wurde keine geeignete Word-Datei gefunden. Öffne die Unterlagen und klicke neben der gewünschten DOCX auf „Als Quelle verwenden“.');
      else setFormStatus(previous=>previous.startsWith('Word-Quellen konnten nicht gelesen werden:')?'' : previous);
    }catch(e){setQuellen([]);setQuelleId('');setFormStatus('Word-Quellen konnten nicht gelesen werden: '+(e.message||String(e)));}
    finally{setQuellenBusy(false);}
  };
  useEffect(()=>{setQuellen([]);setQuelleId('');setThema('');setFormStatus('');setFormRefs([]);setPruefpunkte([]);setKiStatus('');loadedDraftRef.current='';refreshRoh();},[akt.id,akt.cloudItemId,cloud.connected,presetSourceId]);
  const roh=quellen.find(x=>x.id===quelleId)||null;
  const ausformulierenWordDirekt=async()=>{
    if(!cloud.connected){toast('OneDrive ist nicht verbunden');return;}
    if(!roh){toast('Bitte eine DOCX-Quelle auswählen');return;}
    if(wordJob && !wordJob.completed){
      setWordStatus('Ein Word-Direkt-Auftrag ist noch offen ('+wordJob.requestId+'). Bitte zuerst dessen Ergebnis im Flow prüfen.');
      return;
    }
    setQuellenBusy(true);setWordStatus('Word-Direkt-Auftrag wird in der gemeinsamen Testablage angelegt …');
    try{
      const r=await cloud.createWordDirectJob(akt,{sourceDriveItemId:roh.id});
      const pending={requestId:r.job.requestId,outputFileName:r.job.outputFileName,sourceName:roh.name,completed:false};
      localStorage.setItem(wordJobKey,JSON.stringify(pending));
      setWordJob(pending);
      setWordStatus('Word-Direkt-Auftrag bestätigt: '+(r.file?.name||r.job.requestId)+'. Power Automate erstellt das DOCX und speichert es unmittelbar in 02_Unterlagen SV.');
      toast('Word-Direkt-Auftrag in der Testablage erstellt');
    }catch(e){setWordStatus('Word-Direkt-Auftrag fehlgeschlagen: '+(e.message||String(e)));toast(e.message||String(e));}
    finally{setQuellenBusy(false);}
  };
  useEffect(()=>{
    if(!wordJob?.outputFileName||wordJob.completed||!cloud.connected||typeof cloud.findWordDirectResult!=='function')return;
    let stopped=false,fetching=false,timer=null;
    const check=async()=>{
      if(fetching||stopped)return;
      fetching=true;
      try{
        const result=await cloud.findWordDirectResult(akt,wordJob.outputFileName);
        if(stopped||!result?.id)return;
        const complete={...wordJob,completed:true};
        localStorage.setItem(wordJobKey,JSON.stringify(complete));
        setWordJob(complete);
        setWordStatus('Fertiges Word in 02_Unterlagen SV gespeichert: '+result.name+'. Fachliche Freigabe durch den SV ausständig.');
        if(timer)clearInterval(timer);
      }catch(e){if(!stopped)setWordStatus('Word-Direkt-Status konnte nicht gelesen werden: '+(e.message||String(e)));}
      finally{fetching=false;}
    };
    check();timer=setInterval(check,15000);
    return ()=>{stopped=true;if(timer)clearInterval(timer);};
  },[akt.id,akt.cloudItemId,cloud.connected,wordJob?.requestId,wordJob?.completed]);
  const ausformulieren=async()=>{
    if(!cloud.connected){toast('OneDrive ist nicht verbunden');return;}
    if(!roh){toast('Bitte eine Word-Quelle auswählen');return;}
    setQuellenBusy(true);setFormStatus('');setFormRefs([]);setPruefpunkte([]);
    try{
      const r=await cloud.createFormulationJob(akt,{sourceDriveItemId:roh.id,topicHint:thema});
      const selected=r?.job?.selectedReferences||[];
      setFormRefs(selected);
      setFormStatus('Ausformulierungsauftrag in OneDrive bestätigt: '+(r?.file?.name||'JSON-Datei')+'. '+
        (selected.length?selected.length+' thematisch passende Pilot-Referenzen zugeordnet ('+selected.filter(r=>r.referenceExcerptIncluded).length+' mit geprüften Word-Textauszügen).':'Für diese Kategorie liegen noch keine Pilot-Referenzen vor; allgemeiner Studio-F-Schreibstandard wird verwendet.')+
        ' Der externe KI-Flow muss den Auftrag noch verarbeiten.');
      toast('Studio-F-Ausformulierungsauftrag erstellt');
    }catch(e){setFormStatus('Fehler: '+(e.message||String(e)));toast(e.message||String(e));}
    finally{setQuellenBusy(false);}
  };
  useEffect(()=>{
    let stopped=false,timer=null,fetching=false;
    const check=async()=>{
      if(fetching||!cloud.connected||typeof cloud.readFormulationResult!=='function'||typeof cloud.readFormulationStatus!=='function')return;
      fetching=true;
      try{
        const status=await cloud.readFormulationStatus(akt);
        if(stopped)return;
        const pending=status?.data;
        if(!pending?.requestId){setKiStatus('');return;}
        const r=await cloud.readFormulationResult(akt,pending.requestId);
        if(stopped)return;
        if(!r||r.data?.requestId!==pending.requestId){setKiStatus('Ausformulierungsauftrag '+pending.requestId+' wartet auf das passende KI-Ergebnis. Nur die eigene Ergebnisdatei wird berücksichtigt.');return;}
        const currentWord=await cloud.getFormulationSourceStamp(pending.sourceDriveItemId);
        if(currentWord?.lastModifiedDateTime!==pending.sourceModifiedAt){
          setKiStatus('Die gewählte Word-Datei wurde nach der Auftragserteilung geändert. Bitte mit der aktuellen Fassung einen neuen KI-Auftrag erstellen.');return;
        }
        const d=r.data||{};
        if(d.status==='failed'){setKiStatus('KI-Verarbeitung fehlgeschlagen: '+String(d.error||'Details im Flow prüfen.'));return;}
        if(d.status!=='completed'||d.sourceDriveItemId!==pending.sourceDriveItemId||d.sourceModifiedAt!==pending.sourceModifiedAt){
          setKiStatus('KI-Ergebnis passt nicht zur gewählten Word-Version oder ist unvollständig. Es wurde nichts übernommen.');return;
        }
        const required=['kurzfassung','objektbeschreibung','ursacheneruierung','schadenbeschreibung','reparaturbeschreibung'];
        if(required.some(k=>typeof d[k]!=='string'||!d[k].trim())){
          setKiStatus('KI-Ergebnis enthält nicht alle Pflichtkapitel. Es wurde nichts übernommen.');return;
        }
        const rev=pending.requestId+'|'+(r.lastModifiedDateTime||r.id);
        if(loadedDraftRef.current===rev)return;
        loadedDraftRef.current=rev;
        const key='gutachten_docx_'+(akt.cloudItemId||akt.id||akt.schadennummer||'akt');
        setPruefpunkte(Array.isArray(d.pruefpunkte)?d.pruefpunkte.map(String).filter(Boolean):[]);
        if(localStorage.getItem(key)===rev){
          setKiStatus('Dieser KI-Entwurf wurde bereits als Word-Version gespeichert. Lokale fachliche Änderungen werden nicht erneut überschrieben.');return;
        }
        const neu={kurzfassung:d.kurzfassung,objektbeschreibung:d.objektbeschreibung,
          kurzzusammenfassung:String(d.kurzzusammenfassung||''),ursacheneruierung:d.ursacheneruierung,
          schadenbeschreibung:d.schadenbeschreibung,reparaturbeschreibung:d.reparaturbeschreibung};
        setG(neu);setAkt(Object.assign({},akt,{gutachten:neu}));
        setKiStatus('Passender KI-Entwurf geladen · Word-Datei wird erstellt …');
        const {blob,name}=await exportGutachtenDocx(akt,neu);
        await cloud.saveProtocol(akt,blob,name);
        localStorage.setItem(key,rev);
        if(!stopped)setKiStatus('Studio-F-Entwurf geprüft auf Auftrags-ID und Word-Quelle · Word in 02_Unterlagen SV gespeichert. SV-Freigabe ausständig.');
        toast('KI-Gutachtenentwurf als Word gespeichert');
      }catch(e){if(!stopped)setKiStatus('Prüfung des KI-Ergebnisses fehlgeschlagen: '+(e.message||String(e)));}
      finally{fetching=false;}
    };
    check();timer=setInterval(check,10000);
    return ()=>{stopped=true;if(timer)clearInterval(timer);};
  },[akt.id,akt.cloudItemId,cloud.connected]);
  const vorbereiten=()=>{
    const auto=textAusBesichtigung(akt);
    const neu={}; Object.keys(auto).forEach(k=>neu[k]=(g[k]||'').trim()?g[k]:auto[k]);
    setG(neu); setAkt(Object.assign({},akt,{gutachten:neu})); toast('Leere Gutachtenfelder aus Besichtigung ergänzt');
  };
  const neuErstellen=()=>{
    if(!confirm('Gutachtenentwurf aus den aktuellen Besichtigungsdaten neu erstellen? Bereits manuell bearbeitete Texte in den sechs Kapiteln werden überschrieben.')) return;
    const neu=textAusBesichtigung(akt);
    setG(neu); setAkt(Object.assign({},akt,{gutachten:neu}));
    toast('Gutachtenentwurf aus aktuellen Besichtigungsdaten neu erstellt');
  };
  const word=async()=>{
    setBusy(true);
    try{
      const {blob,name}=await exportGutachtenDocx(akt,g);
      if(cloud.connected){await cloud.saveProtocol(akt,blob,name);toast('Gutachtenentwurf in 02_Unterlagen SV gespeichert');}
      else{saveBlob(blob,name);toast('Gutachtenentwurf heruntergeladen');}
    }catch(e){toast('Word-Erstellung fehlgeschlagen: '+(e.message||String(e)));}
    finally{setBusy(false);}
  };
  const latest=(akt.protokolle||[]).slice().sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''))[0];
  return <div>
    <button className="btn ghost sm" onClick={()=>go({mode:'akt',aktId:akt.id})}>← Zum Akt</button>
    <p className="eyebrow" style={{marginTop:18}}>{akt.aktenzeichen} · {akt.bezeichnung}</p>
    <h2 className="sec">Gutachten</h2>
    <Card titel="Studio-F-KI · Word direkt ausformulieren">
      <p style={{marginTop:0}}>Wähle einen fachlich vorbereiteten <strong>SV-Rohentwurf als Word</strong> oder ein eigenes DOCX aus <span className="mono">02_Unterlagen SV</span>. Der neue Word-direkt-Flow übergibt die tatsächliche DOCX-Datei und speichert das fertig ausformulierte Word automatisch wieder im Akt. Der bisherige JSON-Weg bleibt optional verfügbar.</p>
      <label className="f"><span>Fachliche Word-Quelle</span><select value={quelleId} onChange={e=>setQuelleId(e.target.value)} disabled={quellenBusy||!quellen.length}>
        {!quellen.length&&<option value="">Noch keine geeignete Word-Datei gefunden</option>}
        {quellen.map(q=><option key={q.id} value={q.id}>{q.name} · {q.lastModifiedDateTime?new Date(q.lastModifiedDateTime).toLocaleString('de-AT'):''}</option>)}
      </select></label>
      <label className="f" style={{marginTop:10}}><span>Fachlicher Schwerpunkt für den bisherigen JSON-Weg (optional)</span><input value={thema} maxLength={300} onChange={e=>setThema(e.target.value)} placeholder="z. B. Abflussleitung, Steckverbindung, Leckortung" /></label>
      <div className="readout" style={{marginTop:10}}><span>{roh?('Quelle: '+roh.name):'Keine Quelle ausgewählt'}</span><span>{roh?.lastModifiedDateTime?('Stand: '+new Date(roh.lastModifiedDateTime).toLocaleString('de-AT')):''}</span></div>
      <div className="conn" style={{marginTop:14,gap:8,flexWrap:'wrap'}}>
        <button className="btn secondary" disabled={quellenBusy||!cloud.connected} onClick={refreshRoh}>{quellenBusy?'Quellen werden geprüft …':'Word-Dateien neu prüfen'}</button>
        <button className="btn sig" disabled={quellenBusy||!cloud.connected||!roh||(wordJob&&!wordJob.completed)} onClick={ausformulierenWordDirekt}>{quellenBusy?'Auftrag wird vorbereitet …':'Word direkt ausformulieren (neu)'}</button>
        <button className="btn secondary" disabled={quellenBusy||!cloud.connected||!roh} onClick={ausformulieren}>Bisheriger JSON-Weg (optional)</button>
      </div>
      {wordStatus&&<div role="status" className="codehint" style={{marginTop:10}}>{wordStatus}</div>}
      {wordJob&&!wordJob.completed&&<button className="btn ghost sm" style={{marginTop:8}} onClick={()=>{
        if(!confirm('Nur nach Kontrolle des Power-Automate-Ausführungsverlaufs freigeben. Ein noch laufender Auftrag wird dadurch NICHT beendet. Neuen Word-Direkt-Auftrag zulassen?'))return;
        localStorage.removeItem(wordJobKey);setWordJob(null);setWordStatus('Auftragssperre lokal aufgehoben. Vor einem neuen Auftrag sicherstellen, dass der vorige Flow abgeschlossen ist.');
      }}>Vorigen Auftrag nach Flow-Prüfung freigeben</button>}
      {wordJob?.completed&&<div className="codehint" style={{marginTop:10}}>Word-Direkt-Ergebnis: <span className="mono">{wordJob.outputFileName}</span>. Über „Word-Dateien neu prüfen“ lässt sich die Datei in der Quellenliste anzeigen. Bitte den Entwurf fachlich kontrollieren.</div>}
      <div className="codehint" style={{marginTop:10}}>Word direkt lädt die Referenzgutachten im separaten Testflow aus der privaten Ablage. In der öffentlichen Test-App sind keine Originalauszüge eingebettet. Der frühere JSON-Formulierungsweg bleibt gesperrt. Fachliche Grundlage ist ausschließlich der ausgewählte SV-Rohentwurf.</div>
      {formRefs.length>0&&<div className="codehint" style={{marginTop:10}}><strong>Für diesen Auftrag ausgewählte Referenzthemen:</strong><br/>{formRefs.map(r=>r.referenceId+' · '+r.topic+(r.referenceExcerptIncluded?' · Word-Auszug':' · Stilhinweis')).join(' | ')}</div>}

function AktExplorer({ akt, go, cloud, toast }) {
  const [stack,setStack]=useState([]);
  const [items,setItems]=useState([]);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [lastSync,setLastSync]=useState(null);
  const input=useRef(null);

  const current = stack.length ? stack[stack.length-1] : null;
  const currentId = current?.id || null;
  const title = current?.name || 'Aktstamm';

  const laden=useCallback(async(silent=false)=>{
    if(!cloud.connected){setItems([]);return;}
    if(!silent)setBusy(true);
    setErr('');
    try{
      const data = currentId ? await cloud.listChildren(currentId) : await cloud.listAktRoot(akt);
      setItems(data);
      setLastSync(new Date());
    }catch(e){setErr(e.message||String(e));}
    finally{if(!silent)setBusy(false);}
  },[akt.id,akt.cloudItemId,currentId,cloud.connected]);

  useEffect(()=>{laden();},[laden]);
  useEffect(()=>{
    if(!cloud.connected)return;
    const t=setInterval(()=>laden(true),30000);
    return ()=>clearInterval(t);
  },[laden,cloud.connected]);

  const openItem=it=>{
    if(it.folder){setStack(prev=>prev.concat([{id:it.id,name:it.name}]))}
    else if(it.webUrl) window.open(it.webUrl,'_blank');
  };
  const up=()=>setStack(prev=>prev.slice(0,-1));
  const root=()=>setStack([]);
  const upload=async e=>{
    const f=e.target.files?.[0]; if(!f)return;
    setBusy(true); setErr('');
    try{
      const parentId=currentId || (await cloud.resolveAktItem(akt)).id;
      await cloud.uploadToParent(parentId,f);
      toast('Datei in OneDrive gespeichert');
      await laden();
    }catch(x){setErr(x.message||String(x));}
    finally{setBusy(false);e.target.value='';}
  };
  const icon=it=>it.folder?'📁':(it.name?.toLowerCase().endsWith('.pdf')?'📕':it.name?.match(/\.(jpg|jpeg|png|heic)$/i)?'🖼':'📄');

  return <div>
    <button className="btn ghost sm" onClick={()=>go({mode:'akt',aktId:akt.id})}>← Zum Akt</button>
    <p className="eyebrow" style={{marginTop:18}}>{akt.aktenzeichen} · {akt.bezeichnung}</p>
    <h2 className="sec">Unterlagen</h2>
    <div className="codehint" style={{marginTop:10}}>OneDrive-Aktstruktur wird dynamisch gelesen. Dateien dürfen direkt im Aktstamm liegen; vorhandene und später neu angelegte Unterordner werden automatisch erkannt.</div>

    <div className="conn" style={{margin:'14px 0',flexWrap:'wrap'}}>
      <span className={'dot '+(cloud.connected?'ok':'warn')}></span>
      <span>{cloud.connected?'OneDrive verbunden':'OneDrive nicht verbunden'}</span>
      {stack.length>0&&<button className="btn ghost sm" onClick={up}>← Eine Ebene höher</button>}
      {stack.length>0&&<button className="btn ghost sm" onClick={root}>⌂ Aktstamm</button>}
      <button className="btn ghost sm" onClick={()=>laden()} disabled={busy}>↻ Synchronisieren</button>
      <button className="btn sig sm" onClick={()=>input.current?.click()} disabled={busy||!cloud.connected}>＋ Datei hinzufügen</button>
      <input ref={input} type="file" style={{display:'none'}} onChange={upload}/>
      {lastSync&&<span style={{fontSize:12,color:'var(--muted)'}}>Stand {lastSync.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})} · automatische Aktualisierung alle 30 s</span>}
    </div>

    <div className="readout"><span>Aktstamm</span>{stack.map((x,i)=><span key={x.id}>/ {x.name}</span>)}</div>
    <Card titel={title}>
      {err&&<div className="statusbox warn"><strong>OneDrive-Fehler</strong><div>{err}</div></div>}
      {busy&&<div className="empty"><p>OneDrive wird synchronisiert …</p></div>}
      {!busy&&!err&&!items.length&&<div className="empty"><p>In dieser Ebene befinden sich derzeit keine Dateien oder Ordner.</p></div>}
      {!busy&&items.length>0&&<div className="filelist">{items.map(it=><div key={it.id} style={{display:'flex',alignItems:'stretch',borderBottom:'1px solid var(--line)'}}>
        <button className="fileitem" style={{flex:'1 1 auto',minWidth:0,borderBottom:0}} onClick={()=>openItem(it)}><span className="fi">{icon(it)}</span><span style={{minWidth:0}}><div className="nm">{it.name}</div><div className="meta">{it.lastModifiedDateTime?new Date(it.lastModifiedDateTime).toLocaleString('de-AT'):''}</div></span><span className="sz">{it.folder?(it.folder.childCount||0)+' Obj.':fmtBytes(it.size)}</span></button>
        {current?.name==='02_Unterlagen SV'&&!it.folder&&/\.docx$/i.test(String(it.name||''))&&!/^(?:~\$|Aufnahmeblatt|Gutachtenentwurf)/i.test(String(it.name||''))&&
          <button className="btn secondary sm" style={{alignSelf:'center',margin:'4px 10px',whiteSpace:'nowrap'}} onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__gutachten',sourceDriveItemId:it.id,sourceFileName:it.name})}>Als Quelle verwenden →</button>}
      </div>)}</div>}
    </Card>
  </div>;
}

   Studio F v0.11.24 – Rohfassung: Maßnahmenduplikate, Zuordnung, Kamera / Galerie
