const PHOTO_MAX_BYTES=50*1024*1024;
const PHOTO_EXTENSIONS=/\.(jpe?g|png|webp|heic|heif|gif|tiff?|bmp|avif)$/i;
const photoSegment=(s,fallback='Allgemein')=>slug(String(s||'').replace(/[\/]+/g,' ')).slice(0,68)||fallback;
const photoTimeStamp=()=>{
  const d=new Date(),pad=(v,n=2)=>String(v).padStart(n,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${pad(d.getMilliseconds(),3)}`;
};
const photoExtension=f=>{
  const m=String(f.name||'').match(PHOTO_EXTENSIONS);
  if(m)return m[1].toLowerCase()==='jpeg'?'jpg':m[1].toLowerCase();
  const byType={'image/jpeg':'jpg','image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp','image/gif':'gif','image/tiff':'tiff','image/bmp':'bmp','image/avif':'avif'};
  return byType[String(f.type||'').toLowerCase()]||'';
};
function Fotoablage({akt,cloud,go,presetProtId='',presetUnitId='',presetRoomId='',fromForm=false,returnStep=0,fromDocuments=false,mobileOnly=false}){
  const cameraRef=useRef(null),albumRef=useRef(null),qrRef=useRef(null);
  const [unitKey,setUnitKey]=useState(presetUnitId?(presetProtId+'|'+presetUnitId):'__general');
  const [roomKey,setRoomKey]=useState(presetRoomId||'__general');
  const [manualTop,setManualTop]=useState(''),[manualRoom,setManualRoom]=useState('');
  const [bildhinweis,setBildhinweis]=useState('');
  const [pending,setPending]=useState([]),[recent,setRecent]=useState([]);
  const [items,setItems]=useState([]),[listing,setListing]=useState(false);
  const [busy,setBusy]=useState(false),[progress,setProgress]=useState(''),[error,setError]=useState('');
  const allUnits=(akt.protokolle||[]).filter(p=>!presetProtId||p.id===presetProtId).flatMap((p,pi)=>{
    const units=(p.wohnungen&&p.wohnungen.length)?p.wohnungen:
      [{id:'legacy-'+p.id,top:'',etage:p.geschoss||'',raeume:p.raeume||[]}];
    return units.map((w,wi)=>({key:p.id+'|'+w.id,top:w.top||('Einheit '+(wi+1)),
      etage:w.etage||'',date:p.datum||'',rooms:w.raeume||[]}));
  });
  useEffect(()=>{if(mobileOnly&&unitKey==='__general'&&allUnits.length)setUnitKey(allUnits[0].key);},[mobileOnly,allUnits.length]);
  const selectedUnit=allUnits.find(u=>u.key===unitKey)||null;
  const roomOptions=(selectedUnit?.rooms||[]).map((r,i)=>({
    key:r.id||('raum-'+i), name:String(r.bez||('Raum '+(i+1))).trim(),
    folder:(()=>{
      const n=String(r.bez||('Raum '+(i+1))).trim();
      const prior=(selectedUnit.rooms||[]).slice(0,i).filter(x=>String(x.bez||'').trim().toLowerCase()===n.toLowerCase()).length;
      return photoSegment(n,'Raum_'+(i+1))+(prior?'_'+(prior+1):'');
    })()
  }));
  const chosenRoom=roomOptions.find(r=>r.key===roomKey)||null;
  const topSegment=unitKey==='__general'?'00_Allgemein':unitKey==='__manual'
    ?(manualTop.trim()?'Top_'+photoSegment(manualTop.replace(/^top[\s_-]*/i,''),'Einheit'):'')
    :selectedUnit?'Top_'+photoSegment(selectedUnit.top.replace(/^top[\s_-]*/i,''),'Einheit'):'';
  const roomSegment=unitKey==='__general'?'':roomKey==='__manual'
    ?(manualRoom.trim()?photoSegment(manualRoom):'')
    :chosenRoom?chosenRoom.folder:'00_Allgemein';
  const segments=topSegment&&(unitKey==='__general'||roomSegment)?[topSegment,...(roomSegment?[roomSegment]:[])]:[];
  const targetValid=segments.length>0;
  const photoPath='01_Fotos Besichtigung'+(segments.length?'/'+segments.join('/'):'');
  const iphoneUrl=useMemo(()=>{
    if(!presetProtId)return '';
    const q=new URLSearchParams({photoAct:akt.cloudItemId||akt.id,photoProt:presetProtId});
    return location.origin+location.pathname+'?'+q.toString();
  },[akt.id,akt.cloudItemId,presetProtId]);
  useEffect(()=>{
    if(!qrRef.current)return;
    qrRef.current.replaceChildren();
    if(iphoneUrl&&window.QRCode){new window.QRCode(qrRef.current,{text:iphoneUrl,width:176,height:176,correctLevel:window.QRCode.CorrectLevel.M});}
  },[iphoneUrl]);
  const previews=useMemo(()=>pending.map(x=>({id:x.id,file:x.file,
    url:x.file.type?.startsWith('image/')&&!/heic|heif/i.test(x.file.type||'')?URL.createObjectURL(x.file):''})),[pending]);
  useEffect(()=>()=>previews.forEach(x=>{if(x.url)URL.revokeObjectURL(x.url);}),[previews]);
  const refresh=async()=>{
    if(!cloud.connected||!targetValid){setItems([]);return;}
    setListing(true);
    try{const list=await cloud.listPhotos(akt,segments);setItems(list.filter(x=>!x.folder).sort((a,b)=>String(b.name||'').localeCompare(String(a.name||''))));}
    catch(e){setItems([]);setError('Fotoordner konnte nicht geladen werden: '+(e.message||String(e)));}
    finally{setListing(false);}
  };
  const locationKey=segments.join('/');
  useEffect(()=>{setRecent([]);setProgress('');},[locationKey]);
  useEffect(()=>{
    let cancelled=false;
    if(!cloud.connected||!targetValid){setItems([]);return;}
    const t=setTimeout(async()=>{
      try{const list=await cloud.listPhotos(akt,segments);
        if(!cancelled)setItems(list.filter(x=>!x.folder).sort((a,b)=>String(b.name||'').localeCompare(String(a.name||''))));
      }catch(e){if(!cancelled)setError('Fotoordner konnte nicht geladen werden: '+(e.message||String(e)));}
    },180);
    return()=>{cancelled=true;clearTimeout(t);};
  },[akt.id,locationKey,cloud.connected]);
  // Neue iPhone-Aufnahmen im geöffneten iPad-Raum automatisch sichtbar machen.
  useEffect(()=>{
    if(!cloud.connected||!targetValid)return;
    let active=true;
    const tick=async()=>{
      if(document.visibilityState!=='visible'||busy)return;
      try{
        const list=await cloud.listPhotos(akt,segments);
        if(active)setItems(list.filter(x=>!x.folder).sort((a,b)=>String(b.name||'').localeCompare(String(a.name||''))));
      }catch(e){console.warn('Fotoaktualisierung:',e);}
    };
    const timer=setInterval(tick,15000);
    return()=>{active=false;clearInterval(timer);};
  },[akt.id,locationKey,cloud.connected,busy]);
  const addFiles=e=>{
    const selected=Array.from(e.target.files||[]);
    e.target.value=''; if(!selected.length)return;
    setError('');
    const good=selected.filter(f=>!!photoExtension(f)&&f.size>0&&f.size<=PHOTO_MAX_BYTES);
    const skipped=selected.length-good.length;
    if(skipped)setError(skipped+' Datei(en) nicht übernommen: Nur Bilder bis 50 MB je Datei sind erlaubt.');
    if(good.length)setPending(prev=>prev.concat(good.map(file=>({id:uid(),file,description:bildhinweis.trim()}))));
  };
  const upload=async()=>{
    if(busy||!pending.length)return;
    if(!cloud.connected){setError('Bitte zuerst das Microsoft-/OneDrive-Konto verbinden.');return;}
    if(!targetValid){setError('Bitte zunächst Top und Raum vollständig auswählen.');return;}
    setBusy(true);setError('');setProgress('Upload wird vorbereitet …');
    const failed=[],saved=[];
    const localSegments=[...segments];
    for(let i=0;i<pending.length;i++){
      const x=pending[i],f=x.file;
      setProgress(`Bild ${i+1} von ${pending.length} wird nach OneDrive gespeichert …`);
      try{
        const ext=photoExtension(f);if(!ext||f.size>PHOTO_MAX_BYTES)throw new Error('Ungültige oder zu große Bilddatei.');
        const nonce=uid().slice(-5);
        const description=photoSegment(x.description||bildhinweis,'Ohne_Beschreibung').slice(0,68);
        const top=photoSegment(selectedUnit?.top||(unitKey==='__manual'?manualTop:'Liegenschaft'),'Liegenschaft');
        const geschoss=photoSegment(selectedUnit?.etage||'Geschoss_unbekannt','Geschoss_unbekannt');
        const dateSource=String(selectedUnit?.date||akt.besichtigungDatum||'');
        const m=dateSource.match(/^(\d{4})-(\d{2})-(\d{2})/)||dateSource.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
        const dateLabel=m?(m[1].length===4?m[1]+'-'+m[2]+'-'+m[3]:m[3]+'-'+m[2]+'-'+m[1]):new Date().toLocaleDateString('sv-SE');
        const name=[top,geschoss,description,dateLabel,nonce].join('_')+'.'+ext;
        const uploadFile=new File([f],name,{type:f.type||'application/octet-stream',lastModified:f.lastModified||Date.now()});
        const result=await cloud.uploadPhoto(akt,localSegments,uploadFile);
        if(!result?.id)throw new Error('OneDrive hat keine Dateibestätigung zurückgegeben.');
        saved.push(result);
      }catch(e){failed.push(x);setError(prev=>prev+'Bild „'+f.name+'“: '+(e.message||String(e))+'\n');}
    }
    setPending(failed);
    setRecent(saved);
    setProgress(saved.length+' Bild(er) in OneDrive bestätigt.'+(failed.length?' '+failed.length+' nicht gespeichert – bitte erneut versuchen.':''));
    setBusy(false);
    if(saved.length)await refresh();
  };
  const back=()=>{
    if(busy)return;
    if(pending.length&&!confirm('Es sind noch nicht gespeicherte Fotos ausgewählt. Fotoseite trotzdem verlassen?'))return;
    if(fromForm&&presetProtId)go({mode:'form',aktId:akt.id,protId:presetProtId,photoReturnStep:returnStep});
    else go({mode:'akt',aktId:akt.id,...(fromDocuments?{ordner:'__unterlagen'}:{})});
  };
  return <div>
{!mobileOnly&&<button className="btn ghost sm" disabled={busy} onClick={back}>← {fromForm?'Zur Besichtigung':fromDocuments?'Zu Unterlagen':'Zum Akt'}</button>}
{!mobileOnly&&<p className="eyebrow" style={{marginTop:18}}>{akt.schadennummer||akt.aktenzeichen||'Akt'} · {akt.bezeichnung||akt.vn||''}</p>}

{!mobileOnly&&<p className="folder-home-note">Kamera oder Fotomediathek direkt in der App verwenden. Die Originalbilder werden unverändert nach OneDrive in den aktuellen Akt gespeichert.</p>}

function Skizze({ v, set }) {
  const cvs = useRef(null);
  const strokes = useRef([]);
  const cur = useRef(null);
  const bg = useRef(null);
  const [farbe, setFarbe] = useState('#12171B');
  const [dick, setDick] = useState(3);
  const W = 1400, H = 900;

  const zeichne = useCallback(() => {
    const c = cvs.current; if (!c) return;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#E2E8EA'; x.lineWidth = 1;
    for (let i = 50; i < W; i += 50) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
    for (let i = 50; i < H; i += 50) { x.beginPath(); x.moveTo(0, i); x.lineTo(W, i); x.stroke(); }
    if (bg.current) x.drawImage(bg.current, 0, 0, W, H);
    x.lineCap = 'round'; x.lineJoin = 'round';
    strokes.current.forEach(s => {
      x.strokeStyle = s.f; x.lineWidth = s.d;
      x.beginPath(); s.p.forEach((pt, i) => i ? x.lineTo(pt[0], pt[1]) : x.moveTo(pt[0], pt[1]));
      if (s.p.length === 1) { x.lineTo(s.p[0][0] + .1, s.p[0][1]); }
      x.stroke();
    });
  }, []);

  useEffect(() => {
    if (v) { const im = new Image(); im.onload = () => { bg.current = im; zeichne(); }; im.src = v; }
    else zeichne();
  }, []);

  const pos = e => {
    const r = cvs.current.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  const down = e => { e.preventDefault(); cvs.current.setPointerCapture(e.pointerId); cur.current = { f:farbe, d:dick, p:[pos(e)] }; strokes.current.push(cur.current); zeichne(); };
  const move = e => { if (!cur.current) return; e.preventDefault(); cur.current.p.push(pos(e)); zeichne(); };
  const up   = () => { if (!cur.current) return; cur.current = null; set(cvs.current.toDataURL('image/png')); };

  return (
    <div>
      <div className="tools">
        {['#12171B', '#B03A2E', '#1F4E5F', '#2E6B4F', '#F2B705'].map(f => (
          <button key={f} className={'swatch' + (farbe === f ? ' on' : '')} style={{ background:f }}
            onClick={() => setFarbe(f)} aria-label={'Stiftfarbe ' + f} />
        ))}
        <select style={{ width:'auto' }} value={dick} onChange={e => setDick(+e.target.value)}>
          <option value="2">fein</option><option value="3">mittel</option>
          <option value="6">stark</option><option value="12">Marker</option>
        </select>
        <button className="btn ghost sm" onClick={() => { strokes.current.pop(); zeichne(); set(cvs.current.toDataURL('image/png')); }}>Schritt zurück</button>
        <button className="btn ghost sm" onClick={() => { strokes.current = []; bg.current = null; zeichne(); set(null); }}>Blatt leeren</button>
      </div>
      <canvas ref={cvs} width={W} height={H} className="pad" style={{ aspectRatio:'14 / 9' }}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onPointerLeave={up} />
      <p style={{ fontSize:13, color:'var(--muted)', marginTop:6 }}>
        Mit Apple Pencil, Finger oder Maus zeichnen. Die Skizze wird als Bild in das Worddokument übernommen.
      </p>
    </div>
  );
}

const SCHRITTE = ['Rahmendaten', 'Objekt & Befund', 'Trocknung', 'Abschluss'];

function Formular({ akt, prot, setProt, go, toast, pool, setPool, cloud, initialStep=0, newProtocol=false }) {
  const [schritt, setSchritt] = useState(initialStep);
  const [busy, setBusy] = useState(false);
  const [documentStatus,setDocumentStatus]=useState('');
  const [offeneRaeume,setOffeneRaeume]=useState(()=>new Set());
  const [syncStatus,setSyncStatus]=useState(newProtocol?'Neues Protokoll – Speicherung ausstehend':'Unverändert – keine neue Speicherung');
  const firstProtocolEffect=useRef(true);
  const s = (k, v) => setProt(Object.assign({}, prot, { [k]:v }));
  const st = (k, v) => s('trocknung', Object.assign({}, prot.trocknung, { [k]:v }));

  const liste = (k, i, feld, wert) => {
    const arr = prot[k].slice(); arr[i] = Object.assign({}, arr[i], { [feld]:wert }); s(k, arr);
  };
  const wohnungen = (prot.wohnungen && prot.wohnungen.length) ? prot.wohnungen : [{ id:'legacy-'+prot.id, bewohner:'', etage:prot.geschoss||'EG', raeume:(prot.raeume||[]).length ? prot.raeume : [leererRaum()] }];
  const messortOptionen = [...new Set(wohnungen.flatMap((w,wi)=>(w.raeume||[]).filter(r=>r.bez&&r.bez.trim()).map(r=>`${w.top||('Wohnung '+(wi+1))} – ${r.bez.trim()}`)))];
  const setWohnungen = ws => setProt(Object.assign({}, prot, { wohnungen:ws, raeume:ws.flatMap(w=>w.raeume||[]) }));
  const setWohnung = (wi, feld, wert) => { const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{[feld]:wert}):w); setWohnungen(ws); };
  const uebernehmeAnwesendePerson=(wi,id)=>{const person=(prot.anwesende||[]).find(a=>a.id===id);if(person)setWohnungen(wohnungen.map((w,i)=>i===wi?{...einheitAusPerson(w,person),personRahmenFreitext:''}:w));};
  const setWohnungsRaum = (wi, ri, feld, wert) => { const ws=wohnungen.map((w,i)=>{ if(i!==wi)return w; const rs=(w.raeume||[]).map((r,j)=>j===ri?Object.assign({},r,{[feld]:wert,...(feld==='etage'?{etageManuell:true}:{})}):r); return Object.assign({},w,{raeume:rs}); }); setWohnungen(ws); };
  const setWohnungsRaumMass = (wi,ri,feld,wert) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const rs=(w.raeume||[]).map((r,j)=>{
        if(j!==ri)return r;
        const nr=Object.assign({},r,{[feld]:wert});
        const rv=raumWerte(nr);
        if(nr.bodenBetroffen==='Ja') nr.betroffenBodenbelag=rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):'';
        if(nr.wandBetroffen==='Ja') nr.betroffenWand=rv.wand>0?Number(rv.wand).toFixed(2).replace('.',','):'';
        if(nr.deckeBetroffen) nr.betroffenDecke=rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):'';
        if(nr.sockelBetroffen) nr.sockel=rv.umfang>0?Number(rv.umfang).toFixed(2).replace('.',','):'';
        return nr;
      });
      return Object.assign({},w,{raeume:rs});
    });
    setWohnungen(ws);
  };
  const setRaumJaNein = (wi,ri,art,wert) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const rs=(w.raeume||[]).map((r,j)=>{
        if(j!==ri)return r;
        const nr=Object.assign({},r); const rv=raumWerte(nr);
        if(art==='boden'){ nr.bodenBetroffen=wert; nr.betroffenBodenbelag=wert==='Ja'&&rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):''; }
        if(art==='wand'){ nr.wandBetroffen=wert; nr.betroffenWand=wert==='Ja'&&rv.wand>0?Number(rv.wand).toFixed(2).replace('.',','):''; }
        if(art==='decke'){ nr.deckeBetroffen=wert==='Ja'; nr.betroffenDecke=wert==='Ja'&&rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):''; }
        if(art==='sockel'){ nr.sockelBetroffen=wert==='Ja'; nr.sockel=wert==='Ja'&&rv.umfang>0?Number(rv.umfang).toFixed(2).replace('.',','):''; }
        return nr;
      });
      return Object.assign({},w,{raeume:rs});
    });
    setWohnungen(ws);
  };
  const setSanierungsGewerk = (wi,ri,gewerk) => { const ws=wohnungen.map((w,i)=>{ if(i!==wi)return w; const rs=(w.raeume||[]).map((r,j)=>j===ri?Object.assign({},r,{sanierungsGewerk:gewerk,sanierungsLeistung:0}):r); return Object.assign({},w,{raeume:rs}); }); setWohnungen(ws); };
  const addSanierungsposition = (wi,ri) => {
    const r=(wohnungen[wi].raeume||[])[ri];
    const gewerk=r.sanierungsGewerk||SANIERUNGS_GEWERKE[0];
    const arr=SANIERUNGS_LV[gewerk]||[]; const pos=arr[Number(r.sanierungsLeistung)||0]; if(!pos)return;
    const neu=(r.sanierungspositionen||[]).concat({id:uid(),gewerk,code:pos.code||'',gruppe:pos.gruppe||'',detail:pos.detail,einheit:pos.einheit||'',preis:pos.preis??null,kurz:pos.kurz});
    setWohnungsRaum(wi,ri,'sanierungspositionen',neu);
  };
  const delSanierungsposition = (wi,ri,pi) => {
    const r=(wohnungen[wi].raeume||[])[ri];
    setWohnungsRaum(wi,ri,'sanierungspositionen',(r.sanierungspositionen||[]).filter((_,i)=>i!==pi));
  };
  const setSanierungspositionArt=(wi,ri,pi,art)=>{
    const r=(wohnungen[wi].raeume||[])[ri];
    setWohnungsRaum(wi,ri,'sanierungspositionen',(r.sanierungspositionen||[]).map((m,i)=>i===pi?Object.assign({},m,{art}):m));
  };
  const addVereinfachteMassnahme=(wi,ri)=>{
    const r=(wohnungen[wi].raeume||[])[ri]; const m=String(r.massnahmeAuswahl||'').trim(); if(!m)return;
    const art=r.massnahmeArt||'Folgeschaden';
    const vorhanden=(r.sanierungspositionen||[]);
    if(vorhanden.some(x=>rohMassnahmeSchluessel(x.kurz||x.detail)===rohMassnahmeSchluessel(m)&&
      (x.art==='Ursachenbehebung'?'Ursachenbehebung':'Folgeschaden')===art))return;
    const neu=vorhanden.concat({id:uid(),gewerk:'Vereinfachte Maßnahme',detail:m,kurz:m,art});
    setWohnungsRaum(wi,ri,'sanierungspositionen',neu);
  };
  const toggleRaum=id=>setOffeneRaeume(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const raumOffen=r=>offeneRaeume.has(r.id)||(!r.abgeschlossen&&offeneRaeume.size===0);


  const wohnungsPersonen = w => (w.personen && w.personen.length) ? w.personen : (w.bewohner ? [{id:'legacy-'+(w.id||uid()),name:w.bewohner,funktion:w.bewohnerFunktion||''}] : []);
  const personenNamen = [...new Set([
    ...(prot.anwesende||[]).map(a=>a.name),
    ...wohnungen.flatMap(w=>wohnungsPersonen(w).map(x=>x.name)),
    ...(prot.auskuenfte||[]).map(x=>x.personFreitext)
  ].map(x=>String(x||'').trim()).filter(Boolean))];
  const ensureAnwesend = (name, funktion='Bewohner / Nutzer') => {
    const nm=String(name||'').trim(); if(!nm) return prot.anwesende||[];
    if((prot.anwesende||[]).some(a=>String(a.name||'').trim().toLowerCase()===nm.toLowerCase())) return prot.anwesende||[];
    return (prot.anwesende||[]).concat({id:uid(),name:nm,funktion,firma:'',kontakt:''});
  };
  const personFunktion = name => {
    const nm=String(name||'').trim().toLowerCase();
    const hit=(prot.anwesende||[]).find(a=>String(a.name||'').trim().toLowerCase()===nm);
    return hit?.funktion || '';
  };
  const setPersonFunktion = (name, funktion) => {
    const nm=String(name||'').trim(); if(!nm) return prot.anwesende||[];
    let found=false;
    const arr=(prot.anwesende||[]).map(a=>{
      if(String(a.name||'').trim().toLowerCase()===nm.toLowerCase()){ found=true; return Object.assign({},a,{funktion}); }
      return a;
    });
    return found ? arr : arr.concat({id:uid(),name:nm,funktion,firma:'',kontakt:''});
  };
  const setWohnungsPerson = (wi, pi, feld, wert) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).map((x,j)=>j===pi?Object.assign({},x,{[feld]:wert}):x);
      const first=ps[0]||{};
      const aktivePerson=ps[pi]||{};
      const autoAuskunft = {
        auskunftPersonFreitext:aktivePerson.name||'',
        auskunftFunktion:aktivePerson.funktion||personFunktion(aktivePerson.name)||''
      };
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''},autoAuskunft);
    });
    setWohnungen(ws);
  };
  const commitWohnungsPerson = (wi, pi, name) => {
    const nm=String(name||'').trim(); if(!nm)return;
    const current=wohnungsPersonen(wohnungen[wi]);
    const fn=current[pi]?.funktion || personFunktion(nm) || '';
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).map((x,j)=>j===pi?Object.assign({},x,{name:nm,funktion:fn}):x);
      const first=ps[0]||{};
      const aktivePerson=ps[pi]||{};
      const autoAuskunft = {auskunftPersonFreitext:aktivePerson.name||'',auskunftFunktion:aktivePerson.funktion||fn||''};
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''},autoAuskunft);
    });
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:ensureAnwesend(nm,fn)}));
  };
  const setWohnungsPersonFunktion = (wi, pi, funktion) => {
    const current=wohnungsPersonen(wohnungen[wi]);
    const name=current[pi]?.name||'';
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).map((x,j)=>j===pi?Object.assign({},x,{funktion}):x);
      const first=ps[0]||{};
      const aktivePerson=ps[pi]||{};
      const autoAuskunft = {auskunftPersonFreitext:aktivePerson.name||'',auskunftFunktion:aktivePerson.funktion||funktion||''};
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''},autoAuskunft);
    });
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:name?setPersonFunktion(name,funktion):(prot.anwesende||[])}));
  };
  const addWohnungsPerson = wi => {
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{personen:wohnungsPersonen(w).concat({id:uid(),name:'',funktion:''})}):w);
    setWohnungen(ws);
  };
  const delWohnungsPerson = (wi,pi) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).filter((_,j)=>j!==pi);
      const first=ps[0]||{};
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''});
    });
    setWohnungen(ws);
  };
  // Während einer Freitexteingabe wird nur das Feld aktualisiert. Erst beim Verlassen
  // des Namensfeldes wird die Person automatisch zu „Anwesende Personen“ übernommen.
  // Dadurch entstehen auf dem iPad keine Teilnamen wie H / Ha / Hau / Haus ... mehr.
  const setBewohner = (wi, name) => {
    const fn=personFunktion(name);
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{bewohner:name,bewohnerFunktion:fn||w.bewohnerFunktion||''}):w);
    setWohnungen(ws);
  };
  const commitBewohner = (wi, name) => {
    const fn=wohnungen[wi]?.bewohnerFunktion || personFunktion(name) || '';
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{bewohner:name,bewohnerFunktion:fn}):w);
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:ensureAnwesend(name,fn)}));
  };
  const setBewohnerFunktion = (wi, funktion) => {
    const name=wohnungen[wi]?.bewohner||'';
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{bewohnerFunktion:funktion}):w);
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:setPersonFunktion(name,funktion)}));
  };
  const setEinheitAuskunft = (wi, name) => {
    const fn=personFunktion(name);
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{auskunftPersonFreitext:name,auskunftFunktion:fn||w.auskunftFunktion||''}):w);
    setWohnungen(ws);
  };
  const commitEinheitAuskunft = (wi, name) => {
    const fn=wohnungen[wi]?.auskunftFunktion || personFunktion(name) || '';
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{auskunftPersonFreitext:name,auskunftFunktion:fn}):w);
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:ensureAnwesend(name,fn)}));
  };
  const setEinheitAuskunftFunktion = (wi, funktion) => {
    const name=wohnungen[wi]?.auskunftPersonFreitext||wohnungen[wi]?.bewohner||'';
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{auskunftFunktion:funktion}):w);
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:setPersonFunktion(name,funktion)}));
  };
  const anwesendeAuswahl = (prot.anwesende || []).filter(a => a.name && a.name.trim());
  const auskuenfte = (prot.auskuenfte && prot.auskuenfte.length)
    ? prot.auskuenfte
    : ((prot.auskunftsperson || prot.hergang)
      ? [{ id:'legacy-'+prot.id, personId:'', personFreitext:prot.auskunftsperson || '', angabe:prot.hergang || '' }]
      : [{ id:'a-'+prot.id, personId:'', personFreitext:'', angabe:'' }]);
  const setAuskuenfte = arr => setProt(Object.assign({}, prot, { auskuenfte:arr, auskunftsperson:'', hergang:'' }));
  const setAuskunft = (i, feld, wert) => setAuskuenfte(auskuenfte.map((x,j)=>j===i?Object.assign({},x,{[feld]:wert}):x));
  const addAuskunft = () => setAuskuenfte(auskuenfte.concat({ id:uid(), personId:'', personFreitext:'', angabe:'' }));
  const delAuskunft = i => {
    const arr = auskuenfte.filter((_,j)=>j!==i);
    setAuskuenfte(arr.length ? arr : [{ id:uid(), personId:'', personFreitext:'', angabe:'' }]);
  };
  const addRaumWohnung = wi => { const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{raeume:(w.raeume||[]).concat(Object.assign(leererRaum(),{etage:'',etageManuell:false}))}):w); setWohnungen(ws); };
  const delRaumWohnung = (wi,ri) => { const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{raeume:(w.raeume||[]).filter((_,j)=>j!==ri)}):w); setWohnungen(ws); };
  const delWohnung = wi => { const ws=wohnungen.filter((_,i)=>i!==wi); setWohnungen(ws.length?ws:[leereWohnung()]); };
  const wohnungTitel = (w,wi) => { const namen=(w.personen||[]).map(p=>p.name).filter(Boolean); const auskunft=w.auskunftPersonFreitext||''; const nameText=auskunft||namen.join(', ')||w.bewohner||''; return [w.top||('Einheit '+(wi+1)), nameText, w.etage||''].filter(Boolean).join(' · '); };
  const tListe = (k, i, feld, wert) => {
    const arr = prot.trocknung[k].slice(); arr[i] = Object.assign({}, arr[i], { [feld]:wert }); st(k, arr);
  };

  const gps = () => {
    if (!navigator.geolocation) return toast('Kein Standortdienst verfügbar');
    toast('Standort wird ermittelt …');
    navigator.geolocation.getCurrentPosition(
      p => { s('gps', { lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, ts:Date.now() }); toast('Standort übernommen'); },
      () => toast('Standort nicht verfügbar'),
      { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
    );
  };

  const merkePersonen = () => {}; // Personen bleiben bewusst nur im jeweiligen Akt

  useEffect(()=>{
    if(firstProtocolEffect.current){firstProtocolEffect.current=false;if(!newProtocol)return;}
    if(cloud?.storageMode==='shared'){try{cloud.stageWorkDraft(Object.assign({},akt,{protokolle:(akt.protokolle||[]).map(x=>x.id===prot.id?prot:x)}));}catch(e){setSyncStatus(e.message||String(e));return;}}
    if(!cloud?.connected){setSyncStatus('Lokal gesichert – zentrale Speicherung ausstehend');return;}
    setSyncStatus('speichert …');
    const timer=setTimeout(async()=>{
      try{await cloud.saveWorkState(Object.assign({},akt,{protokolle:(akt.protokolle||[]).map(x=>x.id===prot.id?prot:x)}));setSyncStatus('☁ synchronisiert');}
      catch(e){setSyncStatus(e.code==='CONFLICT'?'Konflikt – lokaler Entwurf gesichert':'Sync ausstehend: '+(e.message||String(e)));}
    },1200);
    return()=>clearTimeout(timer);
  },[prot]);

  const wordSpeichern = async (protokoll=prot) => {
    merkePersonen();
    const { blob, name } = await exportDocx(akt, protokoll);
    if (cloud?.connected) {
      await cloud.saveProtocol(akt, blob, name);
      toast('In OneDrive gespeichert: ' + name);
    } else {
      saveBlob(blob, name);
      toast('Microsoft nicht verbunden – Word heruntergeladen: ' + name);
    }
    return name;
  };


  const rohentwurfSpeichern = async (protokoll=prot) => {
    const { blob, name } = await exportSVRohentwurfDocx(akt, protokoll);
    const factsName=name.replace(/\.docx$/i,'.facts.json');
    const factsSnapshot={
      schemaVersion:1,
      protocolId:protokoll?.id||'',
      protocolCreatedAt:protokoll?.erstellt||'',
      protocolChangedAt:protokoll?.geaendert||'',
      generatedAt:new Date().toISOString(),
      sourceWordName:name,
      factsText:svFaktenText(akt,protokoll)
    };
    const factsBlob=new Blob([JSON.stringify(factsSnapshot,null,2)],{type:'application/json'});
    if (cloud?.connected) {
      await cloud.saveProtocol(akt, blob, name);
      const factsFile=new File([factsBlob],factsName,{type:'application/json'});
      await cloud.upload(akt,'02_Unterlagen SV',factsFile);
      toast('SV-Rohentwurf und zugehöriger Faktenzettel in OneDrive gespeichert: ' + name);
    } else {
      saveBlob(blob, name);
      saveBlob(factsBlob, factsName);
      toast('Microsoft nicht verbunden – SV-Rohentwurf und Faktenzettel heruntergeladen: ' + name);
    }
    return name;
  };

  const word = async () => {
    setBusy(true);
    try {
      setDocumentStatus('Ortsaugenscheinprotokoll wird abgelegt …');
      await wordSpeichern(prot);
      setDocumentStatus('Ortsaugenscheinprotokoll abgelegt; SV-Rohentwurf wird erstellt …');
      await rohentwurfSpeichern(prot);
      setDocumentStatus('Ortsaugenscheinprotokoll, SV-Rohentwurf und Faktenzettel wurden abgelegt.');
    } catch (e) {
      console.error(e);
      setDocumentStatus('Dokumentablage nicht vollständig: '+(e.message||String(e))+'. Bereits abgelegte Dateien bleiben erhalten.');
      toast('Word-Ablage fehlgeschlagen: ' + (e.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  const aufnahmeAbschliessen = async () => {
    if (busy) return;
    setBusy(true);
    try {
      const finalProt = Object.assign({}, prot, {
        status:'abgeschlossen',
        geaendert:new Date().toISOString()
      });
      // Erst die Dokumente ablegen; ein Fehler darf keinen erfolgreichen
      // Abschluss im gemeinsamen Arbeitsstand oder in der Anzeige behaupten.
      setDocumentStatus('Ortsaugenscheinprotokoll wird abgelegt …');
      await wordSpeichern(finalProt);
      setDocumentStatus('Ortsaugenscheinprotokoll abgelegt; SV-Rohentwurf wird erstellt …');
      await rohentwurfSpeichern(finalProt);

      // Der Abschluss wird erst nach beiden Word-Dateien und Faktenzettel
      // zentral bestätigt. Der Eingabeentwurf bleibt bei Fehlern erhalten.
      if (cloud?.connected && typeof cloud.saveWorkState === 'function') {
        const finalAkt=Object.assign({},akt,{protokolle:(akt.protokolle||[]).map(x=>x.id===finalProt.id?finalProt:x)});
        await cloud.saveWorkState(finalAkt);
      }
      setProt(finalProt);
      setDocumentStatus('Ortsaugenscheinprotokoll, SV-Rohentwurf und Faktenzettel abgelegt; Aufnahme abgeschlossen.');

      // Der bisherige automatische KI-Gutachtenlauf wird bewusst NICHT mehr beim
      // Abschluss gestartet. Nach fachlicher Bearbeitung des Rohentwurfs folgt
      // später der getrennte Schritt „Gutachten ausformulieren“.
      toast('Aufnahme abgeschlossen. Ortsaugenschein und SV-Rohentwurf wurden abgelegt.');
    } catch (e) {
      console.error(e);
      setDocumentStatus('Aufnahme nicht vollständig abgeschlossen: '+(e.message||String(e))+'. Bereits abgelegte Dateien bleiben erhalten.');
      toast('Aufnahme konnte nicht abgeschlossen werden: ' + (e.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  const summe = useMemo(() => {
    let f = 0, w = 0;
    wohnungen.flatMap(x=>x.raeume||[]).forEach(r => { if (!r.bez.trim() || !r.betroffen) return; const v = raumWerte(r); f += n(r.betroffenBoden)>0?n(r.betroffenBoden):v.flaeche; w += n(r.betroffenWand)>0?n(r.betroffenWand):v.wand; });
    return { f, w };
  }, [prot.wohnungen, prot.raeume]);

  return (
    <div>
      <p className="eyebrow">{akt.aktenzeichen || 'ohne AZ'} · {akt.bezeichnung}</p>
      <h2 className="sec">Ortsaugenschein</h2>
      <div className={'statusbox '+(syncStatus.startsWith('Konflikt')||syncStatus.startsWith('Sync ausstehend:')?'warn':'')} role={syncStatus.startsWith('Konflikt')||syncStatus.startsWith('Sync ausstehend:')?'alert':'status'} aria-live="polite" style={{marginBottom:12}}>
        <strong>{syncStatus}</strong>
        {syncStatus.startsWith('Konflikt')&&<p style={{margin:'6px 0 0'}}>Die zentrale Fassung wurde zwischenzeitlich geändert. Dein lokaler Entwurf bleibt erhalten. Bitte über „Gemeinsamen Stand laden“ beide Fassungen vergleichen.</p>}
      </div>
      <div className="conn" style={{margin:'8px 0 12px'}}><button type="button" className="btn secondary sm" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__fotos',photoProtId:prot.id,photoFromForm:true,photoReturnStep:schritt})}>📷 Foto aufnehmen / Fotodokumentation</button></div>
      <p className="mono" style={{ fontSize:12, color:'var(--muted)' }}>{aktOrdner(akt)}/02_Unterlagen SV/</p>

      <div className="steps">
        {SCHRITTE.map((t, i) => (
          <button key={t} className={'step' + (i === schritt ? ' on' : i < schritt ? ' done' : '')}
            onClick={() => setSchritt(i)}>
            <span className="n">{String(i + 1).padStart(2, '0')}</span>
            <span className="t">{t}</span>
          </button>
        ))}
      </div>

      {/* ---------- SCHRITT 1 ---------- */}
      {schritt === 0 && (
        <div>
          <Card titel="Termin">
            <div className="grid g4">
              <Txt l="Datum" type="date" v={prot.datum} set={v => s('datum', v)} />
              <Txt l="Uhrzeit (HH:MM)" v={prot.uhrzeit} set={v => s('uhrzeit', v)} ph="09:00" />
              
              
            </div>
            <div className="grid g2" style={{ marginTop:12 }}>
              <Txt l="Sachverständiger" v={prot.gutachter} set={v => s('gutachter', v)} />
              <Sel l="Geschoss (Vorgabe für Einheiten und Räume)" v={prot.geschoss||''} set={v=>s('geschoss',v)} opts={ETAGEN} leer="— auswählen —" />

            </div>
          </Card>

          <Card titel="Anwesende Personen"
            extra={<button className="btn sig sm" onClick={() => s('anwesende', prot.anwesende.concat({ id:uid(), name:'', funktion:'', firma:'', kontakt:'' }))}>+ Person</button>}>
            <div className="rows">
              {prot.anwesende.map((a, i) => (
                <div key={a.id} className="row person" style={{gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))'}}>
                  <SelectFree l="Name" v={a.name||''} set={v => {
                    const arr=prot.anwesende.slice();
                    arr[i]=Object.assign({},arr[i],{name:v});
                    s('anwesende',arr);
                  }} opts={personenNamen} leer="— Person wählen —" freiLabel="Neue Person eingeben" />

                      {(r.bodenBetroffen==='Ja'||r.wandBetroffen==='Ja'||r.deckeBetroffen||r.sockelBetroffen)&&<div className="compact-section"><span className="eyebrow">Konkrete Schadenbilder</span>

                        {r.wandBetroffen==='Ja'&&<SchadenbildAuswahl titel={'Wand'+(r.wandoberflaeche?' · '+r.wandoberflaeche:'')} werte={r.schadenbilderWand||[]} setWerte={x=>setWohnungsRaum(wi,ri,'schadenbilderWand',x)} optionen={SCHADENBILDER_WAND} freitext={r.schadenbildFreitextWand||''} setFreitext={x=>setWohnungsRaum(wi,ri,'schadenbildFreitextWand',x)} />}

                        {r.sockelBetroffen&&<SchadenbildAuswahl titel="Sockelleisten" werte={r.schadenbilderSockel||[]} setWerte={x=>setWohnungsRaum(wi,ri,'schadenbilderSockel',x)} optionen={SCHADENBILDER_SOCKEL} freitext={r.schadenbildFreitextSockel||''} setFreitext={x=>setWohnungsRaum(wi,ri,'schadenbildFreitextSockel',x)} />}

                          const min=/Dämmstofftrocknung/i.test(v)?110:26;
                          const akt=parseFloat(String(arr[i].anzahl||'').replace(',','.'));

                      {istVariableTrocknungsflaeche(g.typ) ? (
                        <div>
                          <label>Trocknungsfläche</label>
                          <select value={g.flaecheFrei?'__frei__':String(g.anzahl||'')} onChange={e=>{
                            const arr=prot.trocknung.geraete.slice();
                            const frei=e.target.value==='__frei__';
                            arr[i]=Object.assign({},arr[i],{flaecheFrei:frei, anzahl:frei?'':e.target.value});
                            st('geraete',arr);
                          }}>
                            {trocknungsflaechenOptionen(g.typ).map(x=><option key={x} value={x}>{x} m²</option>)}
                            <option value="__frei__">Freie Eingabe …</option>
                          </select>
                          {g.flaecheFrei && <div style={{marginTop:6}}><Txt l="Trocknungsfläche · freie Eingabe (m²)" v={g.anzahl||''} set={v=>tListe('geraete',i,'anzahl',v)} num /></div>}
                        </div>
                      ) : (
                        <Txt l="Menge / Anzahl" v={g.anzahl} set={v => tListe('geraete', i, 'anzahl', v)} num />
                      )}
                      <Kill on={() => st('geraete', prot.trocknung.geraete.filter((_, j) => j !== i))} />
                    </div>
                  ))}
                </div>
              </Card>

              <Card titel="Feuchtemessungen"
                extra={<button className="btn sig sm" onClick={() => st('messungen', prot.trocknung.messungen.concat({ id:uid(), ort:'', material:'', wert:'', datum:heute() }))}>+ Messung</button>}>
                {!prot.trocknung.messungen.length && <p style={{ color:'var(--muted)', margin:0 }}>Noch keine Messwerte erfasst.</p>}
                <div className="rows">
                  {prot.trocknung.messungen.map((m, i) => (
                    <div key={m.id} className="row mess">
                      <Sel l="Messort" v={m.ort} set={v => tListe('messungen', i, 'ort', v)} opts={m.ort && !messortOptionen.includes(m.ort) ? [m.ort].concat(messortOptionen) : messortOptionen} leer="— Raum aus Objekt & Befund wählen —" />
                      <Sel l="Material" v={m.material} set={v => tListe('messungen', i, 'material', v)} opts={MATERIALIEN} />
                      <Sel l="Messwert · Digits" v={m.wert||''} set={v => tListe('messungen', i, 'wert', v)} opts={Array.from({length:101},(_,n)=>String(n))} leer="— 0–100 Digits —" />
                      <Txt l="Datum" type="date" v={m.datum} set={v => tListe('messungen', i, 'datum', v)} />
                      <Kill on={() => st('messungen', prot.trocknung.messungen.filter((_, j) => j !== i))} />
                    </div>
                  ))}
                </div>
              </Card>
            </div>
          )}
        </div>
      )}

      {/* ---------- SCHRITT 4 ---------- */}
      {schritt === 3 && (
        <div>
          <Card titel="Beurteilung und Abschluss">
            <div className="grid g2">
              <Sel l="Schadenursache · Einheit" v={prot.ursacheWohnungId||''} set={v=>setProt(Object.assign({},prot,{ursacheWohnungId:v,ursacheEinheitId:wohnungen.find((w,wi)=>wohnungTitel(w,wi)===v)?.id||''}))} opts={wohnungen.map((w,wi)=>wohnungTitel(w,wi))} leer="— betroffene Einheit wählen —" />
              <Sel l="Schadenursache · Hauptkategorie" v={prot.ursacheKategorie||''} set={v=>setProt(Object.assign({},prot,{ursacheKategorie:v,ursacheUnterkategorie:''}))} opts={URSACHEN_HAUPTKATEGORIEN} leer="— Hauptkategorie auswählen —" />
            </div>
            <div style={{marginTop:12}}>
              <Sel l="Schadenursache · Unterkategorie" v={prot.ursacheUnterkategorie||''} set={v=>s('ursacheUnterkategorie',v)} opts={URSACHEN_KATEGORIEN[prot.ursacheKategorie]||[]} leer={prot.ursacheKategorie ? '— Unterkategorie auswählen —' : '— zuerst Hauptkategorie wählen —'} />
            </div>
            <div style={{marginTop:12}}><Area l="Schadenursache · Feststellung des SV" v={svUrsachenText(prot)} set={v => setProt(Object.assign({},prot,{ursache:v,ursacheManuell:true}))}
              ph="Kurze fachliche Konkretisierung der Schadenursache. Diese SV-Angabe hat Vorrang vor abweichenden Aktenunterlagen." /><p style={{fontSize:12,color:'var(--muted)'}}>Ohne manuelle Abschlussangabe werden die Ursachenfeststellungen der gewählten Einheit übernommen. Bei mehreren Einheiten bleiben deren Texte getrennt bezeichnet.</p><button type="button" className="btn ghost sm" onClick={()=>setProt(Object.assign({},prot,{ursache:'',ursacheManuell:false}))}>Ursachentext wieder automatisch übernehmen</button></div>
            <div className="grid g2" style={{marginTop:12}}>
              <Sel l="Schadenursache nachvollziehbar und plausibel" v={prot.ursachePlausibel||''} set={v=>s('ursachePlausibel',v)} opts={['Ja','Nein']} leer="— auswählen —" />
              <Sel l="Regressmöglichkeit" v={prot.regress||''} set={v=>s('regress',v)} opts={['Ja','Nein']} leer="— auswählen —" />
            </div>
            
            <div style={{ marginTop:12 }}>
              <Area l="Anmerkungen" v={prot.zusammenfassung} set={v => s('zusammenfassung', v)} hoch />
            </div>
            
            <div style={{marginTop:12,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <button className="btn sig" type="button" disabled={busy} onClick={aufnahmeAbschliessen}>
                {busy ? 'Wird abgeschlossen …' : '✓ Aufnahme abschließen & Dokumente ablegen'}
              </button>
              <span className={'chip '+(prot.status==='abgeschlossen'?'fertig':'entwurf')}>
                {prot.status==='abgeschlossen'?'Aufnahme abgeschlossen':'Aufnahme offen'}
              </span>
            </div>
          </Card>

          <Card titel="Ausgabe">
            {documentStatus&&<p role="status" aria-live="polite">{documentStatus}</p>}
            <button className="btn ghost sm" disabled={busy} onClick={async()=>{setBusy(true);try{await rohentwurfSpeichern(prot);setDocumentStatus('SV-Rohentwurf und Faktenzettel abgelegt.');}catch(e){setDocumentStatus('SV-Rohentwurf nicht vollständig abgelegt: '+(e.message||String(e)));}finally{setBusy(false);}}}>Nur SV-Rohentwurf erneut ablegen</button>
            <p style={{ marginTop:0, color:'var(--muted)', fontSize:14 }}>
              {cloud?.connected
                ? 'Beim Abschluss werden das Ortsaugenscheinprotokoll und zusätzlich ein SV-Rohentwurf als Word direkt in 02_Unterlagen SV gespeichert. Der bisherige automatische KI-Gutachtenlauf wird dabei nicht mehr gestartet.'
                : 'Microsoft ist nicht verbunden. Ortsaugenscheinprotokoll und SV-Rohentwurf werden lokal heruntergeladen.'}
            </p>
            <p className="mono" style={{ fontSize:13 }}>{aktOrdner(akt)}/02_Unterlagen SV/</p>
            <button className="btn sig" disabled={busy} onClick={word}>
              {busy ? 'Wird erstellt …' : 'Protokoll & SV-Rohentwurf ablegen'}
            </button>
          </Card>
        </div>
      )}

      <div className="bar">
        {cloud?.storageMode==='shared'&&<button className="btn ghost" onClick={()=>cloud.reloadSharedWork(akt).catch(e=>toast(e.message))}>Gemeinsamen Stand laden</button>}
        <span className="note">{syncStatus} · {dDE(prot.datum)}</span>
        <button className="btn ghost" onClick={() => go({ mode:'akt', aktId:akt.id })}>Zum Akt</button>
        <button className="btn ghost" disabled={schritt === 0} onClick={() => setSchritt(schritt - 1)}>Zurück</button>
        {schritt < 3
          ? <button className="btn" onClick={() => setSchritt(schritt + 1)}>Weiter</button>
          : <button className="btn sig" disabled={busy} onClick={word}>Word</button>}
      </div>
    </div>
  );
}

const mergeSharedAct=(local,remote)=>remote.sharedPending?local:{...local,...remote,id:local.id,protokolle:Array.isArray(remote.protokolle)?remote.protokolle:local.protokolle};

const sharedWorkPayload=a=>({schemaVersion:1,updatedAt:new Date().toISOString(),akt:{vn:a.vn||'',geschaedigter:a.geschaedigter||'',bezeichnung:a.bezeichnung||'',adresse:a.adresse||'',strasse:a.strasse||'',hausnummer:a.hausnummer||'',plz:a.plz||'',ort:a.ort||''},protokolle:a.protokolle||[]});

function EntwurfVergleich({cloud,toast}) {
  const [review,setReview]=useState(null),[busy,setBusy]=useState(false),[error,setError]=useState('');
  const compare=async draft=>{setBusy(true);setError('');setReview(null);try{setReview({draft,remote:await cloud.previewDraft(draft)});}catch(e){setError(e.message||String(e));}finally{setBusy(false);}};
  const choose=async local=>{
    if(!review||busy)return;
    const question=local?'Diesen lokalen Entwurf als neue zentrale Fassung speichern? Die angezeigte zentrale Fassung wird ersetzt.':'Die angezeigte zentrale Fassung übernehmen? Der lokale Entwurf wird vorher heruntergeladen.';
    if(!confirm(question))return;
    setBusy(true);setError('');
    try{await cloud.resolveDraft(review.draft,review.remote,local);setReview(null);toast(local?'Entwurf zentral bestätigt.':'Zentrale Fassung übernommen.');}
    catch(e){setError(e.message||String(e));}finally{setBusy(false);}
  };
  return <Card titel="Entwürfe vergleichen und wiederaufnehmen">
    <p>Vergleiche Disposition oder Protokolle vor einer zentralen Übernahme. Bei erneuten Änderungen muss der Vergleich wiederholt werden.</p>
    {cloud.pendingDrafts().map(d=><div key={d.key} style={{marginBottom:12}}>
      <strong>{d.name==='Disposition.json'?'Disposition':'Protokolle'} · {d.caseId}</strong><br/><small>{d.updatedAt}</small>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>
        <button className="btn ghost sm" disabled={busy} onClick={()=>cloud.resumeDraft(d).catch(e=>setError(e.message||String(e)))}>Lokal weiterbearbeiten</button>
        <button className="btn ghost sm" disabled={busy||!cloud.connected} onClick={()=>compare(d)}>Mit zentraler Fassung vergleichen</button>
      </div>
    </div>)}
    {error&&<p role="alert">{error}</p>}
    {review&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:12}}>
        <label>Lokaler Entwurf<textarea readOnly rows={16} style={{width:'100%'}} value={JSON.stringify(review.draft.data,null,2)}/></label>
        <label>Zentrale Fassung<textarea readOnly rows={16} style={{width:'100%'}} value={review.remote?JSON.stringify(review.remote.data,null,2):'Noch keine zentrale Fassung vorhanden.'}/></label>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:12}}>
        <button className="btn ghost sm" disabled={busy} onClick={()=>choose(false)}>Zentrale Fassung übernehmen</button>
        <button className="btn sig sm" disabled={busy} onClick={()=>choose(true)}>Lokalen Entwurf zentral speichern</button>
        <button className="btn ghost sm" disabled={busy} onClick={()=>setReview(null)}>Vergleich schließen</button>
      </div>
    </div>}
  </Card>;
}

function App() {
  const [akten, setAkten] = useState(() => load(STORE, []));
  const [pool, setPool]   = useState(() => load(POOL, []));
  const [view, setView]   = useState({ mode:'start' });
  const [photoMobileSession,setPhotoMobileSession]=useState(()=>{try{const q=new URLSearchParams(location.search);return q.get('photoAct')?{act:q.get('photoAct'),prot:q.get('photoProt')||''}:JSON.parse(sessionStorage.getItem('studiof_photo_session')||'null');}catch(_){return null;}});
  const [sheet, setSheet] = useState(false);
  const [msg, setMsg]     = useState(null);
  const [railAuf, setRailAuf] = useState(false);
  const [msCfg, setMsCfgState] = useState(() => Object.assign({},DEFAULT_MS,load(MSSTORE,DEFAULT_MS)));
  const [msToken, setMsToken] = useState(() => {try{return JSON.parse(sessionStorage.getItem(MSTOKEN)||'null');}catch(e){return null;}});
  const [sharedReady,setSharedReady]=useState(false);
  const [sharedError,setSharedError]=useState('');
  const sharedStoreRef=useRef(null);
  const [draftRevision,setDraftRevision]=useState(0);
  const [msUser, setMsUser] = useState(null);
  const [agentCfg, setAgentCfgState] = useState(() => Object.assign({},DEFAULT_AGENT,load(AGENTSTORE,DEFAULT_AGENT)));
  const setAgentCfg = v => { setAgentCfgState(v); save(AGENTSTORE,v); };

  const setMsCfg = v => {
    try { SharedStorage.validateConfig(v); } catch(e) { toast(e.message); return; }
    if(sharedStoreRef.current?.pendingCount()){toast('Bitte den aktiven Speichervorgang abwarten.');return;}
    if(SharedStorage.fingerprint(v)!==SharedStorage.fingerprint(msCfg)||v.clientId!==msCfg.clientId){
      if(!save(STORE+'_snapshot_'+SharedStorage.fingerprint(msCfg),{akten,pool,ts:new Date().toISOString()})){toast('Lokale Sicherung fehlgeschlagen. Die Ablage wurde nicht geändert.');return;}
      setAkten([]);setPool([]);setMsToken(null);setMsUser(null);sessionStorage.removeItem(MSTOKEN);
      setSharedReady(false);sharedStoreRef.current=null;
    }
    setMsCfgState(v);save(MSSTORE,v);
  };
  useEffect(() => { if (!save(STORE, akten)) setMsg('Speicher voll — bitte Datensicherung anlegen'); }, [akten]);
  useEffect(() => { save(POOL, pool); }, [pool]);

  const toast = t => { setMsg(t); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(null), 2600); };
  const go = v => { setView(v); setRailAuf(false); window.scrollTo(0, 0); };


  useEffect(()=>{
    (async()=>{
      const q=new URLSearchParams(location.search), code=q.get('code'), state=q.get('state'), err=q.get('error');
      if(err){toast(q.get('error_description')||err);history.replaceState({},'',msRedirectUri());return;}
      if(code){
        if(state!==sessionStorage.getItem('gp_shared_test_oauth_state')){toast('Microsoft-Anmeldung: Sicherheitsprüfung fehlgeschlagen');return;}
        try{const t=await exchangeMicrosoftCode(msCfg,code);setMsToken(t);history.replaceState({},'',msRedirectUri());toast('Microsoft verbunden');}
        catch(e){toast(e.message||String(e));}
      }
    })();
  },[]);

  const accessToken=async()=>{
    let t=msToken; if(!t){try{t=JSON.parse(sessionStorage.getItem(MSTOKEN)||'null');}catch(e){}} if(!t)return null;
    if((t.expires_at||0)<Date.now()+60000){t=await refreshMicrosoftToken(msCfg,t); if(t)setMsToken(t);}
    return t?.access_token||null;
  };
  const graphPage=async(path,opts={})=>{
    const tok=await accessToken(); if(!tok)throw new Error('Nicht mit Microsoft verbunden');
    const r=await fetch('https://graph.microsoft.com/v1.0'+SharedStorage.graphPath(path,msCfg),Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+tok})}));
    if(r.status===204)return null; const d=await r.json().catch(()=>null); if(!r.ok){const e=new Error(d?.error?.message||('Microsoft Graph '+r.status));e.status=r.status;e.code=d?.error?.code;throw e;} return d;
  };
  const graph=(path,opts={})=>!opts.method||opts.method==='GET'?SharedStorage.collectPages(graphPage,path,msCfg,opts):graphPage(path,opts);
  const graphRef=useRef(graph);graphRef.current=graph;
  const pendingPrefix='studiof_shared_pending_'+SharedStorage.fingerprint(msCfg)+'_';
  const pendingDrafts=()=>{const out=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith(pendingPrefix)){try{out.push({key,...JSON.parse(localStorage.getItem(key))});}catch(e){}}}return out;};
  const getSharedStore=()=>{
    if(msCfg.storageMode!=='shared')return null;
    if(!sharedStoreRef.current||sharedStoreRef.current.fingerprint!==SharedStorage.fingerprint(msCfg)){
      sharedStoreRef.current=SharedStorage.createStore({config:msCfg,graph:(...args)=>graphRef.current(...args),
        persistPending:(key,value)=>{const storageKey=pendingPrefix+key;if(value===null)localStorage.removeItem(storageKey);else if(!save(storageKey,value))throw new Error('Lokaler Entwurf konnte nicht gesichert werden. Bitte Speicher freigeben.');setDraftRevision(x=>x+1);}
      });
    }
    return sharedStoreRef.current;
  };
  useEffect(()=>{
    let active=true;setSharedReady(false);setSharedError('');
    if(!msToken?.access_token||msCfg.storageMode!=='shared')return;
    (async()=>{try{await getSharedStore().verify();if(active)setSharedReady(true);}catch(e){if(active)setSharedError(e.message||String(e));}})();
    return()=>{active=false;};
  },[msToken?.access_token,SharedStorage.fingerprint(msCfg)]);
  const validateDraft=d=>{
    if(!d||!['AppArbeitsstand.json','Disposition.json'].includes(d.name)||!d.caseId||!d.data||typeof d.data!=='object'||Array.isArray(d.data)||d.key!==pendingPrefix+SharedStorage.recordKey(msCfg,d.caseId,d.name))throw new Error('Dieser Entwurf gehört nicht zur eingerichteten Testablage.');
    const stored=pendingDrafts().find(x=>x.key===d.key);
    if(!stored||stored.updatedAt!==d.updatedAt||JSON.stringify(stored.data)!==JSON.stringify(d.data))throw new Error('Der lokale Entwurf hat sich geändert. Bitte erneut vergleichen.');
  };
  const applyDraftData=(d,data)=>{
    // Functional state update avoids replacing unrelated acts edited during a request.
    setAkten(prev=>{
      const old=prev.find(a=>a.cloudItemId===d.caseId);
      const a=old||{...leererAkt(),id:uid(),cloudItemId:d.caseId,aktenzeichen:d.caseId};
      const fields=d.name==='Disposition.json'?dispoMergeFields(data||{}):{...(data?.akt||{}),protokolle:data?.protokolle||[]};
      const next={...a,...fields,geaendert:new Date().toISOString()};
      return old?prev.map(x=>x.id===old.id?next:x):prev.concat(next);
    });
  };
  const resumeDraft=async d=>{validateDraft(d);applyDraftData(d,d.data);toast('Lokaler Entwurf wiederhergestellt. Zentrale Speicherung noch nicht bestätigt.');};
  const previewDraft=async d=>{validateDraft(d);return getSharedStore().preview(d.caseId,d.name);};
  const resolveDraft=async(d,reviewed,useLocal)=>{
    validateDraft(d);
    if(!useLocal&&!reviewed)throw new Error('Es gibt noch keine zentrale Fassung. Bitte den lokalen Entwurf speichern oder weiterbearbeiten.');
    saveBlob(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),'StudioF_Entwurf_'+d.caseId+'_'+d.name);
    const row=await getSharedStore().resolveReviewed(d.caseId,d.name,reviewed,useLocal?d.data:undefined,msUser?.userPrincipalName);
    applyDraftData(d,row?.data);
  };
  const reloadSharedWork=async a=>{
    go({mode:'start'});toast('Bitte den lokalen Entwurf hier mit der zentralen Fassung vergleichen.');
  };
  useEffect(()=>{if(msToken?.access_token)graph('/me?$select=displayName,userPrincipalName').then(setMsUser).catch(()=>setMsUser(null));else setMsUser(null);},[msToken]);
  const cloudRoot = () => SharedStorage.assertTestRoot(msCfg);
  const cloudStatusPath = key => key==='offen' ? cloudRoot() : `${cloudRoot()}/${STATUS_ORDNER[key]}`;
  const cloudAktPath = a => statusKey(a)==='abgelegt' ? `${cloudStatusPath('abgelegt')}/${a.ablageKategorie||a.schadensart||'Leitungswasser'}/${aktName(a)}` : `${cloudStatusPath(statusKey(a))}/${aktName(a)}`;
  const graphItemByPath=async path=>graph(`/me/drive/root:/${encPath(path)}:`);
  const ensurePath=async path=>{
    const parts=String(path).split('/').filter(Boolean); let parent='root', built=[];
    for(const name of parts){
      built.push(name); let item=null;
      try{item=await graphItemByPath(built.join('/'));}catch(e){if(e.status!==404)throw e;}
      if(!item){item=await graph(parent==='root'?'/me/drive/root/children':`/me/drive/items/${parent}/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});}
      parent=item.id;
    }
    return parent;
  };
  const ensureBase=async()=>{await ensurePath(cloudRoot());for(const k of ['tagesbesichtigung','besichtigt','abgelegt'])await ensurePath(cloudStatusPath(k));};
  const ensureArchiveStructure=async()=>{
    await ensureBase();
    const parentId=await ensurePath(cloudStatusPath('abgelegt'));
    const d=await graph(`/me/drive/items/${parentId}/children?$select=id,name,folder&$top=200`);
    const present=new Set((d.value||[]).filter(x=>x.folder).map(x=>x.name));
    for(const name of SCHADENARTEN){
      if(present.has(name))continue;
      try{await graph(`/me/drive/items/${parentId}/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});}
      catch(e){
        const already=await graphItemByPath(cloudStatusPath('abgelegt')+'/'+name).catch(()=>null);
        if(!already?.folder)throw e;
      }
      present.add(name);
    }
    return true;
  };
  const listStatusFolder=async(key,category='')=>{
    if(!['offen','tagesbesichtigung','besichtigt','abgelegt'].includes(key))throw new Error('Ungültiger Arbeitsordner.');
    await ensureBase();
    if(key==='abgelegt'&&!SCHADENARTEN.includes(category))throw new Error('Bitte zuerst eine gültige Schadenkategorie öffnen.');
    const path=cloudStatusPath(key)+(key==='abgelegt'?'/'+category:'');
    const folderId=await ensurePath(path);
    let url=`/me/drive/items/${folderId}/children?$select=id,name,folder,lastModifiedDateTime&$top=200`;
    const items=[];
    do{
      const result=await graph(url);
      items.push(...(result.value||[]));
      const next=result['@odata.nextLink']||'';
      url=next.startsWith('https://graph.microsoft.com/v1.0')?next.slice('https://graph.microsoft.com/v1.0'.length):'';
    }while(url);
    return items.filter(it=>it.folder&&(key!=='offen'||!['000_Tagesbesichtigung','00_Besichtigt','00_abgelegt','000_AppSystem'].includes(it.name))).map(it=>Object.assign({
      cloudItemId:it.id,cloudName:it.name,cloudParentStatus:key,
      ablageKategorie:key==='abgelegt'?category:'',geaendert:it.lastModifiedDateTime,
      status:key==='abgelegt'?'abgeschlossen':key==='besichtigt'?'Bearbeitung':key==='offen'?'offen':'Besichtigung'
    },parseCloudAktName(it.name))).sort((a,b)=>(a.schadennummer||'').localeCompare(b.schadennummer||'', 'de-AT',{numeric:true}));
  };

            const complete=await cloud.reconcileTerminInvitation(Object.assign({},base,detail));
            if(complete){base=complete;detail=dispoMergeFields(complete);}
          }
          if(['preparing','queued'].includes(detail.terminAenderung?.status)){
            const changed=await cloud.reconcileTerminChange(Object.assign({},base,detail));
            if(changed){enriched.push(Object.assign({},changed));continue;}
          }
        }catch(e){if(msCfg.storageMode==='shared')throw e;console.warn('Disposition / Outlook-Rückmeldung konnte nicht geladen werden:',f.aktenzeichen,e);}
        let work={};if(msCfg.storageMode==='shared'&&!pendingDrafts().some(x=>x.caseId===f.cloudItemId)){const r=await cloud.readWorkState(f);if(r?.data)work={...(!Object.keys(detail).length?(r.data.akt||{}):{}),protokolle:r.data.protokolle||[]};}
        enriched.push(Object.assign({},base,detail,work));
      }
      setAkten(prev=>{
        const out=prev.filter(a=>!hiddenIds.has(a.cloudItemId));
        for(const f of enriched){
          let i=out.findIndex(a=>a.cloudItemId===f.cloudItemId || (a.aktenzeichen===f.aktenzeichen && statusKey(a)===f.cloudParentStatus));
          if(i>=0){
            const keep=out[i];
            if(f.sharedPending)continue;
            if(msCfg.storageMode==='shared'){out[i]=mergeSharedAct(keep,f);continue;}
            out[i]=Object.assign({},f,keep,dispoMergeFields(f),{...(msCfg.storageMode==='shared'&&Array.isArray(f.protokolle)?{protokolle:f.protokolle}:{}),
              cloudItemId:f.cloudItemId,
              cloudParentStatus:f.cloudParentStatus,
              status:f.status,
              geaendert:f.geaendert
            });
          } else out.push(Object.assign(leererAkt(),{auftragDatum:''},f,{id:uid(),jahr:f.jahr||String(new Date().getFullYear()),protokolle:f.protokolle||[]}));
        }
        return out;
      });
      toast(found.length+' aktive OneDrive-Akten synchronisiert');
    }catch(e){toast(e.message||String(e));}
  };

  useEffect(() => {
    if (view.mode === 'form' && view.protId === 'neu' && akt) {
      const p = leeresProtokoll();
      setAkt(Object.assign({}, akt, { protokolle:akt.protokolle.concat(p) }));
      setView({ mode:'form', aktId:akt.id, protId:p.id, newProtocol:true });
    }
  }, [view]);

  const sicherung = () => {
    saveBlob(new Blob([JSON.stringify({ akten, pool, ts:new Date().toISOString() }, null, 1)], { type:'application/json' }),
      'Gutachten-Sicherung_' + heute() + '.json');
    toast('Sicherung erstellt');
  };
  const einlesen = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.akten)) throw 0;
        const ids = akten.map(a => a.id);
        setAkten(akten.concat(d.akten.filter(a => ids.indexOf(a.id) < 0)));
        if (Array.isArray(d.pool)) setPool(d.pool);
        toast('Sicherung eingelesen');
      } catch (x) { toast('Datei nicht lesbar'); }
    };
    r.readAsText(f); e.target.value = '';
  };

  const pfad = prot ? aktOrdner(akt) + '/03_Ortsaugenschein/'
    : akt ? aktOrdner(akt) + (view.ordner ? '/' + view.ordner : '') + '/'
    : '/Gutachten_Business/';

  return (
    <div>
      {view.mode === 'photo-mobile' && akt && <main style={{maxWidth:760,margin:'0 auto',padding:16}}>{!cloud.connected&&<div className="statusbox warn" style={{marginBottom:14}}>Microsoft ist am iPhone noch nicht verbunden. <button className="btn sig sm" onClick={()=>go({mode:'settings'})}>Microsoft anmelden</button></div>}<Fotoablage akt={akt} cloud={cloud} go={v=>v.mode==='akt'?setView({mode:'photo-mobile',aktId:akt.id,photoProtId:view.photoProtId||''}):go(v)} presetProtId={view.photoProtId||''} mobileOnly={true}/><button className="btn ghost sm" onClick={()=>{sessionStorage.removeItem('studiof_photo_session');setPhotoMobileSession(null);go({mode:'start'});}}>Foto-Sitzung beenden</button></main>}
      {photoMobileSession && !akt && <main style={{maxWidth:650,margin:'0 auto',padding:20}}><h2>iPhone-Fotoerfassung</h2><p>Der Ortsaugenschein wird in der gemeinsamen Testablage gesucht. Bitte das Microsoft-Konto verbinden und die Akten synchronisieren.</p><button className="btn sig" onClick={syncCloudAkten} disabled={!cloud.connected}>Akten synchronisieren</button><button className="btn secondary" style={{marginLeft:8}} onClick={()=>go({mode:'settings'})}>Microsoft-Anmeldung</button></main>}
      {view.mode !== 'assistenz' && view.mode !== 'photo-mobile' && (!photoMobileSession || view.mode==='settings') && <>
      <header className="top">
        <button className="btn sig sm tabsw" onClick={() => setRailAuf(!railAuf)}>Ablage</button>
        <h1>Studio F · Gutachten</h1>
        <span className="path">{pfad}</span>
        <span className="who">{GUTACHTER.split(' ').slice(-1)[0]}</span>
      </header>

      <div className="shell">
        <Rail akten={akten} view={view} go={go} neu={() => setSheet(true)} versteckt={!railAuf} />
        <main className="main">
          {view.mode === 'start' && (
            <div>
              <Start akten={akten} go={go} neu={() => setSheet(true)} cloud={cloud} syncCloud={syncCloudAkten} />
              <Card titel="Mehrbenutzer-Testversion">
                <p>Getrennte Microsoft-Konten · gemeinsame Testablage. Word direkt und neue Termine verwenden separate Testflows. TEST-Einladungen gehen ausschließlich an guggenbichler@studio-f.at. Terminänderungen und weitere KI-Aufträge bleiben gesperrt.</p>
                {cloud.sharedError&&<p role="alert">{cloud.sharedError}</p>}
                <p>{cloud.pendingDrafts().length} lokal gesicherte, noch nicht bestätigte Änderungen.</p>
                <button className="btn ghost sm" onClick={()=>saveBlob(new Blob([JSON.stringify(cloud.pendingDrafts(),null,2)],{type:'application/json'}),'StudioF_ausstehende_Entwuerfe.json')}>Ausstehende Entwürfe sichern</button>
              </Card>
              <EntwurfVergleich cloud={cloud} toast={toast}/>
              <Card titel="Datensicherung">
                <p style={{ marginTop:0, fontSize:14, color:'var(--muted)' }}>
                  Die Testversion speichert Aktenstammdaten und Protokolle in der gemeinsamen Testablage. Nicht bestätigte Änderungen bleiben zusätzlich als lokale Entwürfe erhalten. Sicherungen enthalten ausschließlich den Datenstand dieser Testversion.
                </p>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
                  <button className="btn ghost sm" onClick={sicherung}>Sicherung herunterladen</button>
                  <label className="btn ghost sm" style={{ cursor:'pointer' }}>
                    Sicherung einlesen
                    <input type="file" accept="application/json" style={{ display:'none' }} onChange={einlesen} />
                  </label>
                </div>
              </Card>
            </div>
          )}

          {view.mode === 'folder' && <OrdnerAnsicht key={(view.key||'')+'|'+(view.category||'')} folderKey={view.key} category={view.category||''} cloud={cloud} go={go} onOpen={openCloudFolderAkt} />}

          {view.mode === 'settings' && <Einstellungen cfg={msCfg} setCfg={setMsCfg} cloud={cloud} go={go} toast={toast} agentCfg={agentCfg} setAgentCfg={setAgentCfg} />}
          {view.mode === 'akt' && akt &&
            <AktView akt={akt} ordner={view.ordner} setAkt={setAkt} go={go} loeschAkt={loeschAkt} toast={toast} cloud={cloud} agent={{cfg:agentCfg}} sourceDriveItemId={view.sourceDriveItemId||''} sourceFileName={view.sourceFileName||''} photoProtId={view.photoProtId||''} photoUnitId={view.photoUnitId||''} photoRoomId={view.photoRoomId||''} photoFromForm={!!view.photoFromForm} photoReturnStep={view.photoReturnStep||0} />}
          {view.mode === 'form' && akt && prot &&
            <Formular key={prot.id} akt={akt} prot={prot} setProt={setProt} go={go} toast={toast} pool={pool} setPool={setPool} cloud={cloud} initialStep={view.photoReturnStep||0} newProtocol={!!view.newProtocol} />}
        </main>
      </div>
      </>}
      {view.mode === 'assistenz' && <AssistenzDashboard akten={akten} go={go} neu={()=>setSheet(true)} cloud={cloud} syncCloud={syncCloudAkten} onSaved={a=>setAkten(prev=>prev.map(x=>x.id===a.id?a:x))} toast={toast} />}

      {sheet && <NeuerAkt zu={() => setSheet(false)} anlegen={anlegen} />}
      {msg && <div className="toast" role="status">{msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
/* Offlinebetrieb: nur aktiv, wenn sw.js im selben Ordner liegt. Ohne Datei passiert nichts. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
