    put('Feststellung zur Einheit',w.feststellung);
    put('Übergreifende Folgeschadensanierung',w.folgeschadensanierung);
    if(val(w.angabeSinngemaess)){
      const person=val(w.auskunftPersonFreitext)||val(w.bewohner);
      addPart('Sinngemäße Angabe',[person&&('Person: '+person),'Angabe: '+val(w.angabeSinngemaess)]);
    }

    rooms.forEach(r=>{
      lines.push('');
      lines.push('RAUM: '+val(r.bez));
      put('Geschoss des Raums',r.etage);
      put('Sinngemäße Angaben im Raum (Fremdangaben)',r.angabeSinngemaess);
      put('Freie Feststellung des SV',r.schadenfeststellung||r.bemerkung);

      const boden=(r.bodenBetroffen==='Ja'||n(r.betroffenBodenbelag)>0||n(r.betroffenBoden)>0);
      const wand=(r.wandBetroffen==='Ja'||n(r.betroffenWand)>0);
      const decke=!!r.deckeBetroffen;
      const sockel=!!r.sockelBetroffen;

      if(boden) addPart('Boden',[
        'betroffen: Ja',
        val(r.belag)&&('Material: '+val(r.belag)),
        n(r.betroffenBodenbelag)>0&&('Sanierungsfläche: '+de(n(r.betroffenBodenbelag))+' m²'),
        (r.schadenbilderBoden||[]).length&&('Schadenbilder: '+rohListe(r.schadenbilderBoden)),
        val(r.schadenbildFreitextBoden)&&('Ergänzende Feststellung: '+val(r.schadenbildFreitextBoden))
      ]);
      if(wand) addPart('Wand',[
        'betroffen: Ja',
        val(r.wandoberflaeche)&&('Oberfläche: '+val(r.wandoberflaeche)),
        n(r.betroffenWand)>0&&('Sanierungsfläche: '+de(n(r.betroffenWand))+' m²'),
        (r.schadenbilderWand||[]).length&&('Schadenbilder: '+rohListe(r.schadenbilderWand)),
        val(r.schadenbildFreitextWand)&&('Ergänzende Feststellung: '+val(r.schadenbildFreitextWand))
      ]);
      if(decke) addPart('Decke',[
        'betroffen: Ja',
        n(r.betroffenDecke)>0&&('Sanierungsfläche: '+de(n(r.betroffenDecke))+' m²'),
        (r.schadenbilderDecke||[]).length&&('Schadenbilder: '+rohListe(r.schadenbilderDecke)),
        val(r.schadenbildFreitextDecke)&&('Ergänzende Feststellung: '+val(r.schadenbildFreitextDecke))
      ]);
      if(sockel) addPart('Sockelleisten',[
        'betroffen: Ja',
        n(r.sockel)>0&&('Sanierungslänge: '+de(n(r.sockel))+' lfm'),
        (r.schadenbilderSockel||[]).length&&('Schadenbilder: '+rohListe(r.schadenbilderSockel)),
        val(r.schadenbildFreitextSockel)&&('Ergänzende Feststellung: '+val(r.schadenbildFreitextSockel))
      ]);

      if(r.ursachenbehebungAktiv){
        put('Ausführungsstand der Ursachenbehebung',r.ursachenbehebungStatus);
        put('Ursachenbehebung in diesem Raum',r.ursachenbehebungText);
      }
      const ursatz=rohZusatzmassnahmen(r,'Ursachenbehebung');
      const folsatz=rohZusatzmassnahmen(r,'Folgeschaden');
      if(ursatz.length) lines.push('Ausdrücklich der Ursachenbehebung zugeordnete Maßnahmen: '+ursatz.join('; '));
      if(folsatz.length) lines.push('Ausdrücklich dem Folgeschaden zugeordnete Maßnahmen: '+folsatz.join('; '));
    });
  });

  lines.push('');
  lines.push('TECHNISCHE TROCKNUNG');
  lines.push('Erforderlich: '+(p?.trocknung?.erforderlich?'Ja':'Nein'));
  if(p?.trocknung?.erforderlich){
    put('Beginn',p.trocknung.beginn);
    put('Dauer',p.trocknung.dauer);
    put('Stromzähler / Verrechnung',p.trocknung.strom);
    (p.trocknung.geraete||[]).filter(g=>val(g.typ)).forEach((g,i)=>addPart('Trocknungsgerät '+(i+1),[
      val(g.wohnungId)&&('Einheit: '+val(g.wohnungId)),
      'Position: '+val(g.typ),
      val(g.anzahl)&&('Menge / Fläche: '+val(g.anzahl))
    ]));
    (p.trocknung.messungen||[]).filter(m=>val(m.ort)).forEach((m,i)=>addPart('Feuchtemessung '+(i+1),[
      'Ort: '+val(m.ort),
      val(m.material)&&('Material: '+val(m.material)),
      val(m.wert)&&('Messwert: '+val(m.wert)),
      val(m.datum)&&('Datum: '+val(m.datum))
    ]));
  }

  lines.push('');
  lines.push('VERBINDLICHE AUSWERTUNGSLOGIK');
  lines.push('- Ein als betroffen erfasstes Bauteil mit Material/Oberfläche ist in der Folgeschadensanierung wiederherzustellen.');
  lines.push('- Konkrete Schadenbilder dürfen nur verwendet werden, wenn sie oben ausdrücklich erfasst sind.');
  lines.push('- Reinigung, Hygienisierung, Desinfektion, Entsorgung oder sonstige Maßnahmen dürfen nur genannt werden, wenn sie ausdrücklich als Feststellung oder Maßnahme erfasst sind.');
  lines.push('- Keine Räume, Bauteile, Schadenbilder oder Maßnahmen ergänzen.');
  lines.push('- Flächen- und Mengenangaben dienen als technische Faktenbasis; sie müssen im Gutachten-Fließtext nicht wiederholt werden.');

  return lines.join('\n');
}

function svRohentwurfXML(akt,p){
  p=praxisExportProtokoll(p);
  const o=[];
  const jahr=Number(p.baujahr), aktuellesJahr=new Date().getFullYear();
  const alter=(jahr>=1800 && jahr<=aktuellesJahr+1)?(aktuellesJahr-jahr):null;
  const wohnungen=(p.wohnungen&&p.wohnungen.length)?p.wohnungen:[];
  const hatUrsache=r=>!!(rohSatz(r.ursachenbehebungText)) || rohZusatzmassnahmen(r,'Ursachenbehebung').length>0 || rohRaumUrsachenHinweise(r).length>0;
  const relevante=wohnungen.map((w,wi)=>({w,wi,raeume:(w.raeume||[]).filter(r=>rohSatz(r.bez)&&(r.betroffen||hatUrsache(r)||rohZusatzmassnahmen(r,'Folgeschaden').length>0))})).filter(x=>x.raeume.length||rohSatz(x.w.feststellung)||rohSatz(x.w.folgeschadensanierung));
  const titel=(t,sz=21)=>P(t,{b:true,sz,before:110,after:45,keepNext:true});
  const paraTexte=texte=>rohEindeutig(texte).forEach(x=>o.push(P(x)));

  o.push(P('SV-ROHENTWURF', { b:true, sz:34, after:80 }));
  o.push(P(`${akt.schadennummer||akt.aktenzeichen||''} · ${akt.bezeichnung||''}`, { sz:20, color:'6B7A84' }));
  const adresse=[akt.adresse||[akt.strasse,akt.hausnummer].filter(Boolean).join(' '),[akt.plz,akt.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  if(adresse)o.push(P(adresse,{sz:18,color:'6B7A84',after:120}));

  const kurz=rohSatz(p.ursacheUnterkategorie)||rohSatz(p.ursache);
  if(kurz){o.push(H2('Kurzfassung der Schadenursache'));o.push(P(kurz));}

  const objekt=[];
  if(rohObjektBeschreibung(p.objektart)) objekt.push(rohObjektBeschreibung(p.objektart));
  if(jahr>=1800 && jahr<=aktuellesJahr+1) objekt.push(p.baujahrGeschaetzt?`Das Baujahr des Gebäudes wird auf ca. ${jahr} geschätzt; daraus ergibt sich ein geschätztes Alter von ca. ${alter} Jahren.`:`Das Gebäude wurde im Jahr ${jahr} errichtet und weist ein Alter von ca. ${alter} Jahren auf.`);
  else if(rohSatz(p.baujahr)) objekt.push(`Das Alter beziehungsweise Baujahr des Gebäudes wurde mit ${rohSatz(p.baujahr)}${p.baujahrGeschaetzt?' (geschätzt)':''} angegeben.`);
  if(rohSatz(p.allgemeinzustand)){
    const z=rohSatz(p.allgemeinzustand).toLowerCase();
    if(z==='gut')objekt.push('Das Gebäude befindet sich in einem guten Erhaltungszustand.');
    else if(z==='sehr gut')objekt.push('Das Gebäude befindet sich in einem sehr guten Erhaltungszustand.');
    else if(z==='mäßig'||z==='maessig')objekt.push('Das Gebäude befindet sich in einem mäßigen Erhaltungszustand.');
    else if(z==='neubau')objekt.push('Bei der Liegenschaft handelt es sich um einen Neubau.');
    else objekt.push(`Der allgemeine Erhaltungszustand wurde mit ${rohSatz(p.allgemeinzustand)} angegeben.`);
  }
  if(objekt.length){o.push(H2('Objektbeschreibung'));paraTexte(objekt);}

  let zusammen=[];
  if(rohSatz(p.zusammenfassung)) zusammen=[p.zusammenfassung];
  else{
    zusammen=[rohSatz(p.ursache)||kurz];
    if(p.trocknung?.erforderlich)zusammen.push('Eine technische Trocknung der betroffenen Gebäudesubstanz ist aus technischer Sicht nachvollziehbar und plausibel.');
    if(p.regress==='Nein')zusammen.push('Eine Regressmöglichkeit ist aus Sicht des SV nicht gegeben.');
    else if(p.regress==='Ja')zusammen.push('Eine mögliche Regressierung ist im Zuge der weiteren Bearbeitung zu berücksichtigen.');
  }
  zusammen=rohEindeutig(zusammen);
  if(zusammen.length){o.push(H2('Kurzzusammenfassung'));zusammen.forEach(x=>o.push(P(x)));}

  const ursache=[];
  (p.auskuenfte||[]).filter(x=>rohSatz(x.angabe)).forEach(x=>{
    const ap=(p.anwesende||[]).find(a=>a.id===x.personId);
    const person=ap?[ap.name,ap.funktion].filter(Boolean).join(' · '):rohSatz(x.personFreitext);
    ursache.push(`${person?'Nach Angaben von '+person+': ':''}${rohSatz(x.angabe)}`);
  });
  relevante.forEach(({w})=>{
    if(rohSatz(w.angabeSinngemaess)){
      const person=rohSatz(w.auskunftPersonFreitext)||rohSatz(w.bewohner);
      ursache.push(`${person?'Nach Angaben von '+person+': ':''}${rohSatz(w.angabeSinngemaess)}`);
    }
  });
  if(rohSatz(p.hergang)&&!ursache.some(x=>x.includes(rohSatz(p.hergang))))ursache.push(rohSatz(p.hergang));
  if(rohSatz(p.ursache))ursache.push(rohSatz(p.ursache));
  if(p.ursachePlausibel==='Ja')ursache.push('Das festgestellte Schadenbild ist mit der beschriebenen Schadenursache technisch nachvollziehbar und plausibel.');
  if(p.ursachePlausibel==='Nein')ursache.push('Das festgestellte Schadenbild ist mit der angegebenen Schadenursache aus Sicht des SV nicht nachvollziehbar.');
  if(p.regress==='Nein')ursache.push('Eine Regressmöglichkeit ist aus Sicht des SV nicht gegeben.');
  else if(p.regress==='Ja')ursache.push('Eine mögliche Regressierung ist im Zuge der weiteren Bearbeitung zu berücksichtigen.');
  if(rohEindeutig(ursache).length){o.push(H2('Ursacheneruierung'));paraTexte(ursache);}

  const hatSchaden=!!rohSatz(p.schadensbild)||!!rohSatz(p.ursachenbehebung)||relevante.length>0||!!p.trocknung?.erforderlich;
  if(hatSchaden){
    o.push(H2('Schadenbeschreibung'));
    if(rohSatz(p.schadensbild))o.push(P(rohSatz(p.schadensbild)));
    // Allgemeine Ursachenbehebung ohne TOP-Angabe nur bei genau einer
    // relevanten Einheit dort zuordnen; bei mehreren nicht raten.
    if(rohSatz(p.ursachenbehebung)&&relevante.length!==1){
      o.push(titel('Übergreifende Ursachenbehebung:'));
      o.push(P(rohSatz(p.ursachenbehebung)));
    }
    relevante.forEach(({w,wi,raeume})=>{
      o.push(titel(rohWohnungTitel(w,wi),22));
      const allgemein=rohSatz(w.feststellung);
      const allgemeinUrsache=/\bundichtheit\b|\bleckstelle\b|\brohr(?:bruch|gebrechen|tausch)\b|\bzur\s+behebung\b/i.test(allgemein);
      const allgemeinDeckeDoppelt=allgemein&&!allgemeinUrsache&&/verf[aä]rb/i.test(allgemein)&&/deck/i.test(allgemein)
        &&raeume.some(r=>(r.schadenbilderDecke||[]).some(x=>/verf[aä]rb/i.test(rohSatz(x))));

      const ursRaum=raeume.map(r=>({r,text:rohSatz(r.ursachenbehebungText),hinweise:rohRaumUrsachenHinweise(r),zusatz:rohZusatzmassnahmen(r,'Ursachenbehebung')})).filter(x=>x.text||x.hinweise.length||x.zusatz.length);
      if(ursRaum.length||allgemeinUrsache||(rohSatz(p.ursachenbehebung)&&relevante.length===1)){
        o.push(titel('Ursachenbehebung:'));
        if(allgemeinUrsache)o.push(P(allgemein));
        if(rohSatz(p.ursachenbehebung)&&relevante.length===1)o.push(P(rohSatz(p.ursachenbehebung)));
        ursRaum.forEach(({r,text,hinweise,zusatz})=>{
          o.push(titel(raumTitelMitGeschoss(r)+':',20));
          if(rohSatz(r.ursachenbehebungStatus))o.push(P('Ausführungsstand: '+rohSatz(r.ursachenbehebungStatus)+'.'));
          paraTexte([text,...hinweise,...zusatz]);
        });
      }

      const folRaeume=raeume.map(r=>{
        const auto=r.folgeschadenAktiv!==false && r.betroffen;
        const zusatz=rohZusatzmassnahmen(r,'Folgeschaden');
        const beschreibung=auto ? (rohSatz(r.schadenfeststellung)||rohSatz(r.bemerkung)) : '';
        const schadenbild=auto ? rohRaumSchadenbildSaetze(r) : [];
        const boden=auto&&(r.bodenBetroffen==='Ja'||n(r.betroffenBodenbelag)>0||n(r.betroffenBoden)>0);
        const wand=auto&&(r.wandBetroffen==='Ja'||n(r.betroffenWand)>0);
        const decke=auto&&!!r.deckeBetroffen;
        const sockel=auto&&!!r.sockelBetroffen;
        return {r,auto,zusatz,beschreibung,schadenbild,boden,wand,decke,sockel,
          hatInhalt:!!(rohSatz(r.angabeSinngemaess)||beschreibung||schadenbild.length||zusatz.length||boden||wand||decke||sockel)};
      }).filter(x=>x.hatInhalt);
      if(folRaeume.length||rohSatz(w.folgeschadensanierung)||(allgemein&&!allgemeinUrsache)){
        o.push(titel('Folgeschaden:'));
        if(allgemein&&!allgemeinUrsache&&!allgemeinDeckeDoppelt)o.push(P(allgemein));
        if(rohSatz(w.folgeschadensanierung))o.push(P(rohSatz(w.folgeschadensanierung)));
        folRaeume.forEach(({r,auto,zusatz,beschreibung,schadenbild,boden,wand,decke,sockel})=>{
          o.push(titel(raumTitelMitGeschoss(r)+':',20));
          if(rohSatz(r.angabeSinngemaess))o.push(P('Sinngemäße Angaben im Raum (Fremdangaben): '+rohSatz(r.angabeSinngemaess)));
          if(beschreibung)o.push(P(beschreibung));
          if(schadenbild.length){
            paraTexte(schadenbild);
            const wh=rohKonkreteWiederherstellung(r);
            if(wh)o.push(P(wh));
          }else{
            if(boden){if(!beschreibung)o.push(P(rohBodenFeststellung(r.belag)));o.push(P(`Eine Wiederherstellung des betroffenen ${rohBodenBezeichnung(r.belag)} ist aus technischer Sicht nachvollziehbar und plausibel.`));}
            if(wand){if(!beschreibung)o.push(P(rohWandFeststellung(r.wandoberflaeche)));o.push(P(rohWandWiederherstellung(r.wandoberflaeche)));}
            if(decke){if(!beschreibung)o.push(P('Die vorhandene Deckenoberfläche war vom gegenständlichen Schadenereignis betroffen.'));o.push(P('Eine Wiederherstellung der betroffenen Deckenoberfläche ist aus technischer Sicht nachvollziehbar und plausibel.'));}
            if(sockel){if(!beschreibung)o.push(P('Die vorhandenen Sockelleisten waren vom gegenständlichen Schadenereignis betroffen.'));o.push(P('Eine Wiederherstellung der betroffenen Sockelleisten ist aus technischer Sicht nachvollziehbar und plausibel.'));}
          }
          // Die reguläre Wiederherstellung des als betroffen erfassten Bodenbelags
          // enthält z. B. "Fliesen wiederherstellen" bereits. Nicht doppelt nennen.
          const bereitsInStandardsatz=x=>{
            const key=rohMassnahmeSchluessel(x);
            return auto&&boden&&(
              (key==='bodenfliesen:wiederherstellen'&&/fliesen/i.test(rohSatz(r.belag)))||
              key==='bodenbelag:wiederherstellen'
            );
          };
          paraTexte(zusatz.filter(x=>!bereitsInStandardsatz(x)));
        });
      }

  // Angebote/Rechnungen nicht durch leere Überschriften oder erfundene

  o.push(H2('Reparaturbeschreibung'));

async function docxBlobToPlainText(blob){
  const zip=await JSZip.loadAsync(blob);
  const f=zip.file('word/document.xml');
  if(!f) throw new Error('Word-Datei enthält kein lesbares Dokument');
  const xml=await f.async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const paras=Array.from(doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','p'));
  const lines=paras.map(p=>{
    let text='';
    const walk=node=>{
      if(node.nodeType===3){ text+=node.nodeValue||''; return; }
      if(node.nodeType!==1) return;
      const ln=node.localName;
      if(ln==='t') text+=node.textContent||'';
      else if(ln==='tab') text+='\t';
      else if(ln==='br'||ln==='cr') text+='\n';
      else Array.from(node.childNodes||[]).forEach(walk);
    };
    Array.from(p.childNodes||[]).forEach(walk);
    return text.replace(/[ \t]+$/g,'').trimEnd();
  });
  // Leere Absätze erhalten die vom SV gesetzte Gliederung und Absatzstruktur.
  return lines.join('\n').replace(/\n{4,}/g,'\n\n\n').trim();
}


// Finaler Gutachtenexport: echte Word-Absätze statt manueller Zeilenumbrüche.
// Dadurch bleiben Absätze beim Kopieren in SVNEXA / Versicherungssoftware erhalten.
function gutachtenTextAbsatzXML(text){
  const raw=String(text==null?'':text).replace(/\r\n?/g,'\n');
  const lines=raw.split('\n');
  const out=[];
  let leer=false;
  lines.forEach(line=>{
    const t=line.trim();
    if(!t){
      if(!leer && out.length){ out.push(P('',{after:0})); leer=true; }
      return;
    }
    leer=false;
    const istZwischenueberschrift=/^(Ursachenbehebung|Folgeschadensanierung|Techn\.? Trocknung|Vorliegende (Rechnungen und Angebote|Angebote und Rechnungen)|.+:)$/.test(t);
    if(istZwischenueberschrift){
      out.push(P(t,{b:true,sz:20,before:70,after:35}));
    }else{
      out.push(P(t,{after:80}));
    }
  });
  if(!out.length) out.push(P(''));
  return out.join('');
}

const gutachtenLeer=()=>({kurzfassung:'',objektbeschreibung:'',kurzzusammenfassung:'',ursacheneruierung:'',schadenbeschreibung:'',reparaturbeschreibung:''});
const textAusBesichtigung=(akt)=>{
  const original=(akt.protokolle||[]).slice().sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''))[0];
  const p=original?praxisExportProtokoll(original):null;
  const g=gutachtenLeer();
  if(!p) return g;

  const satz = t => (t||'').trim().replace(/\s+/g,' ');
  const m2 = v => `${de(v)} m²`;
  const lfm = v => `${de(v)} lfm`;

  /* 1 Kurzfassung – ausschließlich aus vorgegebener Ursache */
  const urs=satz(p.ursache);
  if(urs){
    g.kurzfassung = urs.length>420 ? urs.slice(0,417).trim()+'…' : urs;
  }

  /* 2 Objektbeschreibung */
  const obj=[];
  const lage=[akt.strasse||akt.adresse,akt.hausnummer].filter(Boolean).join(' ').trim();
  const ort=[akt.plz,akt.ort].filter(Boolean).join(' ').trim();
  if(p.objektart){
    obj.push(`Bei der gegenständlichen Liegenschaft handelt es sich um ${p.objektart}.`);
  } else {
    obj.push('Gegenstand der Besichtigung war die gegenständliche Liegenschaft.');
  }
  if(lage||ort){
    obj.push(`Die besichtigte Liegenschaft befindet sich${lage?' in '+lage:''}${ort?', '+ort:''}.`);
  }
  if(p.baujahr) obj.push(p.baujahrGeschaetzt?`Das Baujahr wird auf ca. ${p.baujahr} geschätzt.`:`Das Baujahr wurde mit ${p.baujahr} angegeben.`);
  if(p.nutzung) obj.push(`Die Nutzung des Objektes erfolgt als ${p.nutzung}.`);
  if(p.geschoss) obj.push(`Der besichtigte Bereich befindet sich im ${p.geschoss}.`);
  if(p.allgemeinzustand) obj.push(`Der allgemeine Erhaltungs- und Instandhaltungszustand ist als ${p.allgemeinzustand} einzustufen.`);
  g.objektbeschreibung=obj.join(' ');

  /* 3 Ursacheneruierung */
  g.ursacheneruierung=urs;

  /* 4 Schadenbeschreibung / 5 Reparaturbeschreibung */
  const sbUrsache=[]; 
  const sbFolge=[];
  const rpUrsache=[];
  const rpFolge=[];

  const wohnungenText=(p.wohnungen&&p.wohnungen.length)
    ? p.wohnungen
    : [{bewohner:'',etage:p.geschoss||'',schadenZuordnung:'Folgeschaden',raeume:p.raeume||[]}];

  wohnungenText.forEach((w,wi)=>{
    const zuordnung=w.schadenZuordnung||'Folgeschaden';
    const bereich = zuordnung==='Ursachenbereich' ? sbUrsache : sbFolge;
    const reparaturBereich = zuordnung==='Ursachenbereich' ? rpUrsache : rpFolge;
    const whTitel=[w.top||('Einheit '+(wi+1)), w.bewohner||'', w.etage||''].filter(Boolean).join(' – ');
    const raumTexte=[];

    (w.raeume||[]).filter(r=>r.bez&&r.betroffen).forEach(r=>{
      const v=raumWerte(r);
      const f=[];

      if(satz(r.angabeSinngemaess))f.push('Sinngemäße Angaben im Raum (Fremdangaben): '+satz(r.angabeSinngemaess));
      if(satz(r.schadenfeststellung)) f.push(satz(r.schadenfeststellung));

      if(!satz(r.schadenfeststellung) && n(r.betroffenBodenbelag)>0){
        f.push(`Der betroffene Bodenbelag${r.belag?' aus '+r.belag:''} weist eine betroffene Fläche von ca. ${m2(r.betroffenBodenbelag)} auf.`);
      } else if(!satz(r.schadenfeststellung) && n(r.betroffenBoden)>0){
        f.push(`Die betroffene Bodenfläche beträgt ca. ${m2(r.betroffenBoden)}.`);
      }

      if(!satz(r.schadenfeststellung) && n(r.betroffenWand)>0){
        f.push(`An den Wandflächen${r.wandoberflaeche?' mit '+r.wandoberflaeche:''} sind ca. ${m2(r.betroffenWand)} betroffen.`);
      }

      if(!satz(r.schadenfeststellung) && r.deckeBetroffen){
        const df=n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche;
        f.push(`An der Deckenfläche sind ca. ${m2(df)} betroffen.`);
      }

      if(!satz(r.schadenfeststellung) && r.sockelBetroffen){
        const sf=n(r.sockel)>0?n(r.sockel):v.umfang;
        f.push(`Weiters sind ca. ${lfm(sf)} Sockelleisten betroffen.`);
      }

      if(r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'){
        const ts=r.tuerschaden==='Sonstige sichtbare Schäden'&&r.tuerschadenFreitext
          ? r.tuerschadenFreitext
          : r.tuerschaden;
        f.push(`An der Tür wurden sichtbare Schäden in Form von ${ts} festgestellt.`);
      }

      if(r.individuelleBeschreibungAktiv&&satz(r.individuelleBeschreibung)){
        f.push(satz(r.individuelleBeschreibung));
      }
      if(satz(r.bemerkung) && satz(r.bemerkung)!==satz(r.schadenfeststellung)) f.push(satz(r.bemerkung));

      raumTexte.push(`${raumTitelMitGeschoss(r)}: ${f.join(' ')}`);

      const mass=[];
      if(satz(r.wiederherstellungFreitext)) mass.push(satz(r.wiederherstellungFreitext));
      (r.sanierungspositionen||[]).forEach(x=>{if(x&&x.kurz)mass.push(x.kurz);});
      if(!satz(r.wiederherstellungFreitext) && n(r.betroffenBodenbelag)>0){
        mass.push(`Rückbau und Wiederherstellung von ca. ${m2(r.betroffenBodenbelag)} Bodenbelag${r.belag?' ('+r.belag+')':''}`);
      } else if(!satz(r.wiederherstellungFreitext) && n(r.betroffenBoden)>0){
        mass.push(`Wiederherstellung von ca. ${m2(r.betroffenBoden)} Bodenfläche`);
      }
      if(!satz(r.wiederherstellungFreitext) && n(r.betroffenWand)>0){
        mass.push(`Wiederherstellung von ca. ${m2(r.betroffenWand)} Wandfläche${r.wandoberflaeche?' ('+r.wandoberflaeche+')':''}`);
      }
      if(!satz(r.wiederherstellungFreitext) && r.deckeBetroffen){
        const df=n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche;
        mass.push(`Wiederherstellung von ca. ${m2(df)} Deckenfläche`);
      }
      if(!satz(r.wiederherstellungFreitext) && r.sockelBetroffen){
        const sf=n(r.sockel)>0?n(r.sockel):v.umfang;
        mass.push(`Erneuerung von ca. ${lfm(sf)} Sockelleisten`);
      }

      if(r.trockenbauRueckbau&&r.trockenbauRueckbau!=='Nicht erforderlich'){
        mass.push(r.trockenbauRueckbau);
      }

      if(r.verbundabdichtung==='Ja – vorhanden / wiederherzustellen'){
        mass.push('Wiederherstellung der Verbundabdichtung im betroffenen Fliesenbereich');
      } else if(r.verbundabdichtung==='Vorhandensein nicht feststellbar'){
        mass.push('Vor Ausführung der Fliesenarbeiten ist das Vorhandensein einer Verbundabdichtung zu prüfen');
      }

      if(r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'){
        mass.push('Die betroffene Tür bzw. deren Bauteile sind hinsichtlich Reparaturfähigkeit zu prüfen und erforderlichenfalls instand zu setzen bzw. zu erneuern');
      }

      if(r.elektropruefung==='Empfohlen'){
        mass.push('Eine Elektroüberprüfung des betroffenen Bereiches wird empfohlen');
      }

      if(r.zusatzmassnahme&&r.zusatzmassnahme!=='Keine') mass.push(r.zusatzmassnahme);
      if(satz(r.massnahmen)) mass.push(satz(r.massnahmen));

      if(mass.length){
        reparaturBereich.push(`${whTitel}, ${raumTitelMitGeschoss(r)}: ${mass.join('; ')}.`);
      }
    });

    if(raumTexte.length){
      const uebergreifend=satz(w.folgeschadensanierung);
      bereich.push(`${whTitel}${uebergreifend?'\n'+uebergreifend:''}\n${raumTexte.join('\n\n')}`);
    }
  });

  const sb=[];
  if(sbUrsache.length) sb.push(`Ursachenbereich / Ursachenbehebung\n${sbUrsache.join('\n\n')}`);
  if(sbFolge.length) sb.push(`Folgeschäden\n${sbFolge.join('\n\n')}`);

  if(sb.length){
    g.schadenbeschreibung=sb.join('\n\n');
  } else {
    g.schadenbeschreibung=satz(p.schadensbild);
  }

  const rp=[];
  if(rpUrsache.length) rp.push(`Ursachenbehebung\n${rpUrsache.join('\n\n')}`);
  if(rpFolge.length) rp.push(`Wiederherstellung der Folgeschäden\n${rpFolge.join('\n\n')}`);

  if(p.trocknung?.erforderlich){
    rp.push('Die Durchführung einer technischen Trocknung ist aus technischer Sicht nachvollziehbar und plausibel.');
  }
  if(satz(p.empfehlung)) rp.push(satz(p.empfehlung));

  g.reparaturbeschreibung=rp.join('\n\n');
  return g;
};

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);

  a.href = url; a.download = name;

  setTimeout(() => URL.revokeObjectURL(url), 4000);

async function lookupPlzForOrt(ort){
  const q=String(ort||'').trim(); if(!q) return '';
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=at&limit=10&addressdetails=1&accept-language=de&q='+encodeURIComponent(q+', Österreich');
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!r.ok) return '';
    const d=await r.json();
    for(const hit of (d||[])){
      const raw=String(hit?.address?.postcode||'').trim();
      const m=raw.match(/\b\d{4}\b/);
      if(m) return m[0];
    }
    for(const hit of (d||[])){
      const m=String(hit?.display_name||'').match(/\b\d{4}\b/);
      if(m) return m[0];
    }
    return '';
  }catch(e){return '';}
}

const assistenzAdresse = a => {

  return [street,[a.plz,a.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') || 'Adresse fehlt';

const assistenzStatusStyle = a => {

  if((a.dispoStatus||'neu')==='terminvereinbart') return 'ad-confirmed';
  return 'ad-pending';
};
const adZeitPlusMinuten=(zeit,minuten)=>{
  if(!/^\d{2}:\d{2}$/.test(zeit||''))return '';
  const [h,m]=zeit.split(':').map(Number);
  if(h>23||m>59)return '';
  const v=(h*60+m+minuten)%(24*60);
  return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
};
const adDateWeekday=(datum)=>{
  if(!/^\d{4}-\d{2}-\d{2}$/.test(datum||''))return -1;
  return new Date(datum+'T12:00:00').getDay();
};
const adDateLocal = () => {const n=new Date();return [n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-');};
const adDayNumber = iso => /^\d{4}-\d{2}-\d{2}$/.test(String(iso||'')) ? Math.floor(Date.UTC(Number(iso.slice(0,4)),Number(iso.slice(5,7))-1,Number(iso.slice(8,10)))/86400000) : NaN;
const adAddDays = (iso,days) => {const n=adDayNumber(iso);return Number.isFinite(n)?new Date((n+days)*86400000).toISOString().slice(0,10):'';};

/* ============================================================
   TOUR: rein lokale Zeitplanung; echte Strecken über HeiGIT/ORS.
   Intern i.d.R. 30 Minuten vor Ort; Kundenfenster bleibt 120 Min.
   Bestätigte Startzeiten werden durch diese Funktionen niemals geändert.
   ============================================================ */
const TP_OFFICE='Uferstraße 4, 6020 Innsbruck, Österreich';
const TP_KEY_STORE='studiof_route_api_key_session_v1';
const tpMin=t=>/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(String(t||''))?Number(t.slice(0,2))*60+Number(t.slice(3,5)):NaN;
const tpClock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const tpRound5=m=>Math.ceil(m/5)*5;
const tpNextWeekday=w=>{let d=adDateLocal();for(let i=0;i<8;i++,d=adAddDays(d,1))if(adDateWeekday(d)===w)return d;return d;};
const tpBooked=a=>a?.besichtigungDatum&&Number.isFinite(tpMin(a?.besichtigungZeit))&&statusKey(a)!=='abgelegt';
const tpMayInsert=a=>statusKey(a)==='offen'&&!a.besichtigungDatum&&!['queued','sent'].includes(a.terminAuftrag?.status)&&!['preparing','queued'].includes(a.terminAenderung?.status);
const tpLeg=(durations,i,j,buffer)=>{
  if(i===j)return 0;
  const seconds=durations?.[i]?.[j];
  return Number.isFinite(seconds)&&seconds>=0?Math.ceil(seconds/60)+buffer:Infinity;
};
function tpBuildPlan({fixed,candidate,durations,buffer,visitDuration=30,earliest=450,first=540,last=1080}) {
  const scheduled=fixed.map(a=>({...a,type:'fixed',start:tpMin(a.besichtigungZeit),end:tpMin(a.besichtigungZeit)+visitDuration})).sort((a,b)=>a.start-b.start);
  const conflicts=[];
  let previous=null;
  for(const a of scheduled){
    const minStart=previous?previous.end+tpLeg(durations,previous.matrixIndex,a.matrixIndex,buffer):earliest+tpLeg(durations,0,a.matrixIndex,buffer);
    if(!Number.isFinite(minStart))conflicts.push('Die Fahrt zwischen '+(previous?.schadennummer||'Büro')+' und '+(a.schadennummer||'Termin')+' kann nicht berechnet werden.');
    else if(a.start<minStart)conflicts.push('Zwischen '+(previous?.schadennummer||'Büro')+' und '+(a.schadennummer||'Termin')+' fehlen '+(minStart-a.start)+' Minuten für internen Aufenthalt/Fahrt.');
    if(a.end>1440)conflicts.push('Ein bestehender Termin reicht über Mitternacht hinaus.');
    previous=a;
  }
  if(!candidate)return {scheduled,conflicts,option:null};
  if(conflicts.length)return {scheduled,conflicts,option:null};
  let best=null;
  for(let pos=0;pos<=scheduled.length;pos++){
    const before=scheduled[pos-1]||null,after=scheduled[pos]||null;
    const a=before?before.matrixIndex:0,b=candidate.matrixIndex,c=after?after.matrixIndex:0;
    const toNew=tpLeg(durations,a,b,buffer),afterNew=tpLeg(durations,b,c,buffer);
    const direct=tpLeg(durations,a,c,buffer);
    if(!Number.isFinite(toNew)||!Number.isFinite(afterNew)||!Number.isFinite(direct))continue;
    const earliestStart=Math.max(first,before?before.end+toNew:earliest+toNew);
    const latestStart=Math.min(last-visitDuration,after?after.start-afterNew-visitDuration:last-visitDuration);
    const start=tpRound5(earliestStart);
    if(start>latestStart)continue;
    const extra=toNew+afterNew-direct;
    const choice={position:pos,start,end:start+visitDuration,extra,prevTravel:toNew,nextTravel:afterNew,
      scheduled:[...scheduled.slice(0,pos),{...candidate,type:'proposal',start,end:start+visitDuration},...scheduled.slice(pos)]};
    if(!best||choice.extra<best.extra||(choice.extra===best.extra&&choice.start<best.start))best=choice;
  }
  return {scheduled:best?.scheduled||scheduled,conflicts,option:best};
}
async function tpFetchJson(url,opts={}){
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),22000);
  try{
    const r=await fetch(url,{...opts,signal:controller.signal});
    const raw=await r.text();let v;try{v=JSON.parse(raw)}catch(e){v={error:raw.slice(0,240)}}
    if(!r.ok)throw new Error('Routendienst HTTP '+r.status+': '+(v?.error?.message||v?.error||v?.message||'Bitte API-Schlüssel und Kontingent prüfen.'));
    return v;
  }finally{clearTimeout(timeout)}
}
async function tpGeo(address,key,cache){
  if(cache.has(address))return cache.get(address);
  const url='https://api.heigit.org/pelias/v1/search?'+new URLSearchParams({text:address,size:'1','focus.point.lat':'47.2692','focus.point.lon':'11.4041'});
  const data=await tpFetchJson(url,{headers:{Authorization:key}});
  const feature=data?.features?.[0],coordinates=feature?.geometry?.coordinates;
  if(!Array.isArray(coordinates)||coordinates.length<2||!coordinates.every(Number.isFinite))throw new Error('Adresse nicht eindeutig gefunden: '+address+'. Bitte im Auftrag ergänzen.');
  const result={coordinates,label:feature.properties?.label||address,accuracy:feature.properties?.accuracy||feature.properties?.layer||''};
  cache.set(address,result);return result;
}
async function tpMatrix(points,key){
  const data=await tpFetchJson('https://api.heigit.org/openrouteservice/v2/matrix/driving-car',{
    method:'POST',headers:{Authorization:key,'Content-Type':'application/json'},
    body:JSON.stringify({locations:points,metrics:['duration','distance']})
  });
  if(!Array.isArray(data?.durations)||data.durations.length!==points.length)throw new Error('Der Routendienst hat keine vollständige Fahrtzeitenmatrix geliefert.');
  return data;
}


/* Tourensperre: pro Auftrag und Datum, auf Wunsch bis einschließlich Enddatum.
   Eine Kundensperre ist KEINE Stornierung eines bereits gebuchten Termins. */
const tpUnavailableEntry=(a,date)=>{
  const entries=Object.entries(a?.tourAusnahmen||{}).filter(([from,v])=>v?.status==='unavailable'&&/^\d{4}-\d{2}-\d{2}$/.test(from)&&from<=date&&date<=(v.until||from));
  if(!entries.length)return null;
  entries.sort((a,b)=>b[0].localeCompare(a[0]));
  return {...entries[0][1],from:entries[0][0]};
};
const tpAvailableForDay=(a,date,overrides={})=>Object.prototype.hasOwnProperty.call(overrides,a.id)?overrides[a.id]===null:!tpUnavailableEntry(a,date);

/* Eine bestehende Tour überlebt das Übernehmen/Bestätigen eines Vorschlags.
   Nur identische, bereits eingeplante Uhrzeiten dürfen von 'Vorschlag' zu 'fix'
   wechseln. Neue/verschobene Fixtermine oder geänderte Adressen invalidieren
   dagegen die Route – veraltete Fahrtzeiten dürfen nie als aktuell erscheinen. */
function tpSnapshotStatus(result,akten){
  if(!result?.plan?.scheduled||!Array.isArray(result.poolIds))return null;
  const byId=new Map(akten.map(a=>[a.id,a]));
  const includedIds=new Set(result.plan.scheduled.map(a=>a.id));
  const acceptedIds=new Set();
  for(const item of result.plan.scheduled){
    const actual=byId.get(item.id);
    if(!actual||assistenzAdresse(actual)!==assistenzAdresse(item))return null;
    const sameBooking=tpBooked(actual)&&actual.besichtigungDatum===result.date&&actual.besichtigungZeit===tpClock(item.start);
    if(item.type==='fixed'){
      if(!sameBooking)return null;
    }else if(item.type==='proposal'){
      if(sameBooking)acceptedIds.add(item.id);
      else if(!tpMayInsert(actual)||!tpAvailableForDay(actual,result.date))return null;
    }
  }
  // Ein inzwischen zusätzlich gebuchter Termin ist nicht Bestandteil der
  // berechneten Matrix und macht eine echte Neuplanung notwendig.
  if(akten.some(a=>tpBooked(a)&&a.besichtigungDatum===result.date&&!includedIds.has(a.id)))return null;
  const expected=result.poolIds.filter(id=>!acceptedIds.has(id)).sort();
  const actualPool=akten.filter(a=>tpMayInsert(a)&&tpAvailableForDay(a,result.date)).map(a=>a.id).sort();
  if(expected.length!==actualPool.length||expected.some((id,i)=>id!==actualPool[i]))return null;
  return {acceptedIds};
}


/* Gesamttour: fahrzeitbewusste, begrenzte Beam-Search. Ziel: zuerst möglichst
   viele offene Aufträge in den Tag aufnehmen, danach die Fahrtzeit minimieren.
   Fixtermine bleiben in Reihenfolge UND Startzeit unverändert. */
function tpEvaluateRoute({route,durations,buffer,visitDuration,earliest,first,last}){
  let clock=earliest,previous=0,driving=0;
  const scheduled=[],legs=[];
  for(const item of route){
    const travel=tpLeg(durations,previous,item.matrixIndex,buffer);
    if(!Number.isFinite(travel))return null;
    const arrival=clock+travel;
    const fixed=item.type==='fixed';
    const start=fixed?tpMin(item.besichtigungZeit):tpRound5(Math.max(first,arrival));
    const end=start+visitDuration;
    if(!Number.isFinite(start)||start<arrival||end>last||(!fixed&&start+120>1440))return null;
    scheduled.push({...item,start,end});
    legs.push({item:{...item,start,end},travel});
    driving+=travel;clock=end;previous=item.matrixIndex;
  }
  const returnDrive=route.length?tpLeg(durations,previous,0,buffer):0;
  if(!Number.isFinite(returnDrive)||clock+returnDrive>last && route.length)return null;
  driving+=returnDrive;
  return {scheduled,legs,driveTotal:driving,returnDrive,backTime:route.length?clock+returnDrive:null};
}
function tpBuildAutoPlan({fixed,candidates,durations,buffer,visitDuration=30,earliest=450,first=540,last=1080}){
  const baseline=fixed.map(a=>({...a,type:'fixed'})).sort((a,b)=>tpMin(a.besichtigungZeit)-tpMin(b.besichtigungZeit));
  const calculate=route=>tpEvaluateRoute({route,durations,buffer,visitDuration,earliest,first,last});
  const initial=calculate(baseline);
  if(!initial){
    return {scheduled:[],proposals:[],unplanned:candidates,driveTotal:0,returnDrive:0,backTime:null,
      conflicts:['Die fest eingetragenen Termine lassen sich mit der eingestellten Besichtigungsdauer, Fahrtzeit oder spätesten Rückkehr nicht konfliktfrei verbinden. Bitte die Fixtermine prüfen; sie werden nicht automatisch verändert.']};
  }
  let beam=[{route:baseline,calc:initial,ids:new Set()}], champion=beam[0];
  const maxAdditional=Math.min(11-baseline.length,candidates.length);
  const score=s=>s.calc.driveTotal+Math.max(0,(s.calc.backTime||earliest)-earliest)*0.002+(s.calc.legs[0]?.travel||0)*0.001;
  for(let count=0;count<maxAdditional;count++){
    const expanded=new Map();
    for(const state of beam){
      for(const candidate of candidates){
        if(state.ids.has(candidate.id))continue;
        for(let i=0;i<=state.route.length;i++){
          const route=[...state.route.slice(0,i),{...candidate,type:'proposal'},...state.route.slice(i)];
          const calc=calculate(route);
          if(!calc)continue;
          const signature=route.map(a=>a.id).join('|');
          if(expanded.has(signature))continue;
          expanded.set(signature,{route,calc,ids:new Set([...state.ids,candidate.id])});
        }
      }
    }
    if(!expanded.size)break;
    beam=Array.from(expanded.values()).sort((a,b)=>score(a)-score(b)).slice(0,120);
    champion=beam[0];
  }
  const scheduled=champion.calc.scheduled;
  return {...champion.calc,scheduled,proposals:scheduled.filter(a=>a.type==='proposal'),
    unplanned:candidates.filter(a=>!champion.ids.has(a.id)),conflicts:[],optimized:true};
}

const adFristInfo = a => {
  const insurance=String(a.versicherung||'').toUpperCase();
  const exp=insurance==='EXP'||insurance.includes('EXPERTA');
  const rsg=insurance.includes('RSG');
  const standard=exp?3:rsg?15:null;
  const days=(a.fristTage!==''&&a.fristTage!=null&&Number.isFinite(Number(a.fristTage)))?Number(a.fristTage):standard;
  const basis=exp ? a.besichtigungDatum : (rsg?a.auftragDatum:(a.fristBasis==='auftrag'?a.auftragDatum:a.besichtigungDatum));
  const basisText=exp?'ab Besichtigung':rsg?'ab Auftragseingang':a.fristBasis==='auftrag'?'ab Auftragseingang':'ab Besichtigung';
  if(a.berichtVersendetAm)return {kind:'done',text:'Bericht übermittelt: '+a.berichtVersendetAm,due:days!=null?adAddDays(basis,days):'',basisText};
  if(days===null||!Number.isInteger(days)||days<1||days>365)return {kind:'neutral',text:'Berichtsfrist nicht festgelegt',due:'',basisText};
  if(!basis||!Number.isFinite(adDayNumber(basis)))return {kind:'neutral',text:(exp?'Besichtigungsdatum':rsg?'Auftragseingang':'Fristbeginn')+' fehlt',due:'',basisText};
  const due=adAddDays(basis,days), elapsed=adDayNumber(adDateLocal())-adDayNumber(basis),left=adDayNumber(due)-adDayNumber(adDateLocal());
  let kind='neutral';
  if(exp)kind=elapsed<2?'green':'red';
  else if(rsg)kind=elapsed<7?'neutral':elapsed<10?'green':elapsed<13?'orange':'red';
  else kind=left>3?'green':left>1?'orange':'red';
  const text=left<0?('Seit '+Math.abs(left)+' Tag(en) überfällig'):(left===0?'Heute fällig':('Noch '+left+' Tag(e)'));
  if(left<0)kind='red';
  return {kind,text,due,basisText,days,left};
};
const adDeadlineClass = kind => 'ad-deadline ad-deadline-'+(['green','orange','red','done'].includes(kind)?kind:'neutral');

// Betreff aus den ausdrücklich erfassten Angaben (kein Standard-Rückrufhinweis).
const adTerminBetreff=a=>{
  const sauber=v=>String(v||'').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
  const hinweis=[];
  if(a.vorherAnrufen===true)hinweis.push('30 Min. vorher anrufen');
  const frei=sauber(a.wichtigerTerminhinweis);
  if(frei)hinweis.push(frei);
  return [sauber(a.vn||a.bezeichnung)||'VN ohne Namen',sauber(a.schadensart)||'Besichtigung',...(hinweis.length?[hinweis.join(' / ')]:[])].join(' – ');
};
const adTerminText=a=>{
  const end=adZeitPlusMinuten(a.besichtigungZeit||'',120);
  return [
    'Studio F ZT GmbH – Besichtigung',
    'Auftrag / Schadennummer: '+(a.schadennummer||a.aktenzeichen||''),
    'Versicherung: '+(a.versicherung||''),
    'VN: '+(a.vn||a.bezeichnung||''),
    'Anspruchsteller: '+(a.geschaedigter||'ident mit VN'),
    'Kontaktperson: '+(a.kontaktName||''),
    'Telefon: '+(a.kontaktTelefon||'nicht hinterlegt'),
    'Adresse: '+assistenzAdresse(a),
    'Kundenzeitfenster: '+(a.besichtigungZeit||'')+'–'+end+' Uhr (120 Min.)',
    ...(a.vorherAnrufen===true?['WICHTIG: 30 Min. vorher anrufen.']:[]),
    ...(String(a.wichtigerTerminhinweis||'').trim()?['WICHTIG: '+String(a.wichtigerTerminhinweis).trim()]:[]),
    ...(String(a.anmerkungen||'').trim()?['Anmerkungen: '+String(a.anmerkungen).trim()]:[])
  ].join('\n');
};
const adTerminSignaturInput=a=>JSON.stringify([
  a.schadennummer||a.aktenzeichen||a.cloudItemId||a.id,
  a.besichtigungDatum||'',a.besichtigungZeit||'',
  adTerminBetreff(a),assistenzAdresse(a),adTerminText(a)
]);

function AssistenzDetails({akt,cloud,onSaved,go,toast,tourTarget,onTourTargetUsed,onTerminSaved,alleAkten=[]}) {
  const [d,setD]=useState(()=>({
    vn:akt.vn||akt.bezeichnung||'',geschaedigter:akt.geschaedigter||'',
    kontaktName:akt.kontaktName||'',kontaktTelefon:akt.kontaktTelefon||'',
    anmerkungen:akt.anmerkungen||'',
    dispoStatus:akt.dispoStatus||'neu',
    besichtigungDatum:akt.besichtigungDatum||'',besichtigungZeit:akt.besichtigungZeit||'',
    auftragDatum:akt.auftragDatum||'',fristTage:akt.fristTage??'',berichtVersendetAm:akt.berichtVersendetAm||'',berichtAbgelegt:akt.berichtAbgelegt===true,
    fristNichtMoeglich:akt.fristNichtMoeglich===true,fristNachrichtVersendet:akt.fristNachrichtVersendet===true,
    fristErstberichtVersendet:akt.fristErstberichtVersendet===true,fristKommentar:akt.fristKommentar||'',
    terminNotiz:'',vorherAnrufen:akt.vorherAnrufen===true,wichtigerTerminhinweis:akt.wichtigerTerminhinweis||'',terminAuftrag:akt.terminAuftrag||null,
    terminAenderung:akt.terminAenderung||null,terminAenderungsHistorie:akt.terminAenderungsHistorie||[]
  }));
  const [busy,setBusy]=useState(false);
  const [calendarMsg,setCalendarMsg]=useState('');
  const [fristMsg,setFristMsg]=useState('');
  const [changeDraft,setChangeDraft]=useState(null);
  const changeSubmitLock=useRef(false);
  const [lade,setLade]=useState(!!cloud.connected);
  const [dateiOrdner,setDateiOrdner]=useState('Aktstamm');
  const [dateien,setDateien]=useState([]);
  const [dateiBusy,setDateiBusy]=useState(false);
  const [dateiMsg,setDateiMsg]=useState('');
  const [drag,setDrag]=useState(false);
  const [alleDateien,setAlleDateien]=useState(false);
  const fileInput=useRef(null);
  const edit=(k,v)=>setD(x=>Object.assign({},x,{[k]:v}));
  const waehleOrdner=async(o)=>{setDateiOrdner(o);setAlleDateien(false);setDateien([]);setDateiMsg('');};
  const ladeDateien=async(o=dateiOrdner)=>{
    if(!cloud.connected)return;
    try{
      const items=o==='Aktstamm' ? await cloud.listAktRoot(akt) : await cloud.list(akt,o);
      setDateien((items||[]).filter(x=>x.file && !/\.json$/i.test(x.name||'')));
    }catch(e){setDateiMsg('Dateiliste konnte nicht geladen werden: '+(e.message||String(e)));}
  };
  // Beim Aufklappen aktuelle Disposition lesen – nicht nur lokale Browserdaten verwenden.
  useEffect(()=>{
    let stop=false;
    if(!cloud.connected){setLade(false);return;}
    setLade(true);
    cloud.readDisposition(akt).then(r=>{
      if(stop||!r?.data)return;
      const v=dispoMergeFields(r.data);
      setD(prev=>Object.assign({},prev,v));
      const changed=Object.keys(v).some(k=>String(akt[k]??'')!==String(v[k]??''));
      if(changed)onSaved(Object.assign({},akt,v,{dispoGeaendert:r.data.updatedAt||akt.dispoGeaendert||''}));
    }).catch(e=>{if(!stop)setDateiMsg('Dispositionsdaten konnten nicht aktualisiert werden: '+(e.message||String(e)));})
      .finally(()=>{if(!stop)setLade(false);});
    return()=>{stop=true;};
  },[akt.id,akt.cloudItemId,cloud.connected]);
  useEffect(()=>{setDateiMsg('');ladeDateien(dateiOrdner);},[akt.id,akt.cloudItemId,cloud.connected,dateiOrdner]);
  // Nur Formular-Vorschlag: weder Speichern noch Versand erfolgt ohne gelben Bestätigungsbutton.
  useEffect(()=>{
    if(!tourTarget||tourTarget.id!==akt.id||lade)return;
    if(d.terminAuftrag?.status==='sent'||d.terminAuftrag?.status==='queued'||['preparing','queued'].includes(d.terminAenderung?.status)){
      setCalendarMsg('Dieser Akt hat bereits einen Outlook-Termin. Bitte die bestehende Terminänderung verwenden.');
    }else{
      setD(prev=>({...prev,besichtigungDatum:tourTarget.date,besichtigungZeit:tourTarget.time,dispoStatus:'terminabstimmung'}));
      setCalendarMsg('Tourenvorschlag '+tourTarget.date+' · '+tourTarget.time+' Uhr übernommen. Bitte mit der Kontaktperson abstimmen und erst danach gelb „Termin bestätigen & Einladung vorbereiten“ wählen.');
    }
    onTourTargetUsed?.();
  },[tourTarget?.id,tourTarget?.nonce,lade,akt.id]);
  // Eine bestätigte Outlook-Einladung führt automatisch zum Ordnerwechsel.
  // Wird der Browser zwischen Bestätigung und Versand geschlossen, läuft diese Prüfung
  // bei erneutem Aufklappen des Auftrags weiter. Es gibt keinen zweiten Einladungsversand.
  useEffect(()=>{
    const request=d.terminAuftrag;
    if(!cloud.connected||!['queued','sent'].includes(request?.status)||!request.requestId||(request.status==='sent'&&statusKey(akt)!=='offen'))return;
    let inactive=false,checking=false;
    const check=async()=>{
      if(inactive||checking)return;
      checking=true;
      try{
        const complete=await cloud.reconcileTerminInvitation(Object.assign({},akt,{terminAuftrag:request}));
        if(!complete||inactive)return;
        setD(prev=>Object.assign({},prev,{dispoStatus:'terminvereinbart',terminAuftrag:complete.terminAuftrag}));
        onSaved(complete);
        setCalendarMsg('Outlook-Einladung bestätigt. Der Bearbeitungsstatus ist aktualisiert.');
        toast('Outlook-Einladung bestätigt');
      }catch(e){if(!inactive)setCalendarMsg('Prüfung der Outlook-Rückmeldung / Ordnerwechsel: '+(e.message||String(e)));}
      finally{checking=false;}
    };
    check();
    const timer=setInterval(check,15000);
    return()=>{inactive=true;clearInterval(timer);};
  },[akt.id,akt.cloudItemId,cloud.connected,d.terminAuftrag?.requestId,d.terminAuftrag?.status]);

  // Änderungsbestätigung: alter Besichtigungstermin bleibt bis zum Outlook-Erfolg gültig.
  useEffect(()=>{
    const req=d.terminAenderung;
    if(!cloud.connected||!['preparing','queued'].includes(req?.status)||!req.requestId)return;
    let inactive=false,checking=false;
    const check=async()=>{
      if(inactive||checking)return;
      checking=true;
      try{
        const complete=await cloud.reconcileTerminChange(Object.assign({},akt,{terminAenderung:req}));
        if(!complete||inactive)return;
        setD(prev=>Object.assign({},prev,dispoMergeFields(complete)));
        setChangeDraft(null);
        onSaved(complete);
        setCalendarMsg('Terminänderung von Outlook bestätigt und im Akt dokumentiert.');
        toast('Terminänderung bestätigt');
      }catch(e){if(!inactive)setCalendarMsg('Terminänderung / Outlook-Rückmeldung: '+(e.message||String(e)));}
      finally{checking=false;}
    };
    check();
    const timer=setInterval(check,15000);
    return()=>{inactive=true;clearInterval(timer);};
  },[akt.id,akt.cloudItemId,cloud.connected,d.terminAenderung?.requestId,d.terminAenderung?.status]);

  const bis=adZeitPlusMinuten(d.besichtigungZeit,120);
  const frist=adFristInfo(Object.assign({},akt,d));
  const standardTage=String(akt.versicherung||'').toUpperCase().includes('RSG')?15:((String(akt.versicherung||'').toUpperCase().includes('EXP')||String(akt.versicherung||'').toUpperCase().includes('EXPERTA'))?3:'');
  const speichern=async()=>{
    setCalendarMsg('');
    if(['preparing','queued'].includes(d.terminAenderung?.status)){setCalendarMsg('Terminänderung noch ausstehend. Bitte zuerst die Outlook-Rückmeldung abwarten.');return;}
    if(!cloud.connected){toast('Bitte zuerst OneDrive verbinden.');return;}
    if(Boolean(d.besichtigungDatum)!==Boolean(d.besichtigungZeit)){
      toast('Bitte Datum und Beginn gemeinsam eintragen (oder beide freilassen).');return;
    }
    // Ein vollständiges Datum und eine Startzeit reichen zur Terminbestätigung aus.
    // Die Einladung wird erst mit dem bewussten Klick auf den gelben Button vorbereitet.
    const sollTerminBestaetigen=Boolean(d.besichtigungDatum&&d.besichtigungZeit);
    if(d.dispoStatus==='terminvereinbart'&&!sollTerminBestaetigen){
      toast('Für einen bestätigten Termin bitte Datum und Beginn eingeben.');return;
    }
    if(sollTerminBestaetigen&&!Number.isFinite(tpMin(d.besichtigungZeit))){
      setCalendarMsg('Uhrzeit bitte vollständig als HH:MM eingeben (z. B. 09:30).');return;
    }
    if(sollTerminBestaetigen && bis<=d.besichtigungZeit){
      toast('Das zweistündige Kundenzeitfenster darf nicht über Mitternacht reichen.');return;
    }
    if(!sollTerminBestaetigen && ['queued','sent'].includes(akt.terminAuftrag?.status)){
      setCalendarMsg('Bereits ein Outlook-Termin vorhanden. Änderungen oder Stornierungen müssen erst mit Outlook abgeglichen werden.');return;
    }
    if(sollTerminBestaetigen&&alleAkten.some(other=>other.id!==akt.id&&tpBooked(other)&&other.besichtigungDatum===d.besichtigungDatum&&
       tpMin(d.besichtigungZeit)<tpMin(other.besichtigungZeit)+30&&tpMin(other.besichtigungZeit)<tpMin(d.besichtigungZeit)+30)){
      setCalendarMsg('Interner Besichtigungsbeginn überschneidet sich mit einem anderen Termin (30 Min.). Bitte Tour aktualisieren; Fahrtzeiten prüft der Tourenplaner.');return;
    }
    const next=Object.assign({},akt,d,{
      bezeichnung:d.geschaedigter||d.vn||akt.bezeichnung,
      dispoStatus:sollTerminBestaetigen?'terminvereinbart':d.dispoStatus,
      besichtigungBis:bis,dispoGeaendert:new Date().toISOString()
    });
    const signatur=adTerminSignaturInput(next);
    if(sollTerminBestaetigen && ['queued','sent'].includes(next.terminAuftrag?.status) && next.terminAuftrag.signature!==signatur){
      setCalendarMsg('Für diesen Akt existiert bereits ein Terminauftrag. Vor einer Terminänderung bitte erst den bisherigen Outlook-Termin prüfen, damit keine Doppeleinladung entsteht.');return;
    }
    setBusy(true);
    try{
      const fresh=await cloud.readDisposition(akt);
      // Assistenz darf die SV-Fristdokumentation weder bearbeiten noch mit veralteten Werten überschreiben.
      for(const field of ['fristTage','berichtVersendetAm','berichtAbgelegt','fristNichtMoeglich','fristNachrichtVersendet','fristErstberichtVersendet','fristKommentar','tourAusnahmen','workflowHistory']){
        if(fresh?.data&&Object.prototype.hasOwnProperty.call(fresh.data,field))next[field]=fresh.data[field];
      }
      const r=await cloud.saveDisposition(next);
      if(!r?.id)throw new Error('OneDrive hat das Speichern nicht bestätigt.');
      onSaved(next);
      if(sollTerminBestaetigen){
        if(['queued','sent'].includes(next.terminAuftrag?.status)&&next.terminAuftrag.signature===signatur){
          setCalendarMsg('Dieser Terminauftrag wurde bereits bereitgestellt. Keine zweite Datei erzeugt. Outlook-Versand über Power Automate bitte prüfen.');
          toast('Auftragsdaten gespeichert · Terminauftrag bereits vorhanden');
          onTerminSaved?.(next);
        }else{
          setCalendarMsg('Terminauftrag wird im OneDrive-Ausgang für Power Automate abgelegt …');
          const job=await cloud.createTerminInvitationJob(next);
          const meta={requestId:job.requestId,signature:job.signature,status:'queued',queuedAt:new Date().toISOString(),fileName:job.file.name,subject:job.subject};
          const queued=Object.assign({},next,{terminAuftrag:meta});
          const saved=await cloud.saveDisposition(queued);
          if(!saved?.id)throw new Error('Terminauftrag abgelegt, jedoch konnte die Auftragsreferenz in Disposition.json nicht bestätigt werden. Bitte vor Wiederholung den OneDrive-Ausgang prüfen.');
          setD(prev=>Object.assign({},prev,{dispoStatus:'terminvereinbart',terminAuftrag:meta}));
          onSaved(queued);
          setCalendarMsg('Terminauftrag bereitgestellt. Nach erfolgreicher Outlook-Rückmeldung wird der Akt automatisch nach 000_Tagesbesichtigung verschoben.');
          toast('Terminauftrag für Outlook bereitgestellt');
          onTerminSaved?.(queued);
        }
      }else{
        setCalendarMsg('Auftragsdaten in OneDrive gespeichert; keine Kalendereinladung erstellt.');
        toast('Auftrags- und Dispositionsdaten in OneDrive gespeichert');
      }
    }catch(e){setCalendarMsg('Vorgang nicht vollständig abgeschlossen: '+(e.message||String(e)));toast('Bitte Hinweis im Auftrag prüfen');}
    finally{setBusy(false);}
  };
  const startTerminChange=()=>{
    if(d.terminAuftrag?.status!=='sent'||!d.terminAuftrag?.eventId){
      setCalendarMsg('Die Outlook-Termin-ID ist noch nicht bestätigt. Eine Änderung ist derzeit gesperrt.');return;
    }
    if(['preparing','queued'].includes(d.terminAenderung?.status))return;
    setChangeDraft({datum:d.besichtigungDatum,zeit:d.besichtigungZeit,
      vorherAnrufen:d.vorherAnrufen===true,hinweis:d.wichtigerTerminhinweis||'',grund:''});
    setCalendarMsg('');
  };
  const submitTerminChange=async(retry=false)=>{
    if(!cloud.connected||busy||lade||changeSubmitLock.current)return;
    const old=d.terminAuftrag;
    if(old?.status!=='sent'||!old.eventId){setCalendarMsg('Kein bestätigter Outlook-Termin mit eventId vorhanden.');return;}
    if(!retry){
      if(!changeDraft?.datum||!changeDraft?.zeit){setCalendarMsg('Neues Datum und neue Uhrzeit fehlen.');return;}
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(changeDraft.zeit)){setCalendarMsg('Uhrzeit bitte als HH:MM eingeben (z. B. 09:30).');return;}
      if(adZeitPlusMinuten(changeDraft.zeit,120)<=changeDraft.zeit){setCalendarMsg('Das zweistündige Zeitfenster darf nicht über Mitternacht reichen.');return;}
      const unchanged=changeDraft.datum===d.besichtigungDatum&&changeDraft.zeit===d.besichtigungZeit&&
        changeDraft.vorherAnrufen===(d.vorherAnrufen===true)&&changeDraft.hinweis===(d.wichtigerTerminhinweis||'');
      if(unchanged){setCalendarMsg('Keine Terminänderung erkannt.');return;}
      if(alleAkten.some(other=>other.id!==akt.id&&tpBooked(other)&&other.besichtigungDatum===changeDraft.datum&&tpMin(changeDraft.zeit)<tpMin(other.besichtigungZeit)+30&&tpMin(other.besichtigungZeit)<tpMin(changeDraft.zeit)+30)){setCalendarMsg('Terminänderung überschneidet sich mit dem internen Beginn einer anderen Besichtigung (30 Min.).');return;}
      if(['preparing','queued'].includes(d.terminAenderung?.status)){setCalendarMsg('Eine Terminänderung ist bereits in Bearbeitung.');return;}
      if(!window.confirm('Bestehenden Outlook-Termin wirklich aktualisieren? Die bisherige Einladung wird NICHT als neuer Termin erstellt.'))return;
    }
    changeSubmitLock.current=true;
    setBusy(true);setCalendarMsg('Terminänderung wird vorbereitet …');
    try{
      const current=await cloud.readDisposition(akt);
      if(!current?.data)throw new Error('Disposition.json ist nicht abrufbar.');
      const fresh=Object.assign({},akt,dispoMergeFields(current.data));
      if(fresh.terminAuftrag?.status!=='sent'||fresh.terminAuftrag?.eventId!==old.eventId)
        throw new Error('Outlook-Termin-ID hat sich seit dem Öffnen geändert. Bitte Auftrag aktualisieren.');
      const active=fresh.terminAenderung;
      if(retry){
        if(!['preparing','queued'].includes(active?.status)||active.requestId!==d.terminAenderung?.requestId)
          throw new Error('Gespeicherter Änderungsauftrag stimmt nicht mehr überein.');
      }else if(['preparing','queued'].includes(active?.status)){
        throw new Error('Bereits eine Terminänderung vorhanden. Bitte zuerst deren Ergebnis abwarten.');
      }
      const meta=retry?active:{
        status:'preparing',requestId:cloud.newTerminChangeId(),
        previousEventId:old.eventId,previousDate:fresh.besichtigungDatum,previousTime:fresh.besichtigungZeit,
        newDate:changeDraft.datum,newTime:changeDraft.zeit,
        newCall:changeDraft.vorherAnrufen===true,newNote:changeDraft.hinweis,
        reason:String(changeDraft.grund||'').trim(),requestedAt:new Date().toISOString()
      };
      // Zuerst den festen requestId in OneDrive speichern: Wiederholung verwendet dieselbe Datei.
      const preparing=Object.assign({},fresh,{terminAenderung:meta});
      if(!retry){
        const saved=await cloud.saveDisposition(preparing);
        if(!saved?.id)throw new Error('Änderungsreferenz konnte nicht gespeichert werden.');
        setD(prev=>Object.assign({},prev,{terminAenderung:meta}));onSaved(preparing);
      }
      const job=await cloud.createTerminChangeJob(preparing,meta);
      const queued=Object.assign({},preparing,{terminAenderung:Object.assign({},meta,{
        status:'queued',fileName:job.file.name,queuedAt:meta.queuedAt||new Date().toISOString()
      })});
      // Rückmeldung kann bereits während der Dateierstellung eingehen.
      // In diesem Fall den bestätigten Stand niemals mit „queued“ überschreiben.
      const latest=await cloud.readDisposition(akt);
      if(latest?.data?.terminAenderung?.requestId!==meta.requestId)
        throw new Error('Die Änderungsreferenz wurde parallel verändert. Kein Überschreiben des Aktes.');
      if(latest.data.terminAenderung.status==='updated'){
        const confirmed=Object.assign({},akt,dispoMergeFields(latest.data));
        setD(prev=>Object.assign({},prev,dispoMergeFields(latest.data)));
        onSaved(confirmed);setChangeDraft(null);
        setCalendarMsg('Terminänderung wurde bereits durch Outlook bestätigt.');
        return;
      }
      const stored=await cloud.saveDisposition(Object.assign({},akt,dispoMergeFields(latest.data),{terminAenderung:queued.terminAenderung}));
      if(!stored?.id)throw new Error('Änderungsdatei erstellt, Status konnte nicht abschließend bestätigt werden. Bitte keine zweite Änderung anlegen.');
      setD(prev=>Object.assign({},prev,{terminAenderung:queued.terminAenderung}));onSaved(queued);
      setChangeDraft(null);
      setCalendarMsg('Änderungsauftrag in OneDrive gespeichert. Der bisherige Termin bleibt bis zur Outlook-Bestätigung gültig.');
      toast('Terminänderung zur Verarbeitung bereitgestellt');
    }catch(e){setCalendarMsg('Terminänderung nicht abgeschlossen: '+(e.message||String(e))+' Bitte vor erneutem Versuch den Änderungsauftrag prüfen.');}
    finally{changeSubmitLock.current=false;setBusy(false);}
  };
  // Fristvermerke unabhängig vom Kalender speichern – kein Terminauftrag, kein Versand.
  const fristSpeichern=async()=>{
    setFristMsg('');
    if(!cloud.connected){toast('Bitte zuerst OneDrive verbinden.');return;}
    if(lade||busy)return;
    setBusy(true);
    try{
      const current=await cloud.readDisposition(akt);
      const next=Object.assign({},akt,dispoMergeFields(current?.data||{}),{
        fristNichtMoeglich:d.fristNichtMoeglich===true,
        fristNachrichtVersendet:d.fristNachrichtVersendet===true,
        fristErstberichtVersendet:d.fristErstberichtVersendet===true,
        berichtAbgelegt:d.berichtAbgelegt===true,
        fristKommentar:String(d.fristKommentar||''),
        dispoGeaendert:new Date().toISOString()
      });
      const saved=await cloud.saveDisposition(next);
      if(!saved?.id)throw new Error('OneDrive hat den Fristvermerk nicht bestätigt.');
      onSaved(next);
      setFristMsg('Fristvermerk in OneDrive gespeichert. Es wurde keine Nachricht oder Outlook-Einladung versendet.');
      toast('Fristvermerk gespeichert');
    }catch(e){setFristMsg('Speichern fehlgeschlagen: '+(e.message||String(e)));toast('Fristvermerk konnte nicht gespeichert werden');}
    finally{setBusy(false);}
  };
  const hochladen=async(files)=>{
    if(!cloud.connected){toast('Für den Datei-Upload bitte zuerst OneDrive verbinden.');return;}
    const eingang=Array.from(files||[]).filter(f=>f && f.name);
    if(!eingang.length)return;
    setDateiBusy(true);setDateiMsg('Dateien werden geprüft …');
    let erfolgreich=0;const uebersprungen=[];
    try{
      const current=dateiOrdner==='Aktstamm' ? await cloud.listAktRoot(akt) : await cloud.list(akt,dateiOrdner);
      const seen=new Set((current||[]).map(x=>String(x.name||'').toLowerCase()));
      let parent=null;
      if(dateiOrdner==='Aktstamm')parent=await cloud.resolveAktItem(akt);
      for(const file of eingang){
        if(file.size>250*1024*1024){uebersprungen.push(file.name+' (größer als 250 MB)');continue;}
        if(seen.has(file.name.toLowerCase())){uebersprungen.push(file.name+' (bereits vorhanden – nicht überschrieben)');continue;}
        setDateiMsg('Upload '+(erfolgreich+1)+'/'+eingang.length+': '+file.name);
        try{
          const result=dateiOrdner==='Aktstamm'
            ? await cloud.uploadToParent(parent.id,file)
            : await cloud.upload(akt,dateiOrdner,file);
          if(!result?.id)throw new Error('Keine OneDrive-Dateibestätigung');
          seen.add(file.name.toLowerCase());erfolgreich++;
        }catch(e){uebersprungen.push(file.name+' ('+(e.message||String(e))+')');}
      }
      setDateiMsg(erfolgreich+' Datei(en) hochgeladen.'+(uebersprungen.length?' Nicht übernommen:\n'+uebersprungen.join('\n'):''));
      await ladeDateien(dateiOrdner);
      if(erfolgreich)toast(erfolgreich+' Datei(en) in OneDrive gespeichert');
    }catch(e){setDateiMsg('Upload fehlgeschlagen: '+(e.message||String(e)));}
    finally{setDateiBusy(false);setDrag(false);if(fileInput.current)fileInput.current.value='';}
  };
  return <div className="ad-expanded-inner" aria-label={'Auftrag '+(akt.schadennummer||akt.aktenzeichen||'') }>
    <div className="ad-panel-content">
      <div className="ad-route-head">
        <div><h2>Auftrag {akt.schadennummer||akt.aktenzeichen||'—'}</h2><div className="ad-sub">Direktbearbeitung · Kontakt, Termin und Unterlagen</div></div>
        <span className="ad-tiny">Assistenz: Auftrag, Termin und Unterlagen</span>
      </div>
      <div className="ad-detail"><div className="ad-detail-grid">
        <div className="ad-kv"><label>Versicherung / Auftraggeber</label><strong>{akt.versicherung||'—'}</strong></div>
        <div className="ad-kv"><label>Bearbeitungsstatus</label><span className={'ad-pill '+assistenzStatusStyle(akt)}>{dispoLabel(akt)}</span></div>
        <div className="ad-kv"><label>Versicherungsnehmer</label><strong>{akt.vn||akt.bezeichnung||'—'}</strong></div>
        <div className="ad-kv"><label>Anspruchsteller</label><strong>{akt.geschaedigter||'ident mit VN'}</strong></div>
        <div className="ad-kv"><label>Besichtigungsadresse</label><strong>{assistenzAdresse(akt)}</strong></div>
        <div className="ad-kv"><label>OneDrive</label><strong>{cloud.connected?'Verbunden':'Nicht verbunden'}</strong></div>
        <div className="ad-kv"><label>Berichtsfrist</label><span className={adDeadlineClass(frist.kind)}>{frist.text}{frist.due?' · '+frist.due:''}</span></div>
      </div></div>
      <div className="ad-edit"><h3>Auftragsdaten bearbeiten {lade&&<span className="ad-tiny">· OneDrive-Daten werden geladen …</span>}</h3>
        <div className="ad-edit-grid">
          <div className="ad-edit-field"><label>Versicherungsnehmer (VN)</label><input disabled={lade||busy} value={d.vn||''} onChange={e=>edit('vn',e.target.value)} placeholder="Name des VN"/></div>
          <div className="ad-edit-field"><label>Geschädigter (abweichend)</label><input disabled={lade||busy} value={d.geschaedigter||''} onChange={e=>edit('geschaedigter',e.target.value)} placeholder="Leer, wenn identisch mit VN"/></div>
          <div className="ad-edit-field"><label>Kontaktperson</label><input disabled={lade} value={d.kontaktName} onChange={e=>edit('kontaktName',e.target.value)} placeholder="Ansprechperson"/></div>
          <div className="ad-edit-field"><label>Telefon</label><input disabled={lade} type="tel" value={d.kontaktTelefon} onChange={e=>edit('kontaktTelefon',e.target.value)} placeholder="Telefonnummer"/></div>
          <div className="ad-edit-field"><label>Bearbeitungsstatus</label><select disabled={lade||statusKey(akt)!=='offen'} value={statusKey(akt)==='offen'?d.dispoStatus:''} onChange={e=>edit('dispoStatus',e.target.value)}>
            {statusKey(akt)==='offen'?DISPO_STATUS.map(x=><option key={x[0]} value={x[0]} disabled={x[0]==='terminvereinbart'&&d.dispoStatus!=='terminvereinbart'}>{x[1]}</option>):<option value="">{dispoLabel(akt)} – Aktablage</option>}
          </select></div>
          <div className="ad-edit-field"><label>Auftrag eingelangt am (Fristbeginn RSG)</label><input disabled={lade} type="date" value={d.auftragDatum} onChange={e=>edit('auftragDatum',e.target.value)}/></div>
          <div className="ad-edit-field"><label>Berechnungsbasis</label><strong style={{fontSize:12}}>{frist.basisText}{frist.due?' · Abgabe bis '+frist.due:''}</strong></div>
          <div className="ad-edit-field" style={{gridColumn:'1 / -1'}}><label>Anmerkungen zum Auftrag</label><textarea disabled={lade} rows={3} value={d.anmerkungen} onChange={e=>edit('anmerkungen',e.target.value)} placeholder="Rückruf, Erreichbarkeit, Besonderheiten …"/></div>
        </div>
        <div className="ad-appointment-fields">
          <h3>Besichtigung direkt im Dashboard eintragen</h3>
          <div className="ad-edit-grid">
            <div className="ad-edit-field"><label>Besichtigungsdatum</label><input disabled={lade||d.terminAuftrag?.status==='sent'} type="date" value={d.besichtigungDatum} onChange={e=>edit('besichtigungDatum',e.target.value)}/></div>
            <div className="ad-edit-field"><label>Beginn Kundenzeitfenster</label><input disabled={lade||d.terminAuftrag?.status==='sent'} type="text" inputMode="numeric" maxLength={5} placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" value={d.besichtigungZeit} onChange={e=>edit('besichtigungZeit',e.target.value)}/></div>
          </div>
          <label className={'ad-call-option '+(d.vorherAnrufen===true?'ad-checked':'')}><input type="checkbox" disabled={lade||d.terminAuftrag?.status==='sent'} checked={d.vorherAnrufen===true} onChange={e=>edit('vorherAnrufen',e.target.checked)}/> 30 Minuten vorher anrufen (optional)</label>
          <div className="ad-edit-field" style={{marginTop:10}}><label>Wichtiger Terminhinweis (optional, im Outlook-Betreff am Schluss)</label><input disabled={lade||d.terminAuftrag?.status==='sent'} value={d.wichtigerTerminhinweis||''} onChange={e=>edit('wichtigerTerminhinweis',e.target.value)} placeholder="z. B. Schlüssel bei Nachbar"/></div>
          <div className="ad-appointment-preview">
            <div><strong>Outlook-Betreff:</strong> {adTerminBetreff(Object.assign({},akt,d))}</div>
            <div><strong>Ort:</strong> {assistenzAdresse(akt)}</div>
            {d.besichtigungDatum&&bis?'Kundenzeitfenster: '+d.besichtigungDatum+' · '+d.besichtigungZeit+'–'+bis+' Uhr (120 Minuten). Intern ca. 30 Minuten Besichtigung.':'Datum und Startzeit eingeben; das zweistündige Ende wird automatisch berechnet.'}
            <div>Alle Wochentage können als Besichtigungstag vereinbart werden.</div>
            <div><strong>Terminbestätigung:</strong> Datum und Uhrzeit eingeben und den Button betätigen. Der Status wird automatisch auf „Termin vereinbart“ gesetzt. Nach erfolgreicher Outlook-Rückmeldung wird der Akt nach <code>000_Tagesbesichtigung</code> verschoben.</div>
            {d.terminAuftrag?.status==='queued'&&<div><strong>Outlook:</strong> Auftrag zur Übergabe bereitgestellt · {d.terminAuftrag.fileName||d.terminAuftrag.requestId}. Noch kein bestätigter Versand.</div>}
          </div>
          {d.terminAuftrag?.status==='sent'&&d.terminAuftrag.eventId&&<section className="ad-change-section" aria-label="Outlook-Terminänderung">
            <h3>Bestehenden Outlook-Termin ändern</h3>
            <div className="ad-change-hint">Bestätigter Termin: {d.besichtigungDatum} · {d.besichtigungZeit}–{adZeitPlusMinuten(d.besichtigungZeit,120)} Uhr. Der Änderungsmodus erstellt keinen zweiten Termin.</div>
            {['preparing','queued'].includes(d.terminAenderung?.status)?<>
              <div className="ad-change-pending" role="status">Änderung ausstehend: {d.terminAenderung.newDate} · {d.terminAenderung.newTime} Uhr. Der bisherige Termin bleibt vorerst gültig.</div>

              {d.terminAenderung.status==='preparing'&&<button type="button" className="ad-btn ad-sm" disabled={busy||lade||!cloud.connected} onClick={()=>submitTerminChange(true)}>Gespeicherten Änderungsauftrag erneut bereitstellen</button>}
            </>:<>
              {!changeDraft?<button type="button" className="ad-btn ad-sm" disabled={busy||lade||!cloud.connected||cloud.storageMode==='shared'} onClick={startTerminChange}>✎ Termin ändern (im TEST noch gesperrt)</button>:<>
                <div className="ad-edit-grid">
                  <div className="ad-edit-field"><label>Neues Besichtigungsdatum</label><input type="date" disabled={busy} value={changeDraft.datum} onChange={e=>setChangeDraft(v=>Object.assign({},v,{datum:e.target.value}))}/></div>
                  <div className="ad-edit-field"><label>Neuer Beginn (120 Minuten)</label><input type="text" inputMode="numeric" maxLength={5} placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" disabled={busy} value={changeDraft.zeit} onChange={e=>setChangeDraft(v=>Object.assign({},v,{zeit:e.target.value}))}/></div>
                  <div className="ad-edit-field"><label>Wichtiger Terminhinweis</label><input disabled={busy} value={changeDraft.hinweis} onChange={e=>setChangeDraft(v=>Object.assign({},v,{hinweis:e.target.value}))}/></div>
                  <div className="ad-edit-field"><label>Vorher anrufen</label><label className="ad-frist-check"><input type="checkbox" disabled={busy} checked={changeDraft.vorherAnrufen} onChange={e=>setChangeDraft(v=>Object.assign({},v,{vorherAnrufen:e.target.checked}))}/> 30 Minuten vorher</label></div>
                  <div className="ad-edit-field" style={{gridColumn:'1 / -1'}}><label>Grund der Änderung (optional; internes Protokoll)</label><textarea rows={2} disabled={busy} value={changeDraft.grund} onChange={e=>setChangeDraft(v=>Object.assign({},v,{grund:e.target.value}))}/></div>
                </div>
                <div className="ad-change-actions"><button type="button" className="ad-btn ad-yellow ad-sm" disabled={busy||lade||!cloud.connected} onClick={()=>submitTerminChange(false)}>Terminänderung bestätigen</button><button type="button" className="ad-btn ad-sm" disabled={busy} onClick={()=>setChangeDraft(null)}>Abbrechen</button></div>
              </>}
            </>}
            {Array.isArray(d.terminAenderungsHistorie)&&d.terminAenderungsHistorie.length>0&&<div className="ad-change-history"><strong>Bestätigte Änderungen</strong>{d.terminAenderungsHistorie.slice(-5).reverse().map((h,i)=><div key={h.requestId||i}>{h.previousDate} {h.previousTime} → {h.newDate} {h.newTime} · {h.confirmedAt||''}{h.reason?' · '+h.reason:''}</div>)}</div>}
          </section>}
        </div>
        {cloud.terminTestFlowEnabled&&<div className="ad-calendar-note" role="note">TEST: Einladungen gehen ausschließlich an guggenbichler@studio-f.at. Nur synthetische Testakten verwenden. Terminänderungen sind noch gesperrt.</div>}
        <div className="ad-detail-actions"><button type="button" className="ad-btn ad-yellow" disabled={busy||lade||!cloud.connected||d.terminAuftrag?.status==='sent'||['preparing','queued'].includes(d.terminAenderung?.status)} onClick={speichern}>{d.terminAuftrag?.status==='sent'?'Outlook-Termin bestätigt · für Änderung oben klicken':busy?'Speichert / Terminauftrag wird vorbereitet …':(d.besichtigungDatum&&d.besichtigungZeit?(cloud.terminTestFlowEnabled?'TEST-Termin bestätigen & Einladung vorbereiten':'Termin bestätigen & Einladung vorbereiten'):'Auftragsdaten speichern')}</button></div>
        {calendarMsg&&<div className="ad-calendar-note" role="status">{calendarMsg}</div>}
      </div>
      <div className="ad-edit"><div className="ad-upload-head"><h3>Unterlagen per Drag & Drop hinzufügen</h3><div className="ad-edit-field"><label>Ablageort in OneDrive</label><select disabled={dateiBusy||!cloud.connected} value={dateiOrdner} onChange={e=>waehleOrdner(e.target.value)}><option value="Aktstamm">Aktstamm (Standard)</option><option value="02_Unterlagen SV">02_Unterlagen SV</option><option value="01_Fotos Besichtigung">01_Fotos Besichtigung</option></select></div></div>
        <input ref={fileInput} type="file" multiple style={{display:'none'}} disabled={!cloud.connected||dateiBusy} onChange={e=>hochladen(e.target.files)}/>
        <div role="button" tabIndex={cloud.connected&&!dateiBusy?0:-1} aria-label="Dateien zum Hochladen auswählen oder hier ablegen" className={'ad-upload-area '+(drag?'ad-dragover ':'')+(!cloud.connected||dateiBusy?'ad-disabled':'')}
          onClick={()=>{if(cloud.connected&&!dateiBusy)fileInput.current?.click();}}
          onKeyDown={e=>{if((e.key==='Enter'||e.key===' ')&&cloud.connected&&!dateiBusy){e.preventDefault();fileInput.current?.click();}}}
          onDragOver={e=>{e.preventDefault();if(cloud.connected&&!dateiBusy)setDrag(true);}}
          onDragLeave={e=>{e.preventDefault();if(!e.currentTarget.contains(e.relatedTarget))setDrag(false);}}
          onDrop={e=>{e.preventDefault();e.stopPropagation();setDrag(false);if(!dateiBusy)hochladen(e.dataTransfer?.files);}}>
          <strong>{dateiBusy?'Upload läuft …':'PDF, Word, Bilder oder andere Auftragsunterlagen hier ablegen'}</strong><br/>oder klicken und mehrere Dateien auswählen<br/><span className="ad-tiny">Speicherung direkt unter {dateiOrdner} · Max. 250 MB je Datei · bestehende Dateinamen werden nicht überschrieben</span>
        </div>
        {dateiMsg&&<div className="ad-upload-msg" role="status">{dateiMsg}</div>}
        <div className="ad-upload-head" style={{marginTop:12}}><strong style={{fontSize:12}}>Vorhandene Dateien ({dateien.length})</strong><button type="button" className="ad-btn ad-sm" disabled={dateiBusy||!cloud.connected} onClick={()=>ladeDateien(dateiOrdner)}>↻ Dateiliste aktualisieren</button></div>
        <ul className="ad-upload-list">{(alleDateien?dateien:dateien.slice(0,8)).map(f=><li key={f.id}><span>{f.name}</span>{f.webUrl?<a href={f.webUrl} target="_blank" rel="noreferrer">Öffnen ↗</a>:<span className="ad-tiny">Gespeichert</span>}</li>)}</ul>
        {dateien.length>8&&<button type="button" className="ad-btn ad-sm" style={{marginTop:6}} onClick={()=>setAlleDateien(v=>!v)}>{alleDateien?'Weniger anzeigen':'Alle Dateien anzeigen'}</button>}
      </div>
    </div>
  </div>;
}

/* ============================================================
   TOUR-UI: freie Tage, spätere Einfügeaufträge, fixe Kalenderslots.
   Keine Outlook-Anlage/Änderung und keine OneDrive-Mutation in diesem Bereich.
   ============================================================ */
function TourenPlaner({akten,cloud,onPropose,onSaved}){
  const [date,setDate]=useState(()=>tpNextWeekday(2));
  const [mode,setMode]=useState('auto');
  const [selected,setSelected]=useState('');
  const [key,setKey]=useState(()=>{try{return sessionStorage.getItem(TP_KEY_STORE)||''}catch(e){return ''}});
  const [consent,setConsent]=useState(false);
  const [buffer,setBuffer]=useState(10);
  const [visitDuration,setVisitDuration]=useState(30);
  const [first,setFirst]=useState('09:00');
  const [last,setLast]=useState('18:00');
  const [departure,setDeparture]=useState('07:30');
  const [busy,setBusy]=useState(false);
  const [progress,setProgress]=useState('');
  const [error,setError]=useState('');
  const [notice,setNotice]=useState('');
  const [result,setResult]=useState(null);
  const [feedbackId,setFeedbackId]=useState('');
  const [feedbackNote,setFeedbackNote]=useState('');
  const [feedbackUntil,setFeedbackUntil]=useState('');
  const [savingFeedback,setSavingFeedback]=useState(false);
  const geoCache=useRef(new Map());
  const skipNextSignatureInvalidation=useRef(false);
  const fixed=akten.filter(a=>tpBooked(a)&&a.besichtigungDatum===date).sort((a,b)=>tpMin(a.besichtigungZeit)-tpMin(b.besichtigungZeit));
  const pending=akten.filter(tpMayInsert).sort((a,b)=>(a.auftragDatum||'').localeCompare(b.auftragDatum||''));
  const available=pending.filter(a=>tpAvailableForDay(a,date));
  const blocked=pending.map(a=>({akt:a,entry:tpUnavailableEntry(a,date)})).filter(x=>x.entry);
  useEffect(()=>{
    if(!selected||pending.some(a=>a.id===selected))return;
    const previous=result?.plan?.scheduled?.find(x=>x.id===selected&&x.type==='proposal');
    const actual=akten.find(a=>a.id===selected);
    // Auch bei einer nachträglich eingefügten Einzeltour verhindert die
    // Auswahlbereinigung das Verwerfen des gerade bestätigten Ergebnisses.
    const justAccepted=previous&&tpBooked(actual)&&actual.besichtigungDatum===date&&actual.besichtigungZeit===tpClock(previous.start);
    if(!justAccepted)setSelected('');
  },[selected,pending.map(a=>a.id).join('|')]);
  const chosen=available.find(a=>a.id===selected)||null;
  const signature=JSON.stringify(akten.map(a=>[a.id,statusKey(a),a.besichtigungDatum,a.besichtigungZeit,assistenzAdresse(a),a.terminAuftrag?.status,a.tourAusnahmen]));
  useEffect(()=>{setResult(null);setError('');},[date,mode,selected,buffer,visitDuration,first,last,departure]);
  useEffect(()=>{
    if(skipNextSignatureInvalidation.current){skipNextSignatureInvalidation.current=false;return;}
    if(result&&!tpSnapshotStatus(result,akten)){
      setResult(null);
      setNotice('Die Tourdaten haben sich außerhalb eines unverändert übernommenen Vorschlags geändert. Bitte die Tour neu berechnen.');
    }
  },[signature]);
  const keyChange=v=>{setKey(v);try{sessionStorage.setItem(TP_KEY_STORE,v)}catch(e){}setResult(null)};
  const berechnen=async(requestedMode=mode,overrides={})=>{
    if(busy)return;
    setError('');setNotice('');setResult(null);
    if(!key.trim()){setError('Bitte persönlichen HeiGIT-/openrouteservice-API-Schlüssel eintragen.');return;}
    if(!consent){setError('Vor Übermittlung der Adressen bitte die externe Routenberechnung ausdrücklich freigeben.');return;}
    if(!date){setError('Bitte einen Besichtigungstag auswählen.');return;}
    if(date<adDateLocal()&&requestedMode!=='existing'){setError('Neue Besichtigungen können nicht in einen vergangenen Tag eingeplant werden.');return;}
    if(![departure,first,last].every(t=>Number.isFinite(tpMin(t)))||tpMin(departure)>tpMin(first)||tpMin(first)+Number(visitDuration)>tpMin(last)){
      setError('Bitte gültige Zeiten eingeben: Abfahrt nicht nach dem ersten Termin und genügend Zeit für die interne Besichtigung.');return;
    }
    if(fixed.length>11){setError('Mehr als 11 bestehende Besichtigungen. Bitte die Tour für diesen Tag aufteilen.');return;}
    let candidates=[];
    if(requestedMode==='auto')candidates=pending.filter(a=>tpAvailableForDay(a,date,overrides));
    if(requestedMode==='insert'){
      if(!selected){setError('Bitte den einzelnen Auftrag auswählen. Für eine vollständige neue Tour stattdessen „Gesamttour automatisch“ verwenden.');return;}
      const pick=pending.find(a=>a.id===selected);
      if(!pick||!tpAvailableForDay(pick,date,overrides)){setError('Dieser Auftrag ist für den gewählten Besichtigungstag ausgeschlossen.');return;}
      candidates=[pick];
    }
    if(!fixed.length&&!candidates.length){setError('Für diesen Tag sind keine Termine beziehungsweise noch disponierbaren Aufträge vorhanden. Ausgeschlossene Aufträge können unten wieder freigegeben werden.');return;}
    // HeiGIT-Matrix begrenzen, ohne Fälle stillschweigend aus der Gesamtsuche zu entfernen.
    const maxCandidates=Math.max(0,25-fixed.length-1);
    const deferred=candidates.slice(maxCandidates);
    candidates=candidates.slice(0,maxCandidates);
    const basicAddress=a=>assistenzAdresse(a);
    const skipped=[];
    const valid=[];
    for(const a of candidates){
      const address=basicAddress(a);
      if(address==='Adresse fehlt'||!/\d/.test(address)){skipped.push({akt:a,reason:'Besichtigungsadresse unvollständig'});continue;}
      valid.push(a);
    }
    if(requestedMode==='insert'&&skipped.length){setError('Die Anschrift des ausgewählten Auftrags ist nicht vollständig. Bitte im Auftrag ergänzen.');return;}
    if(!fixed.length&&!valid.length){setError('Kein berechenbarer Auftrag: Bitte die Anschriften vervollständigen.');return;}
